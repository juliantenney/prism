ce__label" id="learner-workspace-a3-a3-template-section-a3-m2-section-qualified-evidence-synthesis-4-label" for="learner-workspace-a3-a3-template-section-a3-m2-section-qualified-evidence-synthesis-4">Qualified evidence synthesis</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m2-section-qualified-evidence-synthesis-4-desc">Record your response for Qualified evidence synthesis.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m2-section-qualified-evidence-synthesis-4" name="learner-workspace-a3-a3-template-section-a3-m2-section-qualified-evidence-synthesis-4" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m2-section-qualified-evidence-synthesis-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-evaluations-to-carry-forward-5" data-response-part-id="A3-template-section-a3-m2-section-evaluations-to-carry-forward-5"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m2-section-evaluations-to-carry-forward-5-label" for="learner-workspace-a3-a3-template-section-a3-m2-section-evaluations-to-carry-forward-5">Evaluations to carry forward</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m2-section-evaluations-to-carry-forward-5-desc">Keep the final section brief enough to save or copy for the next component. Include the conclusions you can support, their important limits and the uncertainties that should inform later consideration of Option A, Option B and Option C. Do not choose among those options here.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m2-section-evaluations-to-carry-forward-5" name="learner-workspace-a3-a3-template-section-a3-m2-section-evaluations-to-carry-forward-5" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m2-section-evaluations-to-carry-forward-5-desc"></textarea></div></div></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a3" data-composition-moment="check" data-activity-id="A3" aria-labelledby="learner-check-a3-heading"><h3 class="util-composition-moment-heading" id="learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a3">Back to your task (Synthesize Evidence and Preserve Uncertainty)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Use the diagnostic feedback to review the strength of your reasoning and revise your synthesis or qualification where needed.</p></span></div><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M6" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m6" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m6-c-0" data-revision-criterion-id="a3-m6-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you integrated all four sources while preserving what each can actually establish?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A synthesis becomes misleading if it turns distinct observations into a single unsupported claim about the university&#39;s situation.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your synthesis identifies a defensible contribution from each of the four evidence records.</li><li><span class="util-guided-review__feature-key">B.</span> Your conclusions distinguish directly recorded particulars from broader interpretations.</li><li><span class="util-guided-review__feature-key">C.</span> The synthesis does not treat all sources as interchangeable measures of one phenomenon.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Check which source is missing and add the specific observation, reported concern or provisional condition it contributes.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Mark where your wording moves beyond a recorded value or condition and narrow that claim to what the record supports.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Separate claims about preferences, observed use, access experiences and resource implications before connecting their significance.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m6-item-0" data-checklist-item-id="checklist-a3-a3-m6-item-0"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m6-item-0">My synthesis preserves each source&#39;s contribution</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m6-c-1" data-revision-criterion-id="a3-m6-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you handled apparent conflict and unsupported connections without inventing a resolution?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A synthesis can falsely imply agreement or contradiction when sources address different questions.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your discussion identifies the distinct observations behind any apparent disagreement.</li><li><span class="util-guided-review__feature-key">B.</span> Any claim that one source confirms, refutes or predicts another is supported by an identifiable relationship in the evidence.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State which phenomenon each source records before deciding whether the findings are incompatible.</li><li><span class="util-guided-review__feature-key">Missing B:</span> If the relationship is not established, replace the confirmation, contradiction or prediction with a qualified statement of what remains unknown.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m6-item-1" data-checklist-item-id="checklist-a3-a3-m6-item-1"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m6-item-1">My synthesis does not force agreement or conflict</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m6-c-2" data-revision-criterion-id="a3-m6-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you identified unresolved uncertainties and explained how they constrain your overall conclusion?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An uncertainty is consequential only when it changes the scope or confidence of the conclusion being drawn.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your synthesis names specific missing information or unestablished relationships.</li><li><span class="util-guided-review__feature-key">B.</span> Your overall conclusion is qualified in ways that correspond to those uncertainties.</li><li><span class="util-guided-review__feature-key">C.</span> Your carry-forward record retains the limitations most relevant to later consideration of the options.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the population inference, changed-condition prediction, prevalence claim or provisional estimate that cannot be resolved from the supplied records.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Revise the affected sentence so it does not imply that the unresolved relationship has already been established.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Add a short note identifying which claims remain uncertain and should not be treated as settled evidence in the next component.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m6-item-2" data-checklist-item-id="checklist-a3-a3-m6-item-2"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m6-item-2">My uncertainties shape my conclusion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m6-c-3" data-revision-criterion-id="a3-m6-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you rewritten the briefing using only supported particulars, without adding facts or recommending an action?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The transfer task tests whether you can correct overextended claims while preserving the evidence, rather than replacing one unsupported account with another.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> You identify accurate reported particulars in the original briefing.</li><li><span class="util-guided-review__feature-key">B.</span> You identify at least two overextended claims and explain the evidential limitation affecting each.</li><li><span class="util-guided-review__feature-key">C.</span> Your replacement briefing retains the established particulars, qualifies unsupported conclusions and avoids selecting Option A, B or C.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Locate the figures or observations that match the evidence records and retain them accurately in your evaluation.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Compare the broader claim with the source&#39;s participation, observation or reporting conditions, then state the inference that is not established.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Remove any new facts or policy recommendation, and rewrite the relevant conclusion so it stays within the supplied evidence.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m6-item-3" data-checklist-item-id="checklist-a3-a3-m6-item-3"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m6-item-3">My replacement briefing is evidence-bounded</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A3"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M4" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Qualify a Briefing Claim</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910" data-response-part-id="A3-transfer-prompt-a3-m4-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910-label" for="learner-workspace-a3-a3-transfer-prompt-a3-m4-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910-desc"><p>A university briefing can combine accurate observations with conclusions that go beyond them. Apply your evidence-evaluation approach to the <strong>separate fictional briefing statement</strong>.</p><p>Identify which claims are directly supported by the established records and which extend beyond them. Explain the limitation affecting each unsupported claim. Then write a short replacement briefing that retains the reported particulars but qualifies conclusions the evidence cannot establish.</p><p>Use only the supplied evidence. Do not introduce new facts, predict future attendance or recommend an opening-hours option.</p></div><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910" name="learner-workspace-a3-a3-transfer-prompt-a3-m4-910" rows="5" aria-describedby="learner-workspace-a3-a3-transfer-prompt-a3-m4-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><aside class="util-study-tips" data-region="study-tips" id="journey-study-tips" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--study-tips" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg></span><span class="util-semantic-icon__label">Study tips</span></h2><div class="util-study-tips__content util-prose-measure"><ul><li><strong>Evaluate claims, not source labels.</strong> Relevance, credibility and reliability help establish what a particular observation can reasonably support; limitations determine how far the conclusion can extend.</li><li><strong>Weigh evidence against the question.</strong> Survey preferences, historical usage, access concerns and provisional costs address different aspects of the library situation. Their significance changes with the question being investigated.</li><li><strong>Preserve uncertainty in your synthesis.</strong> Apparent disagreement does not necessarily mean contradiction. Identify which relationships remain unestablished rather than inventing a resolution.</li><li><strong>Keep your work for the next component.</strong> Save your four source evaluations, principal comparisons and unresolved uncertainties. You will need them when considering the opening-hours options; responses are not transferred automatically.</li></ul></div></aside><style id="prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="true"]{display:block;position:fixed;top:var(--learner-sticky-nav-height,0px);left:0;right:0;z-index:40;margin:0 auto;max-width:42rem;width:calc(100% - 1.5rem);padding:.45rem .75rem;border:1px solid #cbd5e1;border-left:3px solid #64748b;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.12)}.util-learner-renderer-vnext .util-revision-reminder__chrome{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.35rem .75rem;margin:0 0 .2rem}.util-learner-renderer-vnext .util-revision-reminder__label{margin:0;font-size:.75rem;font-weight:650;color:#64748b}.util-learner-renderer-vnext .util-revision-reminder__statement{margin:0;font-size:.9rem;line-height:1.4;font-weight:600;color:#0f172a}.util-learner-renderer-vnext .util-revision-reminder__view{font:inherit;font-size:.9rem;color:#1d4ed8;background:transparent;border:0;padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer}.util-learner-renderer-vnext .util-revision-reminder__view:focus{outline:2px solid #2563eb;outline-offset:2px}</style></article></template><template id="lj-resource-c3"><article class="util-learner-page util-page util-learner-renderer-vnext" data-renderer="vnext" data-page-kind="interactive" data-persistence-page-key="v1::a5602db9-58d2-487c-9e03-d3346917fe10::learner-page::2.0.0::a1-a2-a3::choosing-and-justifying-a-library-policy" data-persistence-storage-key="learner-renderer-vnext:draft:v1::a5602db9-58d2-487c-9e03-d3346917fe10::learner-page::2.0.0::a1-a2-a3::choosing-and-justifying-a-library-policy" data-composition-mode="moments" data-composed-activity-count="3" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">From Evidence to Justified Action</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="5"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 5"><span class="util-journey-position__visible" aria-hidden="true">1 of 5</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#activity-A1" aria-label="Next section: Compare Library Policy Trade-offs"><span class="util-journey-adjacent__title">Compare Library Policy Trade-offs</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#activity-A1">Compare Library Policy Trade-offs</a></li><li><a class="util-journey-all-link" href="#activity-A2">Defend Your Provisional Decision</a></li><li><a class="util-journey-all-link" href="#activity-A3">Qualify and Preserve Your Decision</a></li><li><a class="util-journey-all-link" href="#journey-study-tips">Study tips</a></li></ul></div></div></nav><section class="util-page-orientation" data-region="orientation"><div id="journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>This self-directed resource uses a fictional university library decision to explore how evaluated evidence can inform a justified action. Begin by comparing three opening-hours policies, then select and defend a provisional recommendation. Finally, examine the assumptions and uncertainties affecting your confidence and retain your original reasoning for later reconsideration. The activities take approximately 30 minutes.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>The three activities form a connected progression: <strong>compare alternatives</strong>, <strong>justify a provisional choice</strong>, and <strong>qualify that choice</strong>. Your comparison provides the basis for your recommendation; your recommendation then becomes the subject of your uncertainty and confidence review. Use your own responses throughout. Earlier work is not transferred automatically.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><p>A justified policy decision connects <strong>evidence</strong>, <strong>interpretation</strong>, <strong>priorities</strong> and <strong>comparison</strong> to a clearly stated action. Evidence establishes particular observations; interpretation considers what those observations may imply for possible actions. Assumptions identify conditions on which reasoning depends but which the available evidence does not establish.</p><p>In the fictional university library case, the available actions are <strong>Option A: maintain existing opening hours</strong>, <strong>Option B: extend opening hours throughout the examination period</strong>, and <strong>Option C: introduce targeted extensions during periods of greatest anticipated demand</strong>. Each option must be considered against student access needs, equity, staffing and operational implications, competing priorities and unresolved uncertainty.</p><p>The four original evidence sources support different, limited claims. A voluntary survey recorded <strong>168 supporters of extended hours among 240 respondents</strong>, drawn from approximately <strong>12,000 students</strong>. The 70% figure describes respondents, not the student population, and voluntary participation limits generalisation. Historical building-access records indicate relatively low late-evening occupancy under previous arrangements, but do not establish demand under extended opening hours. Limited student comments identify unequal access to suitable study space without establishing its prevalence. Staffing, security and operational costs are provisional, so their precise amounts and comparative implications remain unresolved.</p><p><strong>Comparative reasoning</strong> examines what each action might achieve, what it may require and what could be forgone. A trade-off connects competing consequences rather than treating an isolated advantage as decisive. Evidence can inform these comparisons, but it does not independently determine how much weight to assign to access, equity, resource commitments or uncertainty.</p><p>A <strong>provisional recommendation</strong> selects one action and explains why it is preferable to both alternatives under explicitly stated priorities. Its strength depends on accurate evidence use, meaningful comparison and acknowledgement of accepted trade-offs. No single option is predetermined as correct: different choices may be defensible when their reasoning is transparent and proportionate to the available evidence.</p><p><strong>Confidence</strong> concerns the strength of the evidence and reasoning supporting the recommendation, not certainty that the policy will succeed. Consequential assumptions and unresolved uncertainties should therefore be identified and connected to the judgement. Retaining the original action, reasons, priorities, assumptions and confidence makes subsequent reconsideration possible without retrospectively changing the initial decision.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c3/knowledge-summary-after-content.png" alt="Concept map linking library evidence, policy comparison, provisional choice and confidence; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption" id="figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><strong>Figure 1.</strong> The map begins with four evidence categories: the voluntary survey, historical access records, limited student comments and provisional operational costs. Their limitations accompany them into comparison of Options A, B and C across access, equity, resources and uncertainty. Comparison identifies trade-offs, while explicitly weighted priorities inform a provisional choice. The chosen action is justified against both alternatives. Consequential assumptions and unresolved uncertainties qualify the confidence attached to that judgement. The original reasoning is retained for later reconsideration. No option is preferred by the map.</figcaption></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Compare the three established library opening-hours options using evaluated evidence to explain their relative advantages, disadvantages and trade-offs in relation to student access needs, operational costs and competing priorities. <span class="util-outcome-id">(LO1)</span></li><li>Select and justify a provisional library opening-hours policy by connecting the chosen action to relevant evidence, explicitly weighted priorities and a reasoned comparison with both alternatives. <span class="util-outcome-id">(LO2)</span></li><li>Qualify the provisional recommendation by identifying consequential assumptions, explaining unresolved uncertainties and justifying a degree of confidence proportionate to the available evidence and reasoning. <span class="util-outcome-id">(LO3)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Compare Library Policy Trade-offs</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Earlier work distinguished evidence from inference and examined the reliability and significance of competing sources. The next intellectual step is to connect those evaluations to possible actions. Rather than deciding which source is strongest in isolation, you will consider what each source implies for the relative merits of three policy alternatives.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>The university must decide whether to maintain existing library opening hours, extend them throughout the examination period, or introduce targeted extensions. You have approximately 15 minutes to compare these alternatives before making a recommendation. If you completed the earlier evidence-evaluation activity (c2), revisit your own judgements about the survey, building-access records, student comments and provisional costs. Use those judgements to inform your comparison. Your earlier responses have not been transferred automatically. The original evidence and its limitations are provided here so you can complete this activity independently.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Move from source evaluation to action comparison. For each alternative, consider what the available evidence supports, what remains uncertain, who may benefit or be disadvantaged, and which resource commitments may follow. Compare relative consequences rather than treating any single source or criterion as decisive.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which differences between the three options matter most to your comparison, and why have you given those considerations greater weight than others?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A1"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Examine the three established library options and the four original evidence sources.</p></span></div></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a1-comparison-framework-01-activity-a1-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c3/activity-a1-materials-entry.png" alt="Framework for comparing three library policies through evidence, consequences and priorities; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-a1-comparison-framework-01-activity-a1-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption" id="figure-description-asset-vb-38-4-va-a1-comparison-framework-01-activity-a1-materials-entry"><strong>Figure 2.</strong> The framework identifies three alternatives: maintaining existing hours, extending hours throughout the examination period, and introducing targeted extensions. Each is examined through the same categories: evidence and limitations, potential access and equity consequences, staffing and operational implications, and uncertainty. These considerations inform trade-offs between possible gains and commitments. Learner-selected priorities determine which trade-offs receive greater weight. No option is ranked or recommended, and no comparison entries are completed.</figcaption></figure><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A1-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">From Evidence Evaluation to Policy Comparison</span></p><h3 class="util-md-heading util-md-heading--source-2">Comparing actions using evaluated evidence</h3><p>Evaluating evidence asks whether a source is credible, relevant and sufficiently informative for a particular claim. Comparing actions asks a different question: <strong>what would each possible decision mean, given the evidence and its limitations?</strong></p><p>A source can be useful without settling the decision. Evidence of student preferences may matter when considering access, while historical use may matter when considering likely demand. Neither automatically determines the best opening-hours policy. Operational commitments also matter, even when their precise costs remain provisional.</p><h3 class="util-md-heading util-md-heading--source-3">Dimensions of comparison</h3><p><strong>Student access and equity.</strong> Consider whether an option could affect students&#39; opportunities to use suitable study space. Distinguish potential benefits from benefits that have been demonstrated.</p><p><strong>Demand and use.</strong> Consider what is known about previous library use and what remains unknown about use under different opening arrangements.</p><p><strong>Staffing and operations.</strong> Consider what an option may require in staffing, security and other resources. Avoid treating provisional costs as confirmed figures.</p><p><strong>Consequences and trade-offs.</strong> A policy can offer a potential advantage while also creating a disadvantage or resource commitment. A trade-off explains why these competing consequences matter together.</p><p><strong>Priorities.</strong> Evidence helps establish what is known, but it does not assign the importance of access, equity, resource use or uncertainty on your behalf. Different priorities can support different defensible recommendations.</p><h3 class="util-md-heading util-md-heading--source-3">A useful reasoning distinction</h3><p>An <strong>observation</strong> reports something recorded or supplied in the case. An <strong>inference</strong> explains what that observation might imply for an option. A <strong>trade-off</strong> explains what may be gained, forgone or placed at risk when acting on that inference.</p><p>Keep these stages visible in your comparison. You do not need to calculate a score or identify a winning option yet.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Complete the comparison workspace for Options A, B and C. For each option, identify relevant evidence, potential benefits for student access, staffing and operational implications, and important disadvantages or uncertainties.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A1-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated Library Decision: Options and Evidence</span></p><h3 class="util-md-heading util-md-heading--source-2">The university library decision</h3><p><strong>Fictional, simulated educational case.</strong> A university is considering whether to change its library opening hours during the examination period. Decision-makers must consider student access, potential demand and operational resources. The evidence below is the original evidence available for this decision. No further survey records, occupancy figures, student quotations or cost estimates are supplied.</p><h3 class="util-md-heading util-md-heading--source-3">The three options</h3><ul><li><strong>Option A — Maintain existing opening hours.</strong> Continue the current opening arrangements during the examination period.</li><li><strong>Option B — Extend opening hours throughout the examination period.</strong> Make extended opening hours available across the examination period.</li><li><strong>Option C — Introduce targeted extensions.</strong> Extend opening hours during periods of greatest anticipated demand rather than throughout the entire examination period.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Evidence unit 1: Voluntary student survey</h3><ul><li>Approximate university student population: <strong>12,000</strong>.</li><li>Number of voluntary survey respondents: <strong>240</strong>.</li><li>Respondents supporting extended library opening hours: <strong>168</strong>.</li><li>This represents <strong>70% of respondents</strong>, not 70% of the student population.</li><li>Participation was voluntary. Students who chose to respond may differ from those who did not, so the result cannot be assumed to represent the preferences of all students.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Evidence unit 2: Historical building-access records</h3><ul><li>Building-access records from previous opening arrangements show <strong>relatively low late-evening occupancy</strong>.</li><li>These records describe use under the previous arrangements.</li><li>They do <strong>not establish how many students would use the library if opening hours were extended</strong>.</li><li>No further occupancy counts, hourly breakdowns or forecasts are available.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Evidence unit 3: Student comments about study-space access</h3><ul><li>A <strong>limited number of student comments</strong> identify unequal access to suitable study space.</li><li>The available comments do not establish how widespread these difficulties are.</li><li>No verbatim comments, respondent characteristics or prevalence estimates are supplied.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Evidence unit 4: Operational costs</h3><ul><li><strong>Staffing, security and operational costs</strong> are relevant to changes in library opening hours.</li><li>The available cost information is <strong>provisional</strong>.</li><li>No confirmed monetary amounts or definitive comparative cost estimates are supplied.</li></ul><p>Use these four evidence units when comparing the three options. Keep the recorded observations separate from predictions about what each policy might achieve.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain at least one consequential trade-off for each option. Distinguish what the evidence establishes from what you infer about possible consequences.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a1-a1-m3" data-material-source-id="A1-M3" data-activity-id="A1"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A1-M3" data-material-type="comparison_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Three-Option Comparison Workspace</span></p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="a1-a1-m3-col-option-0">Option</th><th scope="col" id="a1-a1-m3-col-relevant-evidence-and-limitations-1">Relevant evidence and limitations</th><th scope="col" id="a1-a1-m3-col-potential-access-and-equity-benefits-2">Potential access and equity benefits</th><th scope="col" id="a1-a1-m3-col-staffing-and-operational-implications-3">Staffing and operational implications</th><th scope="col" id="a1-a1-m3-col-disadvantages-or-uncertainties-4">Disadvantages or uncertainties</th><th scope="col" id="a1-a1-m3-col-consequential-trade-offs-5">Consequential trade-offs</th></tr></thead><tbody><tr><th scope="row" id="a1-a1-m3-row-0" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed"><strong>Option A — Maintain existing hours</strong></th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r0-c1" name="a1-a1-m3-input-r0-c1" data-learner-cell="a1-a1-m3-input-r0-c1" rows="3" aria-labelledby="a1-a1-m3-row-0 a1-a1-m3-col-relevant-evidence-and-limitations-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r0-c2" name="a1-a1-m3-input-r0-c2" data-learner-cell="a1-a1-m3-input-r0-c2" rows="3" aria-labelledby="a1-a1-m3-row-0 a1-a1-m3-col-potential-access-and-equity-benefits-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r0-c3" name="a1-a1-m3-input-r0-c3" data-learner-cell="a1-a1-m3-input-r0-c3" rows="3" aria-labelledby="a1-a1-m3-row-0 a1-a1-m3-col-staffing-and-operational-implications-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r0-c4" name="a1-a1-m3-input-r0-c4" data-learner-cell="a1-a1-m3-input-r0-c4" rows="3" aria-labelledby="a1-a1-m3-row-0 a1-a1-m3-col-disadvantages-or-uncertainties-4" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r0-c5" name="a1-a1-m3-input-r0-c5" data-learner-cell="a1-a1-m3-input-r0-c5" rows="3" aria-labelledby="a1-a1-m3-row-0 a1-a1-m3-col-consequential-trade-offs-5" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a1-a1-m3-row-1" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed"><strong>Option B — Extend throughout the examination period</strong></th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r1-c1" name="a1-a1-m3-input-r1-c1" data-learner-cell="a1-a1-m3-input-r1-c1" rows="3" aria-labelledby="a1-a1-m3-row-1 a1-a1-m3-col-relevant-evidence-and-limitations-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r1-c2" name="a1-a1-m3-input-r1-c2" data-learner-cell="a1-a1-m3-input-r1-c2" rows="3" aria-labelledby="a1-a1-m3-row-1 a1-a1-m3-col-potential-access-and-equity-benefits-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r1-c3" name="a1-a1-m3-input-r1-c3" data-learner-cell="a1-a1-m3-input-r1-c3" rows="3" aria-labelledby="a1-a1-m3-row-1 a1-a1-m3-col-staffing-and-operational-implications-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r1-c4" name="a1-a1-m3-input-r1-c4" data-learner-cell="a1-a1-m3-input-r1-c4" rows="3" aria-labelledby="a1-a1-m3-row-1 a1-a1-m3-col-disadvantages-or-uncertainties-4" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r1-c5" name="a1-a1-m3-input-r1-c5" data-learner-cell="a1-a1-m3-input-r1-c5" rows="3" aria-labelledby="a1-a1-m3-row-1 a1-a1-m3-col-consequential-trade-offs-5" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a1-a1-m3-row-2" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed"><strong>Option C — Introduce targeted extensions</strong></th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r2-c1" name="a1-a1-m3-input-r2-c1" data-learner-cell="a1-a1-m3-input-r2-c1" rows="3" aria-labelledby="a1-a1-m3-row-2 a1-a1-m3-col-relevant-evidence-and-limitations-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r2-c2" name="a1-a1-m3-input-r2-c2" data-learner-cell="a1-a1-m3-input-r2-c2" rows="3" aria-labelledby="a1-a1-m3-row-2 a1-a1-m3-col-potential-access-and-equity-benefits-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r2-c3" name="a1-a1-m3-input-r2-c3" data-learner-cell="a1-a1-m3-input-r2-c3" rows="3" aria-labelledby="a1-a1-m3-row-2 a1-a1-m3-col-staffing-and-operational-implications-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r2-c4" name="a1-a1-m3-input-r2-c4" data-learner-cell="a1-a1-m3-input-r2-c4" rows="3" aria-labelledby="a1-a1-m3-row-2 a1-a1-m3-col-disadvantages-or-uncertainties-4" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r2-c5" name="a1-a1-m3-input-r2-c5" data-learner-cell="a1-a1-m3-input-r2-c5" rows="3" aria-labelledby="a1-a1-m3-row-2 a1-a1-m3-col-consequential-trade-offs-5" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify which decision criteria you consider most important and explain your weighting. Compare the options without selecting a final recommendation yet.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A1-M4" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Priorities and Consequential Differences</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Use the diagnostic review to identify any unsupported claims, neglected alternatives or trade-offs requiring further consideration.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A completed three-option comparison that uses the established evidence accurately, distinguishes observed findings from inferred consequences, identifies meaningful access and resource trade-offs for every alternative, and explains the learner&#39;s independently chosen priorities. The comparison should preserve uncertainty about future demand and provisional costs rather than treating either as settled. It should provide a defensible basis for subsequent selection without predetermining the preferred policy.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m4-section-most-important-decision-criteria-1" data-response-part-id="A1-template-section-a1-m4-section-most-important-decision-criteria-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-template-section-a1-m4-section-most-important-decision-criteria-1-label" for="learner-workspace-a1-a1-template-section-a1-m4-section-most-important-decision-criteria-1">Most important decision criteria</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-template-section-a1-m4-section-most-important-decision-criteria-1-desc">Identify the considerations you think should carry greatest weight, such as student access, equity, resource commitments or uncertainty. You may choose other relevant criteria grounded in the case.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-template-section-a1-m4-section-most-important-decision-criteria-1" name="learner-workspace-a1-a1-template-section-a1-m4-section-most-important-decision-criteria-1" rows="6" aria-describedby="learner-workspace-a1-a1-template-section-a1-m4-section-most-important-decision-criteria-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m4-section-reasons-for-weighting-these-criteria-2" data-response-part-id="A1-template-section-a1-m4-section-reasons-for-weighting-these-criteria-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-template-section-a1-m4-section-reasons-for-weighting-these-criteria-2-label" for="learner-workspace-a1-a1-template-section-a1-m4-section-reasons-for-weighting-these-criteria-2">Reasons for weighting these criteria</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-template-section-a1-m4-section-reasons-for-weighting-these-criteria-2-desc">Explain why these considerations matter more to you than competing considerations. Make your reasoning explicit rather than assigning unsupported numerical scores.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-template-section-a1-m4-section-reasons-for-weighting-these-criteria-2" name="learner-workspace-a1-a1-template-section-a1-m4-section-reasons-for-weighting-these-criteria-2" rows="6" aria-describedby="learner-workspace-a1-a1-template-section-a1-m4-section-reasons-for-weighting-these-criteria-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m4-section-most-consequential-differences-between-options-3" data-response-part-id="A1-template-section-a1-m4-section-most-consequential-differences-between-options-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-template-section-a1-m4-section-most-consequential-differences-between-options-3-label" for="learner-workspace-a1-a1-template-section-a1-m4-section-most-consequential-differences-between-options-3">Most consequential differences between options</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-template-section-a1-m4-section-most-consequential-differences-between-options-3-desc">Identify the differences between Options A, B and C that matter most under your priorities. Explain how the evidence and its limitations affect those differences.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-template-section-a1-m4-section-most-consequential-differences-between-options-3" name="learner-workspace-a1-a1-template-section-a1-m4-section-most-consequential-differences-between-options-3" rows="6" aria-describedby="learner-workspace-a1-a1-template-section-a1-m4-section-most-consequential-differences-between-options-3-desc"></textarea></div></div></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a1" data-composition-moment="check" data-activity-id="A1" aria-labelledby="learner-check-a1-heading"><h3 class="util-composition-moment-heading" id="learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a1">Back to your task (Compare Library Policy Trade-offs)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M5" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m5" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m5-c-0" data-revision-criterion-id="a1-m5-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you used the original evidence accurately and acknowledged its limitations?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Misrepresenting the survey, occupancy records or other evidence can make an option appear better supported than it is.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Survey claims distinguish 168 supporters among 240 voluntary respondents from the approximately 12,000 students.</li><li><span class="util-guided-review__feature-key">B.</span> Historical occupancy is described as evidence about previous arrangements, not a forecast of demand under extended hours.</li><li><span class="util-guided-review__feature-key">C.</span> Student comments and provisional costs are represented without invented prevalence figures or monetary amounts.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Correct any statement that treats the survey percentage as the percentage of all students, and identify the voluntary participation limitation.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Separate the recorded low late-evening occupancy from any prediction you make about use under a changed policy.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Remove unsupported numbers or claims of representativeness, and qualify the comments as limited and the costs as provisional.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m5-item-0" data-checklist-item-id="checklist-a1-a1-m5-item-0"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m5-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m5-c-1" data-revision-criterion-id="a1-m5-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you meaningfully compared all three available policies?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A comparison that overlooks an alternative cannot establish why the eventual recommendation is preferable to the full range of available choices.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Options A, B and C each have a substantive comparison entry.</li><li><span class="util-guided-review__feature-key">B.</span> The same major decision criteria are considered across the three options.</li><li><span class="util-guided-review__feature-key">C.</span> Comparisons identify meaningful differences rather than repeating the option descriptions.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Complete any missing option row with evidence-based consideration of its possible consequences.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Revisit rows that discuss access for one option but omit it for others, or that discuss resource commitments inconsistently.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain how the consequences or uncertainties of one option differ from those of another under a shared criterion.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m5-item-1" data-checklist-item-id="checklist-a1-a1-m5-item-1"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m5-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m5-c-2" data-revision-criterion-id="a1-m5-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you identified consequential trade-offs involving access, resources and uncertainty?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without trade-offs, the comparison may become a list of isolated benefits and drawbacks rather than an account of what decision-makers must balance.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Potential access benefits are considered alongside possible staffing or operational commitments.</li><li><span class="util-guided-review__feature-key">B.</span> Uncertainty about future demand is acknowledged where it affects the comparison.</li><li><span class="util-guided-review__feature-key">C.</span> Each option has at least one trade-off explaining what may be gained, forgone or placed at risk.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Connect the access consequences you anticipate to the resources that may be required to achieve them.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Qualify predictions about use under extended arrangements and explain why historical occupancy cannot settle them.</li><li><span class="util-guided-review__feature-key">Missing C:</span> For any option with only a benefit or drawback listed, identify the competing consequence and explain the tension between them.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m5-item-2" data-checklist-item-id="checklist-a1-a1-m5-item-2"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m5-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m5-c-3" data-revision-criterion-id="a1-m5-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you explained your own decision priorities rather than assuming the evidence assigns their weight?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Unstated priorities can conceal the value judgements that make one policy seem preferable to another.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The most important decision criteria are identified explicitly.</li><li><span class="util-guided-review__feature-key">B.</span> Reasons are given for weighting those criteria more heavily than competing considerations.</li><li><span class="util-guided-review__feature-key">C.</span> The identified consequential differences relate to the stated priorities.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the access, equity, operational or other relevant criteria that will guide your later recommendation.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain why your leading criteria deserve greater importance in this university library decision.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Connect the differences you consider decisive to the criteria you have chosen, without selecting a final option prematurely.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m5-item-3" data-checklist-item-id="checklist-a1-a1-m5-item-3"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m5-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Defend Your Provisional Decision</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your comparison established the relative advantages, disadvantages and uncertainties of Options A, B and C. You also identified which considerations deserve greatest weight. You will now use that analysis to move from comparing possibilities to selecting and defending one action, while acknowledging the legitimate merits of the alternatives.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have compared the three library policies and identified the considerations that matter most to you. Now make your first explicit provisional recommendation. There is no predetermined correct option: your responsibility is to explain why your choice is defensible using the available evidence and your stated priorities. This activity forms the main independent composition task within the second approximately 15-minute phase.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Make an evaluative judgement rathe
