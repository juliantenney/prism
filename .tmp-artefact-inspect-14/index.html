p class="util-guided-review__statement">Does your final principle explain evidence-responsive judgement without demanding automatic revision or certainty?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The transferable skill is the ability to adjust a judgement to the significance of evidence while remaining appropriately cautious about what is still unknown.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My principle connects reconsideration to consequential changes in evidence or assumptions.</li><li><span class="util-guided-review__feature-key">B.</span> My principle allows a recommendation to remain unchanged when the combined evidence warrants it.</li><li><span class="util-guided-review__feature-key">C.</span> My principle recognises confidence and uncertainty as part of a provisional judgement.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State that the reason to reconsider is the effect of evidence on the decision&#39;s justification, not simply the fact that information is new.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Acknowledge that maintenance can be justified after serious consideration of challenging findings.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain how a decision can remain defensible while confidence is qualified and future evidence could still alter the balance.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a4-a4-m4-item-3" data-checklist-item-id="checklist-a4-a4-m4-item-3"><label class="util-interactive-checklist__label" for="checklist-a4-a4-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A4"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M2" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Apply Evidence-Responsive Judgement to Academic Support</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-transfer-prompt-a4-m2-910" data-response-part-id="A4-transfer-prompt-a4-m2-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a4-a4-transfer-prompt-a4-m2-910-label" for="learner-workspace-a4-a4-transfer-prompt-a4-m2-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="learner-workspace-a4-a4-transfer-prompt-a4-m2-910-desc"><p>Using the fictional <strong>academic support sessions</strong> case, write a concise response that:</p><ol><li>Identifies the department&#39;s <strong>original provisional recommendation</strong> and the reasoning behind it.</li><li>Explains which assumption, interpretation or trade-off is affected by the later findings about concentrated session use and comparative resource requirements.</li><li>Distinguishes what the new information <strong>actually establishes</strong> from a prediction it cannot justify about future attendance.</li><li>Defends whether the department should <strong>maintain, qualify or revise</strong> its original recommendation, identifying the resulting preferred provision option and weighing at least one competing consideration.</li><li>States how confident you would be in that reconsidered judgement and explains what limits your confidence.</li></ol><p>Your response should be a connected, evidence-based judgement rather than a list of findings. More than one outcome can be defensible. Do not assume that the department must change its recommendation simply because new evidence has become available.</p><p><strong>Your transfer response:</strong></p><p>[Write your independent judgement here.]</p></div><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-transfer-prompt-a4-m2-910" name="learner-workspace-a4-a4-transfer-prompt-a4-m2-910" rows="5" aria-describedby="learner-workspace-a4-a4-transfer-prompt-a4-m2-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><aside class="util-study-tips" data-region="study-tips" id="journey-study-tips" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--study-tips" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg></span><span class="util-semantic-icon__label">Study tips</span></h2><div class="util-study-tips__content util-prose-measure"><ul><li><strong>Start with the decision actually made.</strong> Revisit its evidence, assumptions and uncertainties before judging the significance of later information.</li><li><strong>Separate observation from inference.</strong> Historical use, reported access difficulties and revised cost estimates can change the balance of reasons without establishing future demand.</li><li><strong>Reconsider proportionately.</strong> Maintaining, qualifying and revising are all defensible when supported by a fair comparison of evidence, trade-offs and limitations; confidence may change independently of the preferred option.</li><li><strong>Make judgements revisable for a reason.</strong> Identify the consequential uncertainty, the further evidence that could address it, and how a plausible finding might affect the decision.</li></ul></div></aside><style id="prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="true"]{display:block;position:fixed;top:var(--learner-sticky-nav-height,0px);left:0;right:0;z-index:40;margin:0 auto;max-width:42rem;width:calc(100% - 1.5rem);padding:.45rem .75rem;border:1px solid #cbd5e1;border-left:3px solid #64748b;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.12)}.util-learner-renderer-vnext .util-revision-reminder__chrome{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.35rem .75rem;margin:0 0 .2rem}.util-learner-renderer-vnext .util-revision-reminder__label{margin:0;font-size:.75rem;font-weight:650;color:#64748b}.util-learner-renderer-vnext .util-revision-reminder__statement{margin:0;font-size:.9rem;line-height:1.4;font-weight:600;color:#0f172a}.util-learner-renderer-vnext .util-revision-reminder__view{font:inherit;font-size:.9rem;color:#1d4ed8;background:transparent;border:0;padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer}.util-learner-renderer-vnext .util-revision-reminder__view:focus{outline:2px solid #2563eb;outline-offset:2px}</style></article></template><template id="lj-resource-c5"><article class="util-learner-page util-page util-learner-renderer-vnext util-page--assessment" data-renderer="vnext" data-page-kind="assessment" data-persistence-page-key="v1::d5e600ea-ba0f-4a20-9f62-e32b5bfeed6e::learner-page::2.0.0::no-activities::independent-evidence-informed-judgement" data-persistence-storage-key="learner-renderer-vnext:draft:v1::d5e600ea-ba0f-4a20-9f62-e32b5bfeed6e::learner-page::2.0.0::no-activities::independent-evidence-informed-judgement" data-composition-mode="moments" data-composed-activity-count="0" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Independent Evidence-Informed Judgement</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="3"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Briefing</span><p class="util-journey-position" aria-label="Section 1 of 3"><span class="util-journey-position__visible" aria-hidden="true">1 of 3</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#journey-assessment-judgement" aria-label="Next section: Judgement"><span class="util-journey-adjacent__title">Judgement</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#journey-assessment-briefing" aria-current="location">Briefing</a></li><li><a class="util-journey-all-link" href="#journey-assessment-judgement">Judgement</a></li><li><a class="util-journey-all-link" href="#journey-assessment-pack-forward">Take forward</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c5/editorial-opening.png" alt="A school entrance beside a residential street, with pedestrians on the pavement and several vehicles travelling or parked nearby." loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> An everyday street scene outside a British school during a busy arrival or departure period.</figcaption></figure></div><section id="journey-assessment-briefing" class="util-assessment-intro" data-region="assessment-intro" data-journey-section="true"><p>In this assessment, you will make an independent recommendation about a fictional local authority&#39;s traffic-management decision near a school. You will work with incomplete evidence, consider three possible actions and explain a provisional judgement. The purpose is to make your reasoning visible, not to identify a single correct answer. Different recommendations can be defensible when supported by careful evaluation and justification. Allow approximately 25 minutes. All the information you need is provided, and no specialist transport-planning knowledge or external research is required.</p><p>Read the local authority briefing and the accompanying evidence before writing your response.

Prepare one sustained written judgement of approximately 350–500 words. The suggested length is a guide rather than a strict limit.

Use the supplied evidence to evaluate what is known, what is inferred and what remains uncertain. Compare all three established alternatives, make a provisional recommendation and explain why you prefer it. Identify additional information that could lead you to maintain, qualify or change your judgement.

Organise your response in the way that best communicates your reasoning. You are not required to follow a prescribed sequence or use a particular format.

Your response will not be automatically marked as correct or incorrect. You will be able to consider your reasoning against formative self-evaluation criteria.

Keep your original completed judgement so you can consult it during the subsequent self-evaluation activity in c6.</p></section><section class="util-assessment-guidance util-assessment-section" data-region="assessment" id="journey-assessment" data-journey-section="true" data-assessment-product="assessment_pack" data-feedback-timing="per_component"><article class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" data-elicitation-id="E1" data-journey-section="true"><h3>Independent Judgement: Traffic Management Near a School</h3><section id="journey-assessment-judgement" class="util-assessment-stimulus" data-region="assessment-stimulus" data-stimulus-kind="structured" data-journey-section="true"><section class="util-assessment-stimulus__scenario" data-stimulus-part="scenario"><h4>Scenario</h4><p>The local authority is reviewing traffic conditions near a school. The review concerns vehicle activity during school arrival and departure periods, reported congestion and pedestrian-safety concerns, and the practical consequences of possible temporary measures. The authority has not established that any one intervention is necessarily preferable. It must make a provisional decision using the available evidence.</p></section><section class="util-assessment-stimulus__alternatives" data-stimulus-part="alternatives"><h4>Alternatives</h4><ol><li data-alternative-id="A"><p><strong>Maintain existing traffic arrangements</strong></p><p>Retain the current arrangements without introducing a new traffic-management measure.</p></li><li data-alternative-id="B"><p><strong>Temporary vehicle-access restrictions</strong></p><p>Introduce a temporary restriction on vehicle access during school arrival and departure periods.</p></li><li data-alternative-id="C"><p><strong>Additional signage and targeted traffic management</strong></p><p>Introduce a more limited intervention combining additional signage and targeted traffic management.</p></li></ol></section><section class="util-assessment-stimulus__evidence" data-stimulus-part="evidence"><h4>Evidence</h4><article class="util-assessment-stimulus__evidence-item"><h5>Traffic observations</h5><p>Short-period local-authority observations showed substantial vehicle activity near the school during arrival and departure times.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>The observations cover only a limited period and do not establish whether similar conditions occur consistently on other school days or at other times.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>Parent and resident reports</h5><p>Parents and local residents have described congestion near the school and expressed concerns about pedestrian safety during busy periods.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>These reports establish that concerns have been raised, but they do not independently verify how frequently dangerous incidents occur or establish the overall level of pedestrian risk.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>Formal collision records</h5><p>Few collisions have been formally recorded in the immediate area around the school.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>The records concern documented collisions and do not establish the frequency of near misses or other potentially unsafe interactions. Few recorded collisions therefore do not demonstrate that the area is free from pedestrian risk.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>Potential effects of vehicle-access restrictions</h5><p>Temporary vehicle-access restrictions during school arrival and departure periods could reduce vehicle activity immediately outside the school. Some vehicles might instead use surrounding roads.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>Neither the size of the possible reduction outside the school nor the extent and consequences of traffic displacement have been established. These are potential effects rather than verified outcomes.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>Costs, disruption and implementation</h5><p>Maintaining existing arrangements would not require introducing a new traffic-management measure. Temporary vehicle-access restrictions would involve a more extensive change to current access arrangements. Additional signage and targeted traffic management would represent a more limited intervention. The alternatives therefore present different potential costs, disruption and implementation demands.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>Precise costs, implementation requirements, levels of disruption and comparative effectiveness have not been established. The relative practical merits of the alternatives remain provisional.</p></article></section><section class="util-assessment-stimulus__boundary" data-stimulus-part="evidence-boundary"><p>The evidence is deliberately incomplete. The observations, reports, records and provisional considerations provide a basis for reasoned judgement, but they do not establish a uniquely correct decision. No further factual information is assumed.</p></section></section><p>A fictional local authority is considering whether to introduce a temporary traffic-management measure near a school. Vehicle activity is substantial during school arrival and departure periods, and concerns have been raised about congestion and pedestrian safety. The authority has gathered some evidence, but it is incomplete and does not establish which action would produce the best overall outcome. The authority must choose between three established alternatives.</p><p>Prepare a reasoned recommendation for the local authority. Using the evidence provided, evaluate what can reasonably be concluded and where interpretations or assumptions go beyond the available information. Compare all three traffic-management options, select the action you consider most defensible at present, and explain why you prefer it to the alternatives. Acknowledge important uncertainties and identify additional information that could lead you to maintain, qualify or change your recommendation. Your judgement should be your own: more than one recommendation can be justified, and there is no single expected answer.</p><p>Write a coherent, evidence-informed judgement that makes your reasoning clear. Your response should demonstrate how you have interpreted and evaluated the evidence, considered the relative merits of the three options, justified your provisional recommendation and recognised conditions under which it might need reconsideration. You may organise your response in whatever way best communicates your reasoning. You do not need specialist transport-planning knowledge or external research.</p><p>Approximately 350–500 words. This is a guide rather than a strict limit; prioritise clear and substantive reasoning over word count.</p><p>Approximately 25 minutes, including reading the scenario and evidence, considering the alternatives and writing your judgement.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-E1" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="assessment-constructed-E1">Your response</label><p>Write your recommendation and supporting reasoning in your own words. You may use paragraphs or headings if helpful. Aim to make your comparison, justification and treatment of uncertainty clear.</p><textarea class="util-learner-workspace__input" id="assessment-constructed-E1" name="assessment-constructed-E1" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="assessment-constructed-E1-review">Review your response</button></p><div id="assessment-constructed-E1-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="FR1"><p>Review your completed judgement against the following criteria. This is a self-evaluation of your reasoning, not a test of whether you selected a particular option. Evidence recognition: Have you distinguished what was observed or reported from what you inferred or assumed? Evidence evaluation: Have you considered what the traffic observations, stakeholder reports and collision records establish, as well as their limitations? Comparison: Have you meaningfully considered the potential benefits, disadvantages and trade-offs of Options A, B and C? Decision and justification: Is your provisional recommendation clear, and does your explanation show why you prefer it to the alternatives? Uncertainty: Have you acknowledged important gaps in the evidence without avoiding a decision? Responsiveness: Have you identified additional information that could affect your recommendation and explained how it might matter? Transfer: Does your response demonstrate your own reasoning in this unfamiliar context rather than relying on a previous case?</p></article><article class="util-formative-material" data-material-id="FR2"><p>Use these distinctions when examining your response. The short-period observations establish substantial vehicle activity during the periods observed, but not that the same conditions occur every day. Parent and resident reports establish that congestion and safety concerns have been expressed, but not how frequently dangerous incidents occur. Few formally recorded collisions do not establish that pedestrian risk is absent. Possible reductions in traffic outside the school and possible displacement to surrounding roads are predictions rather than measured outcomes. Costs, disruption and implementation demands are relevant considerations, but their precise comparative effects are not established. A strong judgement uses these distinctions to decide how much weight to place on each consideration, rather than treating every statement as equally certain.</p></article><article class="util-formative-material" data-material-id="FR3"><p>There is no single correct recommendation. Maintaining existing arrangements may be defensible where the available evidence is judged insufficient to justify intervention and the consequences of change remain uncertain. Temporary vehicle-access restrictions may be defensible where the potential reduction in vehicle activity immediately outside the school is given substantial importance, while acknowledging possible displacement and disruption. Additional signage and targeted traffic management may be defensible where a more limited intervention is preferred in light of uncertainty about the effects and practical demands of more extensive restrictions. These are possible lines of reasoning, not model answers. The quality of your judgement depends on how well you evaluate the evidence, compare the alternatives, explain your priorities and qualify your conclusion.</p></article><article class="util-formative-material" data-material-id="FR4"><p>Pay particular attention to the difference between identifying uncertainty and explaining its consequences. Saying that more evidence is needed shows awareness of a gap, but does not yet explain how that gap affects your decision. A more informative judgement identifies what remains unknown and why a different finding could strengthen, weaken or change the recommendation. For example, evidence about traffic displacement would be especially relevant to a recommendation involving vehicle-access restrictions, while more representative observations could affect how strongly the original traffic concerns support any intervention. You do not need to predict what new evidence would show. The important question is whether you have made clear what could cause you to reconsider.</p></article><article class="util-formative-material" data-material-id="FR5"><p>Your response may demonstrate some aspects of evidence-informed judgement more clearly than others. Identify one aspect of your reasoning that is well supported by what you wrote and one aspect that is less developed or less certain. Base this reflection on specific passages or omissions in your own response. A confident conclusion is not necessarily a stronger judgement than a carefully qualified one, and acknowledging uncertainty is not a weakness when you still reach and justify a provisional decision.</p></article></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Your completed judgement is evidence of how you reasoned independently with incomplete information. Keep your original response so that, in the subsequent self-evaluation activity, you can examine what your reasoning demonstrates, where it remains uncertain and how you might strengthen it. You do not need to change your recommendation simply because another option could also be defended.</p></section></article><section id="journey-assessment-pack-forward" class="util-pack-forward" data-region="pack-forward" data-journey-section="true"><h2>What to take forward</h2><p>You have produced an independent, provisional judgement about the school traffic-management decision. The value of this work lies in the reasoning you made visible: how you interpreted evidence, weighed competing considerations, justified a choice and recognised what might change your mind. Retain your original completed response for self-evaluation in c6. When you revisit it, use the assessment criteria to examine the strengths and limitations of your reasoning rather than searching for a single correct traffic-management option.</p></section></section></article></template><template id="lj-resource-c6"><article class="util-learner-page util-page util-learner-renderer-vnext" data-renderer="vnext" data-page-kind="interactive" data-persistence-page-key="v1::771383be-2f7a-4130-9ef6-21f1477aa63e::learner-page::2.0.0::a1-a2-a3::how-strong-is-your-reasoning" data-persistence-storage-key="learner-renderer-vnext:draft:v1::771383be-2f7a-4130-9ef6-21f1477aa63e::learner-page::2.0.0::a1-a2-a3::how-strong-is-your-reasoning" data-composition-mode="moments" data-composed-activity-count="3" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Evaluating the Quality of Independent Judgement</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="5"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 5"><span class="util-journey-position__visible" aria-hidden="true">1 of 5</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#activity-A1" aria-label="Next section: Review Your Judgement Against Criteria"><span class="util-journey-adjacent__title">Review Your Judgement Against Criteria</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#activity-A1">Review Your Judgement Against Criteria</a></li><li><a class="util-journey-all-link" href="#activity-A2">Identify Your Strongest Reasoning</a></li><li><a class="util-journey-all-link" href="#activity-A3">Identify One Meaningful Improvement</a></li><li><a class="util-journey-all-link" href="#journey-study-tips">Study tips</a></li></ul></div></div></nav><section class="util-page-orientation" data-region="orientation"><div id="journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>This five-minute self-study resource uses your completed c5 school traffic-management judgement as the basis for a focused review. Keep your original response available. Begin by evaluating it against seven reasoning criteria, then identify one demonstrated strength and one specific improvement. You will finish by expressing a reasoning principle that you can apply beyond this decision.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>The three activities form a connected self-evaluation: review the quality of your completed reasoning, substantiate one strength, and explain one improvement. Each activity builds on your original c5 response and the evaluation you have already completed.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><p>The quality of an independent judgement depends on how well its reasoning supports the conclusion, not on whether it matches a preferred answer. In the school traffic-management decision, Options A, B and C may each be defensible if the recommendation is supported by an appropriate interpretation of the available evidence, a meaningful comparison of alternatives and a transparent justification.</p><p>Seven connected criteria provide a basis for evaluating that reasoning:</p><ol><li><strong>Evidence and assumptions:</strong> Distinguish what was observed or reported from what has been inferred. Parent and resident concerns are relevant evidence of reported concerns, but do not independently establish the extent of a traffic hazard.</li><li><strong>Evidence limitations:</strong> Recognise what the available information cannot establish. Limited traffic observations and few formally recorded collisions do not, by themselves, demonstrate that an arrangement is safe or unsafe.</li><li><strong>Comparison of alternatives:</strong> Consider meaningful differences between maintaining existing arrangements, temporarily restricting vehicle access, and introducing limited signage or targeted management. Naming the options is not the same as weighing their implications.</li><li><strong>Defensible recommendation:</strong> Select an action that can be reasonably supported by the available evidence and comparison, without assuming that one option must be correct.</li><li><strong>Transparent justification:</strong> Make the connection between evidence, relevant trade-offs and the recommendation understandable to another reader.</li><li><strong>Proportionate uncertainty:</strong> Express confidence in a way that reflects evidence limitations, including uncertainty about traffic displacement and implementation consequences. Uncertainty does not prevent a provisional recommendation.</li><li><strong>Conditions for reconsideration:</strong> Identify meaningful circumstances or further information that would justify reviewing the provisional judgement.</li></ol><p>These criteria are related but not interchangeable. A clearly stated recommendation may still lack a transparent justification. A response may acknowledge uncertainty without explaining its implications for confidence. Similarly, listing alternatives does not demonstrate that their relative merits have been evaluated.</p><p>A useful self-evaluation is grounded in the reasoning actually recorded. <strong>One strength</strong> identifies a demonstrated feature and explains why it supports defensibility. <strong>One improvement</strong> identifies a specific limitation and explains how addressing it would strengthen the reasoning, without necessarily changing the recommendation.</p><p>The transferable standard is to evaluate how evidence, assumptions, alternatives, justification, uncertainty and reconsideration work together to support a defensible judgement.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c6/knowledge-summary-after-content.png" alt="Concept map connecting seven criteria for defensible independent judgement; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption" id="figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><strong>Figure 1.</strong> The map connects seven criteria for evaluating independent judgement. Distinguishing evidence from assumptions and recognising evidence limitations support interpretation of the available information. This interpretation informs comparison of Options A, B and C. Comparison and evidence contribute to a transparent justification for a defensible provisional recommendation. Proportionate uncertainty qualifies the confidence expressed in that recommendation, while conditions for reconsideration identify when it should be reviewed. The connections describe standards for evaluating reasoning, not a scoring formula or a route to one correct option.</figcaption></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Evaluate the quality of their own completed c5 traffic-management judgement against criteria covering the distinction between evidence and assumptions, recognition of evidence limitations, comparison of alternatives, defensibility of the recommendation, transparency of justification, proportionate uncertainty and conditions for reconsideration. <span class="util-outcome-id">(LO1)</span></li><li>Identify and justify one specific strength in their completed judgement by linking an observable feature of their reasoning to a relevant quality criterion. <span class="util-outcome-id">(LO2)</span></li><li>Identify and explain one specific improvement that would strengthen the defensibility of their completed judgement without necessarily changing their original recommendation. <span class="util-outcome-id">(LO3)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Review Your Judgement Against Criteria</h2><div class="util-badge-row"><span class="util-badge util-badge-time">2 min</span></div></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your earlier independent judgement brought together evidence interpretation, comparison of alternatives and a provisional recommendation. This final learning element shifts attention from making a decision to evaluating the reasoning behind it. Explicit criteria provide a consistent basis for recognising strong evidence-informed judgement, regardless of the option selected.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>If you completed the earlier c5 independent traffic-management judgement, revisit your retained response. You will use what you actually wrote about the three options for managing traffic near the school to evaluate the quality of your reasoning. The aim is not to change your recommendation or identify a preferred option, but to examine how well you justified your decision.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Evaluate the quality of the reasoning process rather than the correctness of the conclusion. Different recommendations can be defensible when supported by appropriate evidence, comparison and justification.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Base each judgement on what your response demonstrates, not simply on what you intended to include.</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Using your completed c5 response, review the quality of your reasoning against seven criteria: distinguishing evidence from assumptions; recognising evidence limitations; comparing Options A, B and C; recommending a defensible action; providing transparent justification; expressing proportionate uncertainty; and identifying conditions for reconsideration. For each criterion, indicate whether your response demonstrates it clearly, partly or not yet, using what you actually wrote as the basis for your judgement. Evaluate the reasoning rather than whether you selected a particular traffic-management option.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a1-a1-m2" data-material-source-id="A1-M2" data-activity-id="A1"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A1-M2" data-material-type="analysis_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Seven-Criterion Reasoning Review</span></p><p class="util-learner-table-workspace__guidance">Enter your responses in the table below. Your draft is saved on this device when possible. It is not submitted.</p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="a1-a1-m2-col-reasoning-criterion-0">Reasoning criterion</th><th scope="col" id="a1-a1-m2-col-evaluation-1">Evaluation</th><th scope="col" id="a1-a1-m2-col-evidence-in-my-response-2">Evidence in my response</th></tr></thead><tbody><tr><th scope="row" id="a1-a1-m2-row-0" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">1. Distinction between evidence and assumptions</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r0-c1" name="a1-a1-m2-input-r0-c1" data-learner-cell="a1-a1-m2-input-r0-c1" rows="3" aria-labelledby="a1-a1-m2-row-0 a1-a1-m2-col-evaluation-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r0-c2" name="a1-a1-m2-input-r0-c2" data-learner-cell="a1-a1-m2-input-r0-c2" rows="3" aria-labelledby="a1-a1-m2-row-0 a1-a1-m2-col-evidence-in-my-response-2" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a1-a1-m2-row-1" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">2. Recognition of evidence limitations</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r1-c1" name="a1-a1-m2-input-r1-c1" data-learner-cell="a1-a1-m2-input-r1-c1" rows="3" aria-labelledby="a1-a1-m2-row-1 a1-a1-m2-col-evaluation-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r1-c2" name="a1-a1-m2-input-r1-c2" data-learner-cell="a1-a1-m2-input-r1-c2" rows="3" aria-labelledby="a1-a1-m2-row-1 a1-a1-m2-col-evidence-in-my-response-2" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a1-a1-m2-row-2" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">3. Fair comparison of Options A, B and C</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r2-c1" name="a1-a1-m2-input-r2-c1" data-learner-cell="a1-a1-m2-input-r2-c1" rows="3" aria-labelledby="a1-a1-m2-row-2 a1-a1-m2-col-evaluation-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r2-c2" name="a1-a1-m2-input-r2-c2" data-learner-cell="a1-a1-m2-input-r2-c2" rows="3" aria-labelledby="a1-a1-m2-row-2 a1-a1-m2-col-evidence-in-my-response-2" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a1-a1-m2-row-3" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">4. Defensibility of the recommended action</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r3-c1" name="a1-a1-m2-input-r3-c1" data-learner-cell="a1-a1-m2-input-r3-c1" rows="3" aria-labelledby="a1-a1-m2-row-3 a1-a1-m2-col-evaluation-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r3-c2" name="a1-a1-m2-input-r3-c2" data-learner-cell="a1-a1-m2-input-r3-c2" rows="3" aria-labelledby="a1-a1-m2-row-3 a1-a1-m2-col-evidence-in-my-response-2" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a1-a1-m2-row-4" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">5. Transparency of the justification</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r4-c1" name="a1-a1-m2-input-r4-c1" data-learner-cell="a1-a1-m2-input-r4-c1" rows="3" aria-labelledby="a1-a1-m2-row-4 a1-a1-m2-col-evaluation-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r4-c2" name="a1-a1-m2-input-r4-c2" data-learner-cell="a1-a1-m2-input-r4-c2" rows="3" aria-labelledby="a1-a1-m2-row-4 a1-a1-m2-col-evidence-in-my-response-2" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a1-a1-m2-row-5" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">6. Proportionate expression of uncertainty</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r5-c1" name="a1-a1-m2-input-r5-c1" data-learner-cell="a1-a1-m2-input-r5-c1" rows="3" aria-labelledby="a1-a1-m2-row-5 a1-a1-m2-col-evaluation-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r5-c2" name="a1-a1-m2-input-r5-c2" data-learner-cell="a1-a1-m2-input-r5-c2" rows="3" aria-labelledby="a1-a1-m2-row-5 a1-a1-m2-col-evidence-in-my-response-2" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a1-a1-m2-row-6" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">7. Meaningful conditions for reconsideration</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r6-c1" name="a1-a1-m2-input-r6-c1" data-learner-cell="a1-a1-m2-input-r6-c1" rows="3" aria-labelledby="a1-a1-m2-row-6 a1-a1-m2-col-evaluation-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r6-c2" name="a1-a1-m2-input-r6-c2" data-learner-cell="a1-a1-m2-input-r6-c2" rows="3" aria-labelledby="a1-a1-m2-row-6 a1-a1-m2-col-evidence-in-my-response-2" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A1-M1" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Your Original Traffic-Management Judgement</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-3">The decision you made in c5</h3><p>In the earlier independent judgement activity, you considered temporary traffic-management measures near a school on behalf of a fictional local authority.</p><p>The three available actions were:</p><ul><li><strong>Option A:</strong> Maintain existing traffic arrangements.</li><li><strong>Option B:</strong> Temporarily restrict vehicle access during school arrival and departure periods.</li><li><strong>Option C:</strong> Introduce a more limited intervention combining additional signage and targeted traffic management.</li></ul><p>The available information included limited traffic observations, safety concerns raised by parents and residents, few formally recorded collisions, uncertain effects of traffic displacement, and provisional differences in cost, disruption and ease of implementation.</p><h3 class="util-md-heading util-md-heading--source-3">Your evidence for this activity</h3><p>Use <strong>your own completed c5 response</strong>, not a newly written answer. Keep it visible while you complete the evaluation table.</p><p>Inspect what you actually wrote about:</p><ul><li>Evidence, assumptions and interpretations.</li><li>Limitations of the available information.</li><li>The relative merits of Options A, B and C.</li><li>Your provisional recommendation and its justification.</li><li>Uncertainty and circumstances that might change your judgement.</li></ul><p>Your original response is the evidence being evaluated. The scenario information above is a reminder of the decision context, not a substitute for your work.</p><p><strong>Evaluate the reasoning you recorded, not whether you chose a particular option.</strong></p></article></li></ol></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A concise, criteria-based evaluation of the learner&#39;s actual c5 response, indicating how clearly each of the seven reasoning standards is demonstrated. Judgements should be grounded in identifiable features of the completed response and distinguish substantive reasoning from unsupported assertions or the mere presence of relevant terminology. The evaluation should recognise strengths and limitations without requiring a new recommendation.</p></div></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a1" data-composition-moment="check" data-activity-id="A1" aria-labelledby="learner-check-a1-heading"><h3 class="util-composition-moment-heading" id="learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a1">Back to your task (Review Your Judgement Against Criteria)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M3" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m3" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m3-c-0" data-revision-criterion-id="a1-m3-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you supported your ratings with features of your actual c5 response?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without a traceable feature or omission, a rating reflects an impression of your performance rather than an evaluation of the reasoning you recorded.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each rating is linked to an identifiable statement, comparison, qualification or omission.</li><li><span class="util-guided-review__feature-key">B.</span> The rating reflects how fully the criterion is demonstrated, not merely whether a related term appears.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> For any unsupported rating, locate the relevant passage in your c5 response or identify what is absent, then record that feature in the evidence column.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Where your response names a criterion without performing the reasoning it requires, reconsider whether Partly demonstrated or Not yet demonstrated is more accurate.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m3-item-0" data-checklist-item-id="checklist-a1-a1-m3-item-0"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m3-item-0">My ratings are grounded in my response</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m3-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m3-c-1" data-revision-criterion-id="a1-m3-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you distinguished evidence from interpretation and considered what the evidence cannot establish?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Treating an inference as an established observation can make the recommendation appear more certain than the available information warrants.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response distinguishes reported concerns, observations or collision records from conclusions drawn about risk.</li><li><span class="util-guided-review__feature-key">B.</span> The response recognises a relevant limitation of the traffic observations, collision record or information about displacement.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> If your response treats a conclusion about safety as a directly observed fact, identify the underlying observation and reconsider your evidence-and-assumptions rating.</li><li><span class="util-guided-review__feature-key">Missing B:</span> If a limitation is absent or merely named, reconsider the evidence-limitations rating according to whether your response explains its significance.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m3-item-1" data-checklist-item-id="checklist-a1-a1-m3-item-1"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m3-item-1">My evidence-related ratings reflect the reasoning shown</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m3-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m3-c-2" data-revision-criterion-id="a1-m3-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you distinguished substantive comparison and justification from simply naming options or asserting a preference?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A recommendation is difficult to assess when the response does not show how relevant differences between the available actions informed the choice.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response considers meaningful differences between Options A, B and C.</li><li><span class="util-guided-review__feature-key">B.</span> The justification connects the chosen action to the evidence and comparative reasoning.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> If the response only lists the options, reconsider the comparison rating; look for actual weighing of safety, disruption, cost or implementation considerations.</li><li><span class="util-guided-review__feature-key">Missing B:</span> If the response states a preference without showing how the comparison supports it, reconsider the defensibility and transparent-justification ratings separately.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m3-item-2" data-checklist-item-id="checklist-a1-a1-m3-item-2"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m3-item-2">My comparison and justification ratings are warranted</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m3-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m3-c-3" data-revision-criterion-id="a1-m3-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you evaluated uncertainty and reconsideration as meaningful parts of the judgement?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A provisional recommendation is more defensible when its confidence and possible revision are connected to the limits of the evidence.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response expresses confidence in a way that reflects the available evidence and its limitations.</li><li><span class="util-guided-review__feature-key">B.</span> The response identifies a meaningful circumstance that could justify revisiting the recommendation.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> If uncertainty is mentioned without affecting the strength of the claim, reconsider the proportionate-uncertainty rating.</li><li><span class="util-guided-review__feature-key">Missing B:</span> If the response only says the decision could change, reconsider whether it specifies what relevant evidence or circumstance would prompt that reconsideration.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m3-item-3" data-checklist-item-id="checklist-a1-a1-m3-item-3"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m3-item-3">My uncertainty and reconsideration ratings are justified</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m3-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Identify Your Strongest Reasoning</h2><div class="util-badge-row"><span class="util-badge util-badge-time">1 min</span></div></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The first activity established a criteria-based evaluation of your judgement. You can now use that evaluation to identify a particular feature of your reasoning that contributed to the defensibility of your recommendation. The emphasis moves from reviewing several standards to substantiating one positive judgement about your own work.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Your criteria review provides a basis for recognising where your reasoning was most effective. Focus on one strength that is genuinely demonstrated in your completed response.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">A reasoning strength is demonstrated by the quality of an identifiable feature of the response, not by agreement with a preferred conclusion.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Explain why the feature you selected makes your reasoning more defensible.</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Choose one reasoning criterion that your c5 response demonstrates particularly well. Identify a specific feature of what you wrote and explain briefly why it represents a strength in evidence-informed judgement. Use your completed criteria review and original response to support your choice. Your strength may concern evidence handling, comparison, justification, uncertainty or reconsideration; it does not depend on which traffic-management option you recommended.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A2-M2" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Explain One Strength</p></article><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A2-M1" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Find Evidence of a Reasoning Strength</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><p>Return to your <strong>completed seven-criterion review</strong> and your <strong>original c5 traffic-management response</strong>.</p><p>Find one criterion that you rated positively and inspect the corresponding passage or feature in your original response.</p><p>Look for something you actually did in your reasoning: a distinction you made, a limitation you evaluated, a comparison you developed, a justification you provided or a qualification you included.</p><p>Choose <strong>one demonstrable strength</strong>. Your evidence should be a specific feature of the response, not simply the fact that you selected Option A, B or C.</p><p>If no criterion was clearly demonstrated, select a genuine strength within an area you rated as partly demonstrated. Your explanation should recognise the extent of that strength rather than overstate it.</p></article></li></ol></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>One concise statement identifying a specific strength, supported by an identifiable feature of the learner&#39;s completed response and a brief
