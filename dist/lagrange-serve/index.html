ceptable choice. Review your calculations and classifications using the feedback before continuing.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a2-a2-task-step-step-5-5" name="learner-workspace-a2-a2-task-step-step-5-5" rows="6" aria-describedby="lj-c1--learner-workspace-a2-a2-task-step-step-5-5-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c1--learner-check-a2" data-check-sidebar-open aria-controls="lj-c1--learner-check-a2" aria-expanded="false" aria-label="Check your work: Test which rectangles are feasible">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c1--learner-check-a2" data-composition-moment="check" data-activity-id="A2" data-check-sidebar="available" aria-labelledby="lj-c1--learner-check-a2-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c1--learner-check-a2-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c1--learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c1--learner-task-a2">Back to your task (Test which rectangles are feasible)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m4-c-0" data-revision-criterion-id="a2-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you checked the perimeter and positivity restrictions for each rectangle?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A rectangle cannot be classified as permissible using its area alone; feasibility depends on the specified conditions.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Every row contains a side-length sum or equivalent perimeter calculation.</li><li><span class="util-guided-review__feature-key">B.</span> Each row includes an explicit check that both side lengths are positive.</li><li><span class="util-guided-review__feature-key">C.</span> The feasibility classification follows from both restriction checks.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> For any blank or uncertain row, add the two supplied side lengths and compare their sum with the required half-perimeter.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Inspect both coordinates in the row and record whether each satisfies the strict positivity condition.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Reconsider any classification that was based on area or appearance instead of the perimeter equality and positivity conditions.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a2-a2-m4-item-0" data-checklist-item-id="checklist-a2-a2-m4-item-0"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a2-a2-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m4-c-1" data-revision-criterion-id="a2-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you calculated the area independently and accurately for every proposed rectangle?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The comparison requires reliable objective values even for alternatives that may later be excluded.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each row contains the product of its two stated side lengths.</li><li><span class="util-guided-review__feature-key">B.</span> The units and meaning of the result are consistent with area.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Multiply the two dimensions for that row rather than using the perimeter or side-length sum as the area.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify each product as an area in square units, distinct from the perimeter measured in units.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a2-a2-m4-item-1" data-checklist-item-id="checklist-a2-a2-m4-item-1"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a2-a2-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m4-c-2" data-revision-criterion-id="a2-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you kept numerical area and feasibility as separate judgements?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Treating a larger area as proof of feasibility reverses the logic of constrained optimisation.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The area column is completed even where the proposed rectangle may fail the restriction.</li><li><span class="util-guided-review__feature-key">B.</span> The comparison does not select a proposal solely because its area is numerically largest.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Retain the numerical area calculation for every proposal, then make the eligibility judgement in its own column.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Before naming a preferred alternative, exclude any row whose dimensions fail a required condition.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a2-a2-m4-item-2" data-checklist-item-id="checklist-a2-a2-m4-item-2"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a2-a2-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m4-c-3" data-revision-criterion-id="a2-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Does your conclusion use the calculated evidence and stay within the scope of the comparison?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A justified comparison of four candidates is valuable evidence, but it does not by itself establish a global mathematical maximum.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The preferred supplied feasible alternative is supported by its area and constraint checks.</li><li><span class="util-guided-review__feature-key">B.</span> The explanation accounts for any numerically larger but excluded alternative.</li><li><span class="util-guided-review__feature-key">C.</span> The conclusion is limited to the supplied alternatives.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Cite the relevant completed rows and compare their areas only after identifying which rows are feasible.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Name the restriction that prevents that proposal from being selected, rather than dismissing its area calculation.</li><li><span class="util-guided-review__feature-key">Missing C:</span> If you claimed a maximum over all possible rectangles, qualify the statement or identify what additional general reasoning would be required.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a2-a2-m4-item-3" data-checklist-item-id="checklist-a2-a2-m4-item-3"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a2-a2-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Review the example response</summary><div class="util-composition-reveal__body"><article class="util-material-block util-sample-output util-prose-measure" data-material-id="A2-M5" data-material-type="sample_output" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></span><span class="util-semantic-icon__label">Worked comparison and feedback</span></p><h3 class="util-md-heading util-md-heading--source-2">Reveal after completing your comparison</h3><p>The perimeter restriction is \(x+y=10\), with both side lengths positive. The area is \(A=xy\).</p><table><thead><tr><th>Side lengths</th><th>Side-length sum</th><th>Positivity</th><th>Feasibility</th><th>Area</th></tr></thead><tbody><tr><td>\((2,8)\)</td><td>\(2+8=10\)</td><td>Both positive</td><td>Feasible</td><td>\(2\times8=16\)</td></tr><tr><td>\((4,6)\)</td><td>\(4+6=10\)</td><td>Both positive</td><td>Feasible</td><td>\(4\times6=24\)</td></tr><tr><td>\((5,5)\)</td><td>\(5+5=10\)</td><td>Both positive</td><td>Feasible</td><td>\(5\times5=25\)</td></tr><tr><td>\((6,6)\)</td><td>\(6+6=12\)</td><td>Both positive</td><td>Infeasible</td><td>\(6\times6=36\)</td></tr></tbody></table><h3 class="util-md-heading util-md-heading--source-3">What the calculations establish</h3><p>The rectangle \((5,5)\) gives the greatest area <strong>among the three supplied feasible alternatives</strong>, at 25 square units.</p><p>The rectangle \((6,6)\) would enclose 36 square units, but its perimeter is \(2(6)+2(6)=24\) units. It exceeds the available perimeter by 4 units. Its greater area is therefore not an available improvement under the stated restriction.</p><p>Notice that its area calculation is not wrong. The mistake would be treating a correctly calculated area as evidence that the dimensions are permissible.</p><h3 class="util-md-heading util-md-heading--source-3">Use the feedback to correct your work</h3><p>If your area differs, recalculate the product of the two side lengths. If your feasibility judgement differs, check the sum of the dimensions against 10 and confirm that both are positive. If you selected the greatest numerical area without checking the perimeter, separate the two decisions in your table.</p><p>These four examples demonstrate why the restriction matters. They do not, by themselves, prove that 25 is the greatest area across <strong>all</strong> positive side-length pairs satisfying the constraint. That broader conclusion requires an argument covering the full feasible set.</p></article></div></details></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c1--activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Defend the best permissible choice</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The feasibility comparison provides the evidence needed for a more general explanation. The learner now moves from checking individual rectangles to defending a constrained choice, distinguishing the finite comparison from a general proof, and transferring the idea of permissible improvement to a new decision context.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have compared rectangles by checking both area and feasibility. Now use that evidence to explain why the perimeter restriction changes what counts as the best choice. Return to your original prediction, consider whether the comparison supports it, and explain your reasoning. You will also apply the same principle to a different decision about using a limited resource.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Build an argument from the objective, the restriction and the evidence. Distinguish what the four comparisons establish from what would require a proof over every feasible rectangle. Then use the same distinction between numerical improvement and feasibility in the transfer decision.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">What did you predict originally? Which calculations or constraint checks support or challenge that prediction? What can you now say about the best permissible choice, and what would you need to establish a maximum across every feasible rectangle? How does the same reasoning apply when a different resource is limited?</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c1--learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="lj-c1--learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="lj-c1--learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c1--learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c1--learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="lj-c1--learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c1--learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Revisit your original rectangle prediction without replacing it.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A3-M2" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">A limited-resource allocation</span></p><h3 class="util-md-heading util-md-heading--source-2">A different kind of decision</h3><p><em>Simulated teaching scenario: the resource allocations are illustrative, not measurements from a real organisation.</em></p><p>A project manager has <strong>exactly 12 resource units</strong> to divide between two uses, labelled \(x\) and \(y\). Neither allocation can be negative.</p><p>The fixed-resource condition is</p><p>\[x+y=12,\qquad x\geq0,\qquad y\geq0\]</p><p>For this decision, the manager&#39;s stated objective is to <strong>increase the amount assigned to use \(x\)</strong> while respecting the fixed total.</p><p>The manager is considering these allocations:</p><table><thead><tr><th>Allocation</th><th>Units assigned to \(x\)</th><th>Units assigned to \(y\)</th></tr></thead><tbody><tr><td>Current allocation</td><td>7</td><td>5</td></tr><tr><td>Proposed allocation</td><td>8</td><td>5</td></tr></tbody></table><p>The manager asks whether the proposal is an acceptable way to improve the objective.</p><p>Use the given values and restrictions to make your own decision. Record your explanation in the resource-allocation response field.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Use the comparison evidence to explain which supplied feasible rectangle offers the greatest area and why a larger-area infeasible rectangle cannot be chosen.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Explain, reconsider and transfer</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain how the fixed-perimeter constraint changes the problem compared with allowing positive side lengths to increase without that restriction.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A3-M1" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Two claims about the rectangle</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-2">Examine the competing claims</h3><p><em>Simulated teaching claims: these statements are created for mathematical analysis and are not quotations from real students or researchers.</em></p><p>The rectangle problem has the following conditions:</p><p>\[A(x,y)=xy\]</p><p>\[x+y=10,\qquad x&gt;0,\qquad y&gt;0\]</p><p>The available perimeter is 20 units. Earlier proposed rectangles included \((2,8)\), \((4,6)\), \((5,5)\) and \((6,6)\).</p><p><strong>Candidate claim 1</strong></p><p>&gt; &#39;I would choose side lengths \((6,6)\). They give an area of 36 square units, which is larger than the area of the other proposed rectangles. That makes this the better choice.&#39;</p><p><strong>Candidate claim 2</strong></p><p>&gt; &#39;Among the proposed rectangles that satisfy the fixed-perimeter restriction, I would choose \((5,5)\). Its area is 25 square units, and its side lengths satisfy the required equality.&#39;</p><p>Treat both statements as claims to investigate, not as supplied conclusions. Use the objective, the restriction and the numerical comparison you completed to decide what each claim establishes and whether its reasoning is justified. Pay attention to the phrase <strong>among the proposed rectangles</strong>.</p></article></li></ol></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Record whether your initial prediction is supported or challenged, identify the evidence responsible, and state your retained or revised interpretation with reasons.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Apply the same reasoning to the supplied resource-allocation claim: identify the objective and restriction, check whether the proposed improvement is permissible, and compose a brief decision explanation for someone allocating the resource.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A concise, evidence-supported explanation identifying the objective and restrictions, distinguishing the greatest area among the supplied feasible rectangles from a larger infeasible numerical result, and explaining why removing the perimeter restriction changes the optimisation problem. The response preserves the original prediction, cites specific comparison evidence, and gives a reasoned retained or revised interpretation. A separate short transfer explanation identifies the objective and resource limit in a changed context, checks whether the proposed improvement respects that limit, and communicates a justified permissible-choice judgement without relying on an unproved general optimum.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-original-prediction-1" data-response-part-id="A3-template-section-a3-m3-section-original-prediction-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-original-prediction-1-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-original-prediction-1">Original prediction</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-original-prediction-1-desc">Reproduce or consult the prediction you recorded at the start. Keep its original wording or meaning visible rather than replacing it with what you now think.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-original-prediction-1" name="learner-workspace-a3-a3-template-section-a3-m3-section-original-prediction-1" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-original-prediction-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-rectangle-evidence-and-permissible-choice-2" data-response-part-id="A3-template-section-a3-m3-section-rectangle-evidence-and-permissible-choice-2"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-rectangle-evidence-and-permissible-choice-2-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-rectangle-evidence-and-permissible-choice-2">Rectangle evidence and permissible choice</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-rectangle-evidence-and-permissible-choice-2-desc">Use the supplied claims and your rectangle comparison to identify the strongest permissible choice among the proposed rectangles. Refer to the relevant area and constraint calculations. Explain why a numerically larger area may not be selectable.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-rectangle-evidence-and-permissible-choice-2" name="learner-workspace-a3-a3-template-section-a3-m3-section-rectangle-evidence-and-permissible-choice-2" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-rectangle-evidence-and-permissible-choice-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-effect-of-removing-the-constraint-3" data-response-part-id="A3-template-section-a3-m3-section-effect-of-removing-the-constraint-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-effect-of-removing-the-constraint-3-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-effect-of-removing-the-constraint-3">Effect of removing the constraint</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-effect-of-removing-the-constraint-3-desc">Explain how the problem would change if positive rectangle side lengths could be increased without a fixed total perimeter. Distinguish an unrestricted increase in area from improvement within the original feasible set.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-effect-of-removing-the-constraint-3" name="learner-workspace-a3-a3-template-section-a3-m3-section-effect-of-removing-the-constraint-3" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-effect-of-removing-the-constraint-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-evidence-supporting-or-challenging-the-prediction-4" data-response-part-id="A3-template-section-a3-m3-section-evidence-supporting-or-challenging-the-prediction-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-evidence-supporting-or-challenging-the-prediction-4-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-evidence-supporting-or-challenging-the-prediction-4">Evidence supporting or challenging the prediction</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-evidence-supporting-or-challenging-the-prediction-4-desc">Identify the particular numerical comparisons or restriction checks that support or challenge your original prediction. Explain how that evidence relates to the reason you initially gave.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-evidence-supporting-or-challenging-the-prediction-4" name="learner-workspace-a3-a3-template-section-a3-m3-section-evidence-supporting-or-challenging-the-prediction-4" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-evidence-supporting-or-challenging-the-prediction-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-retained-or-revised-interpretation-5" data-response-part-id="A3-template-section-a3-m3-section-retained-or-revised-interpretation-5"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-retained-or-revised-interpretation-5-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-retained-or-revised-interpretation-5">Retained or revised interpretation</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-retained-or-revised-interpretation-5-desc">State whether you retain or revise your initial prediction and why. Distinguish what the four examples establish from what would be needed to prove a maximum over every feasible rectangle.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-retained-or-revised-interpretation-5" name="learner-workspace-a3-a3-template-section-a3-m3-section-retained-or-revised-interpretation-5" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-retained-or-revised-interpretation-5-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="6" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-resource-allocation-decision-6" data-response-part-id="A3-template-section-a3-m3-section-resource-allocation-decision-6"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-resource-allocation-decision-6-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-resource-allocation-decision-6">Resource-allocation decision</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-resource-allocation-decision-6-desc">Using the separate resource-allocation scenario, write a short explanation for the project manager. Identify the objective and resource restriction, check the relevant totals, and justify whether the proposed change is permissible.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-resource-allocation-decision-6" name="learner-workspace-a3-a3-template-section-a3-m3-section-resource-allocation-decision-6" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-resource-allocation-decision-6-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c1--learner-check-a3" data-check-sidebar-open aria-controls="lj-c1--learner-check-a3" aria-expanded="false" aria-label="Check your work: Defend the best permissible choice">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c1--learner-check-a3" data-composition-moment="check" data-activity-id="A3" data-check-sidebar="available" aria-labelledby="lj-c1--learner-check-a3-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c1--learner-check-a3-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c1--learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c1--learner-task-a3">Back to your task (Defend the best permissible choice)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Record whether your initial prediction is supported or challenged, identify the evidence responsible, and state your retained or revised interpretation with reasons.</p></span></div><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M5" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m5" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m5-c-0" data-revision-criterion-id="a3-m5-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you identified the objective and restriction in the rectangle problem without confusing their roles?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The explanation must distinguish the quantity being improved from the conditions that determine which improvements are available.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The area objective is identified as the quantity being maximised.</li><li><span class="util-guided-review__feature-key">B.</span> The fixed-perimeter equality and positive-side conditions are used as permission rules.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Connect the product of the rectangle&#39;s two dimensions to the numerical value being compared.</li><li><span class="util-guided-review__feature-key">Missing B:</span> State how the side-length restrictions determine whether a proposed rectangle belongs to the feasible set.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a3-a3-m5-item-0" data-checklist-item-id="checklist-a3-a3-m5-item-0"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a3-a3-m5-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m5-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m5-c-1" data-revision-criterion-id="a3-m5-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Does your rectangle judgement use the evidence and distinguish numerical improvement from permissible improvement?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A comparison is not justified if it selects an alternative that fails the restriction or claims more than the examined evidence establishes.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The judgement cites relevant side lengths, area values and constraint checks.</li><li><span class="util-guided-review__feature-key">B.</span> The response explains why an excluded rectangle cannot be selected despite a larger area.</li><li><span class="util-guided-review__feature-key">C.</span> The claim is limited to the supplied alternatives unless a general proof is provided.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Use the actual numerical comparisons and the perimeter equality to justify the selected feasible alternative.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify the specific failed restriction and explain why it takes precedence over the larger objective value.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Distinguish a finite comparison from a conclusion covering every feasible pair of side lengths.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a3-a3-m5-item-1" data-checklist-item-id="checklist-a3-a3-m5-item-1"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a3-a3-m5-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m5-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m5-c-2" data-revision-criterion-id="a3-m5-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you made your initial prediction, reconsidered evidence and final interpretation separately visible?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Showing how evidence affected an earlier judgement demonstrates reasoning and revision rather than simply reporting a final answer.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The original prediction remains identifiable.</li><li><span class="util-guided-review__feature-key">B.</span> Specific evidence is identified as supporting or challenging that prediction.</li><li><span class="util-guided-review__feature-key">C.</span> The retained or revised interpretation is justified by the evidence.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Restore the starting prediction as it was first recorded rather than rewriting it to agree with your later conclusion.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Refer to a particular area comparison or feasibility check and explain how it relates to your initial reasoning.</li><li><span class="util-guided-review__feature-key">Missing C:</span> State whether your view changed and connect that decision to the mathematical comparison, not simply to the supplied feedback.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a3-a3-m5-item-2" data-checklist-item-id="checklist-a3-a3-m5-item-2"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a3-a3-m5-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m5-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m5-c-3" data-revision-criterion-id="a3-m5-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you applied the same feasibility principle correctly to the separate resource-allocation decision?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The transfer demonstrates whether you can recognise a constrained improvement problem outside the original rectangle setting.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The resource-allocation objective and fixed-total restriction are identified separately.</li><li><span class="util-guided-review__feature-key">B.</span> The proposed allocation is checked against the fixed total using its actual values.</li><li><span class="util-guided-review__feature-key">C.</span> The recommendation is justified by the restriction check rather than by the increase alone.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the allocation the manager wants to increase and distinguish it from the equality limiting the combined allocation.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Add the two proposed allocation amounts and compare the result with the available resource total.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Connect your decision explicitly to whether the proposal preserves the fixed total, while acknowledging the manager&#39;s intended numerical improvement.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a3-a3-m5-item-3" data-checklist-item-id="checklist-a3-a3-m5-item-3"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a3-a3-m5-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m5-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-task-step-step-4-4" data-response-part-id="A3-task-step-step-4-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-task-step-step-4-4-label" for="lj-c1--learner-workspace-a3-a3-task-step-step-4-4">Your response</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-task-step-step-4-4-desc">Record whether your initial prediction is supported or challenged, identify the evidence responsible, and state your retained or revised interpretation with reasons.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-task-step-step-4-4" name="learner-workspace-a3-a3-task-step-step-4-4" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-task-step-step-4-4-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div><div class="util-verified-review" data-verified-review><button type="button" class="util-verified-review__toggle" data-verified-review-toggle data-verified-review-label="View verified feedback" data-verified-review-back="Back to review" aria-expanded="false" aria-controls="lj-c1--verified-review-a3">View verified feedback</button><div class="util-verified-review__panel" id="lj-c1--verified-review-a3" data-verified-review-panel><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Reveal verified feedback</summary><div class="util-composition-reveal__body"><article class="util-material-block util-prose-measure" data-material-id="A3-M6" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Why the restriction changes the answer</span></p><h3 class="util-md-heading util-md-heading--source-2">Review after completing your explanations</h3><h3 class="util-md-heading util-md-heading--source-3">Why a larger area is not always a better choice</h3><p>The objective function assigns an area to any pair of positive side lengths. For example, \((6,6)\) has area</p><p>\[A(6,6)=6\times6=36\]</p><p>But the perimeter constraint defines which pairs can actually be chosen. The side lengths must satisfy \(x+y=10\). For \((6,6)\), the sum is 12, corresponding to a perimeter of 24 units rather than 20. Changing the dimensions has increased the numerical area while moving the proposal outside the feasible set.</p><p>The area calculation remains correct. What fails is the permission to use that rectangle. A larger objective value is not automatically an improvement <strong>within the constrained problem</strong>.</p><p>The alternative \((5,5)\) satisfies the required sum and has area</p><p>\[A(5,5)=5\times5=25\]</p><p>Among the supplied feasible rectangles, this is the largest area. The other supplied feasible areas are 16 and 24 square units. This supports candidate claim 2 within its stated scope; candidate claim 1 overlooks the perimeter restriction.</p><h3 class="util-md-heading util-md-heading--source-3">From comparing examples to proving a maximum</h3><p>Checking four rectangles is useful, but there are infinitely many positive pairs satisfying \(x+y=10\). A comparison of only four cases cannot establish the global maximum on its own.</p><p>We can now extend the reasoning algebraically. The constraint requires</p><p>\[y=10-x\]</p><p>Substituting this into the area objective gives</p><p>\[A(x,10-x)=x(10-x)\]</p><p>Completing the square,</p><p>\[A(x,10-x)=25-(x-5)^2\]</p><p>Because both sides are positive, the feasible values satisfy \(0&lt;x&lt;10\). For every such value, the squared term is non-negative, so the area cannot exceed 25 square units. Equality occurs when \(x=5\), which also gives \(y=5\).</p><p>This argument covers <strong>every feasible rectangle</strong> under the stated conditions. It therefore establishes the global maximum of 25 square units at \((5,5)\), rather than merely identifying the best of four examples.</p><h3 class="util-md-heading util-md-heading--source-3">What happens without the restriction?</h3><p>If the perimeter were not fixed, both positive dimensions could increase. For instance, enlarging each side of any rectangle by the same factor greater than one would increase its area by the square of that factor. There would be no finite greatest area when positive dimensions are otherwise unrestricted.</p><p>The fixed perimeter changes the mathematical question. Instead of allowing indefinite enlargement, it creates a feasible set within which the area can be compared and maximised.</p><h3 class="util-md-heading util-md-heading--source-3">Feedback on the resource decision</h3><p>The same distinction appears in the resource-allocation scenario. The current allocation \((7,5)\) uses</p><p>\[7+5=12\]</p><p>resource units, satisfying the fixed total. The proposed allocation \((8,5)\) uses</p><p>\[8+5=13\]</p><p>resource units. Although the proposed change increases the allocation to \(x\), it violates the requirement \(x+y=12\). It is therefore not a permissible improvement under the stated conditions.</p><p>A valid alternative would have to preserve the fixed total and non-negativity conditions. This is the same principle as the rectangle problem: the objective describes what we want to improve, while the constraint determines which changes are available.</p><h3 class="util-md-heading util-md-heading--source-3">Debrief</h3><p>Return to the prediction you recorded at the beginning. If you expected the square to work best, you can now support that view with both numerical comparisons and a general algebraic argument. If you predicted a different shape, identify the evidence that changed your reasoning. The important achievement is being able to explain <strong>why</strong> the restriction matters, not simply remembering the final dimensions.</p><h3 class="util-md-heading util-md-heading--source-3">Page learner-resource closure</h3><ul><li><strong>Separate the roles:</strong> the objective function measures what is being improved; the constraint and other conditions define which choices are permissible.</li><li><strong>Check before comparing:</strong> calculate feasibility and objective value separately. A larger numerical value does not justify selecting an infeasible alternative.</li><li><strong>Match the claim to the evidence:</strong> a comparison of a few candidates identifies the best among those candidates; a global maximum requires reasoning that covers the entire feasible set.</li><li><strong>Carry the principle forward:</strong> when examining a new constrained decision, identify the resource limit, test the proposed change against it and explain whether the improvement remains permissible.</li></ul></article></div></details></div></div></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A3"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M4" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Advise the resource manager</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910" data-response-part-id="A3-transfer-prompt-a3-m4-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-transfer-prompt-a3-m4-910-label" for="lj-c1--learner-workspace-a3-a3-transfer-prompt-a3-m4-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="lj-c1--learner-workspace-a3-a3-transfer-prompt-a3-m4-910-desc"><p>A resource manager wants to increase one allocation without changing the total resources available.</p><p>Using the <strong>limited-resource allocation</strong> scenario, write a brief recommendation to the manager. Identify what the manager is trying to improve, state the restriction that must still hold, and use the supplied allocation figures to check the proposed change.</p><p>Explain whether the proposal is a <strong>permissible improvement</strong>, not merely whether one numerical allocation has increased.</p><p>Record your answer under <strong>Resource-allocation decision</strong> in the response workspace. Aim for three or four sentences supported by the relevant calculation.</p></div><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-transfer-prompt-a3-m4-910" name="learner-workspace-a3-a3-transfer-prompt-a3-m4-910" rows="5" aria-describedby="lj-c1--learner-workspace-a3-a3-transfer-prompt-a3-m4-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><aside class="util-study-tips" data-region="study-tips" id="lj-c1--journey-study-tips" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--study-tips" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg></span><span class="util-semantic-icon__label">Study tips</span></h2><div class="util-study-tips__content util-prose-measure"><ul><li><strong>Separate the roles:</strong> the objective function measures what is being improved; the constraint and other conditions define which choices are permissible.</li><li><strong>Check before comparing:</strong> calculate feasibility and objective value separately. A larger numerical value does not justify selecting an infeasible alternative.</li><li><strong>Match the claim to the evidence:</strong> a comparison of a few candidates identifies the best among those candidates; a global maximum requires reasoning that covers the entire feasible set.</li><li><strong>Carry the principle forward:</strong> when examining a new constrained decision, identify the resource limit, test the proposed change against it and explain whether the improvement remains permissible.</li></ul></div></aside><style id="lj-c1--prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="true"]{display:block;position:fixed;top:var(--learner-sticky-nav-height,0px);left:0;right:0;z-index:40;margin:0 auto;max-width:42rem;width:calc(100% - 1.5rem);padding:.45rem .75rem;border:1px solid #cbd5e1;border-left:3px solid #64748b;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.12)}.util-learner-renderer-vnext .util-revision-reminder__chrome{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.35rem .75rem;margin:0 0 .2rem}.util-learner-renderer-vnext .util-revision-reminder__label{margin:0;font-size:.75rem;font-weight:650;color:#64748b}.util-learner-renderer-vnext .util-revision-reminder__statement{margin:0;font-size:.9rem;line-height:1.4;font-weight:600;color:#0f172a}.util-learner-renderer-vnext .
