 explanation connecting that feature to a relevant reasoning-quality criterion. The statement should demonstrate why the feature strengthens the judgement rather than merely asserting that the recommendation was good.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m2-section-strength-1" data-response-part-id="A2-template-section-a2-m2-section-strength-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-template-section-a2-m2-section-strength-1-label" for="learner-workspace-a2-a2-template-section-a2-m2-section-strength-1">Strength</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-template-section-a2-m2-section-strength-1-desc">Identify one reasoning-quality criterion that your completed judgement demonstrates well.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-template-section-a2-m2-section-strength-1" name="learner-workspace-a2-a2-template-section-a2-m2-section-strength-1" rows="6" aria-describedby="learner-workspace-a2-a2-template-section-a2-m2-section-strength-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m2-section-evidence-from-my-response-2" data-response-part-id="A2-template-section-a2-m2-section-evidence-from-my-response-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-template-section-a2-m2-section-evidence-from-my-response-2-label" for="learner-workspace-a2-a2-template-section-a2-m2-section-evidence-from-my-response-2">Evidence from my response</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-template-section-a2-m2-section-evidence-from-my-response-2-desc">Identify the specific statement, comparison or qualification in your c5 response that supports your choice.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-template-section-a2-m2-section-evidence-from-my-response-2" name="learner-workspace-a2-a2-template-section-a2-m2-section-evidence-from-my-response-2" rows="6" aria-describedby="learner-workspace-a2-a2-template-section-a2-m2-section-evidence-from-my-response-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m2-section-why-this-strengthens-my-reasoning-3" data-response-part-id="A2-template-section-a2-m2-section-why-this-strengthens-my-reasoning-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-template-section-a2-m2-section-why-this-strengthens-my-reasoning-3-label" for="learner-workspace-a2-a2-template-section-a2-m2-section-why-this-strengthens-my-reasoning-3">Why this strengthens my reasoning</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="learner-workspace-a2-a2-template-section-a2-m2-section-why-this-strengthens-my-reasoning-3-desc"><p>Explain briefly how that feature makes your judgement more defensible. Connect the feature to the relevant criterion rather than simply describing your recommendation as convincing.</p><p>A useful strength is supported by something a reader could locate in your response. For instance, the presence of a qualification is not automatically a strength: its value depends on whether it meaningfully limits a claim that the evidence cannot fully establish.</p></div><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-template-section-a2-m2-section-why-this-strengthens-my-reasoning-3" name="learner-workspace-a2-a2-template-section-a2-m2-section-why-this-strengthens-my-reasoning-3" rows="6" aria-describedby="learner-workspace-a2-a2-template-section-a2-m2-section-why-this-strengthens-my-reasoning-3-desc"></textarea></div></div></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a2" data-composition-moment="check" data-activity-id="A2" aria-labelledby="learner-check-a2-heading"><h3 class="util-composition-moment-heading" id="learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a2">Back to your task (Identify Your Strongest Reasoning)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M3" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m3" data-guided-review-count="3"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m3-c-0" data-revision-criterion-id="a2-m3-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 3</p><p class="util-guided-review__statement">Have you identified one specific strength in your reasoning?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A general claim that the judgement was good does not identify which reasoning capability was demonstrated.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The strength names a recognisable reasoning operation, such as distinguishing assumptions, weighing alternatives or qualifying uncertainty.</li><li><span class="util-guided-review__feature-key">B.</span> The strength is appropriately limited to what your response demonstrates.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Replace a general claim of good judgement with the particular reasoning operation you performed.</li><li><span class="util-guided-review__feature-key">Missing B:</span> If the relevant criterion was only partly demonstrated, identify the successful part rather than claiming the entire criterion was fully satisfied.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m3-item-0" data-checklist-item-id="checklist-a2-a2-m3-item-0"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m3-item-0">My strength is specific</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m3-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m3-c-1" data-revision-criterion-id="a2-m3-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 3</p><p class="util-guided-review__statement">Have you supported the strength with evidence from your original response?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A strength is demonstrable only when the reader can connect the claim to reasoning that actually appears in the completed work.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The evidence field identifies a statement, comparison, qualification or other observable feature in the c5 response.</li><li><span class="util-guided-review__feature-key">B.</span> The identified feature supports the strength claimed.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Locate the relevant passage or feature in your original response and identify it in the evidence field.</li><li><span class="util-guided-review__feature-key">Missing B:</span> If the feature merely mentions the topic, choose evidence that shows the reasoning operation being performed or narrow the strength claimed.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m3-item-1" data-checklist-item-id="checklist-a2-a2-m3-item-1"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m3-item-1">My strength is supported by my work</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m3-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m3-c-2" data-revision-criterion-id="a2-m3-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 3</p><p class="util-guided-review__statement">Have you explained why the feature improves the defensibility of your judgement?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The educational value of identifying a strength lies in recognising how that reasoning feature supports an evidence-informed recommendation.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The explanation connects the feature to a relevant reasoning-quality criterion.</li><li><span class="util-guided-review__feature-key">B.</span> The explanation concerns the quality of reasoning rather than agreement with a preferred traffic-management option.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the criterion satisfied and explain the relationship between that standard and the feature you identified.</li><li><span class="util-guided-review__feature-key">Missing B:</span> If the explanation relies on having selected the right option, replace that claim with how the evidence handling, comparison or justification supports the recommendation.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m3-item-2" data-checklist-item-id="checklist-a2-a2-m3-item-2"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m3-item-2">I have justified why this is a strength</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m3-c-2">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Identify One Meaningful Improvement</h2><div class="util-badge-row"><span class="util-badge util-badge-time">2 min</span></div></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">You have evaluated your completed judgement against explicit criteria and identified one demonstrated strength. The final activity uses the same standards to identify a focused improvement. Together, the strength and improvement provide a concise account of what effective evidence-informed reasoning looks like and how it can be developed in future decisions.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Complete your self-evaluation by identifying one way your reasoning could be strengthened. The aim is to improve the quality of the justification, not necessarily to change the action you recommended.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">A meaningful improvement addresses the reasoning process rather than automatically replacing the conclusion. Focus on a change that would make the justification clearer, more balanced or more proportionate to the evidence.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Explain how your proposed improvement would make the reasoning more defensible and identify the standard you could apply in another decision.</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Return to your criteria review and original c5 response. Identify one specific weakness, omission or unclear connection in your reasoning. Explain briefly how addressing it would make your original judgement more defensible. Keep the improvement focused on the quality of reasoning rather than making another traffic-management decision. Conclude by stating the transferable reasoning principle that this improvement illustrates, so that you can apply the same standard when evaluating a different decision in future.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M2" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Explain and Transfer One Improvement</p></article><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A3-M1" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Locate One Reasoning Limitation</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><p>Use your <strong>original c5 response</strong> and the <strong>seven-criterion review</strong> you completed earlier in this resource.</p><p>Look for one criterion rated <em>Partly demonstrated</em> or <em>Not yet demonstrated</em>. Identify the relevant omission, unsupported inference or unclear connection in your recorded reasoning.</p><p>The limitation might concern how you interpreted evidence, compared the established traffic-management options, justified your recommendation, expressed uncertainty or identified conditions for reconsideration.</p><p>Select <strong>one improvement</strong> that would make your original judgement more defensible. You do not need to change your recommendation or make a new decision.</p><p>If you rated every criterion as clearly demonstrated, inspect your response again and identify one focused way to make an existing reasoning connection more explicit or appropriately qualified.</p></article></li></ol></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>One concise, evidence-supported improvement identifying a specific limitation in the learner&#39;s completed reasoning, explaining how it could be addressed and connecting the proposed improvement to a transferable standard of evidence-informed judgement. The explanation should strengthen the defensibility of the original judgement without requiring a revised recommendation, new evidence or an extended reflection.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-improvement-needed-1" data-response-part-id="A3-template-section-a3-m2-section-improvement-needed-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m2-section-improvement-needed-1-label" for="learner-workspace-a3-a3-template-section-a3-m2-section-improvement-needed-1">Improvement needed</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m2-section-improvement-needed-1-desc">Identify one specific weakness, omission or unclear connection in your completed reasoning.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m2-section-improvement-needed-1" name="learner-workspace-a3-a3-template-section-a3-m2-section-improvement-needed-1" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m2-section-improvement-needed-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-evidence-from-my-response-2" data-response-part-id="A3-template-section-a3-m2-section-evidence-from-my-response-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m2-section-evidence-from-my-response-2-label" for="learner-workspace-a3-a3-template-section-a3-m2-section-evidence-from-my-response-2">Evidence from my response</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m2-section-evidence-from-my-response-2-desc">Identify the passage, unsupported claim or omission that shows why this improvement is needed.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m2-section-evidence-from-my-response-2" name="learner-workspace-a3-a3-template-section-a3-m2-section-evidence-from-my-response-2" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m2-section-evidence-from-my-response-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-how-i-would-strengthen-the-reasoning-3" data-response-part-id="A3-template-section-a3-m2-section-how-i-would-strengthen-the-reasoning-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m2-section-how-i-would-strengthen-the-reasoning-3-label" for="learner-workspace-a3-a3-template-section-a3-m2-section-how-i-would-strengthen-the-reasoning-3">How I would strengthen the reasoning</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m2-section-how-i-would-strengthen-the-reasoning-3-desc">Explain the focused change you would make to the reasoning. Specify what should be distinguished, compared, justified or qualified, and why this would make the original judgement more defensible. You do not need to rewrite the recommendation.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m2-section-how-i-would-strengthen-the-reasoning-3" name="learner-workspace-a3-a3-template-section-a3-m2-section-how-i-would-strengthen-the-reasoning-3" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m2-section-how-i-would-strengthen-the-reasoning-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-transferable-principle-4" data-response-part-id="A3-template-section-a3-m2-section-transferable-principle-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m2-section-transferable-principle-4-label" for="learner-workspace-a3-a3-template-section-a3-m2-section-transferable-principle-4">Transferable principle</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="learner-workspace-a3-a3-template-section-a3-m2-section-transferable-principle-4-desc"><p>State the general reasoning standard illustrated by your improvement. Express it as a principle you could apply when evaluating a different evidence-informed decision, without introducing a new scenario or making another recommendation.</p><h3 class="util-md-heading util-md-heading--source-3">Page learner-resource closure</h3><ul><li><strong>Evaluate reasoning, not agreement:</strong> Options A, B and C can each be considered defensible when the evidence, comparison and justification support the chosen action.</li><li><strong>Trace claims to evidence:</strong> Distinguish observations from assumptions and interpretations, and consider what limited evidence cannot establish.</li><li><strong>Make the judgement inspectable:</strong> Compare alternatives, explain trade-offs and express confidence in proportion to the available evidence.</li><li><strong>Use your self-evaluation beyond this case:</strong> Carry forward one demonstrated strength and one focused improvement, including the conditions under which a provisional judgement should be reconsidered.</li></ul></div><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m2-section-transferable-principle-4" name="learner-workspace-a3-a3-template-section-a3-m2-section-transferable-principle-4" rows="5" aria-describedby="learner-workspace-a3-a3-template-section-a3-m2-section-transferable-principle-4-desc"></textarea></div></div></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a3" data-composition-moment="check" data-activity-id="A3" aria-labelledby="learner-check-a3-heading"><h3 class="util-composition-moment-heading" id="learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a3">Back to your task (Identify One Meaningful Improvement)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M3" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m3" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m3-c-0" data-revision-criterion-id="a3-m3-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you identified a specific limitation in your original reasoning?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An improvement cannot be targeted unless it addresses something identifiable in the completed judgement.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The improvement names an omission, unsupported inference or unclear reasoning connection.</li><li><span class="util-guided-review__feature-key">B.</span> The evidence field points to the relevant passage or absence in the c5 response.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the precise part of the reasoning that needs attention, such as an unexamined assumption, an incomplete comparison or an unexplained qualification.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Locate the statement that needs improvement or specify the reasoning step missing from your original response.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m3-item-0" data-checklist-item-id="checklist-a3-a3-m3-item-0"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m3-item-0">My improvement addresses a demonstrated limitation</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m3-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m3-c-1" data-revision-criterion-id="a3-m3-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you connected the improvement to a recognised reasoning-quality criterion?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Connecting the limitation to an explicit standard shows why it matters for evidence-informed judgement rather than treating it as a stylistic preference.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The limitation concerns one of the seven criteria used in the review.</li><li><span class="util-guided-review__feature-key">B.</span> The proposed improvement addresses the reasoning required by that criterion.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify whether the issue concerns evidence and assumptions, limitations, comparison, defensibility, justification, uncertainty or reconsideration.</li><li><span class="util-guided-review__feature-key">Missing B:</span> If the criterion concerns comparison, specify what relative merits need weighing; if it concerns uncertainty, specify how the limitation should affect confidence or reconsideration.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m3-item-1" data-checklist-item-id="checklist-a3-a3-m3-item-1"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m3-item-1">My improvement is linked to a reasoning standard</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m3-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m3-c-2" data-revision-criterion-id="a3-m3-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you explained how the proposed change would strengthen the original judgement?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A useful improvement identifies a reasoning operation that would make the recommendation easier to assess or more proportionate to the evidence.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The explanation specifies a change to the reasoning, not merely an intention to write more.</li><li><span class="util-guided-review__feature-key">B.</span> The explanation shows how that change affects the defensibility of the recommendation.</li><li><span class="util-guided-review__feature-key">C.</span> The improvement does not depend on replacing the original recommendation.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State the particular distinction, comparison, justification or qualification you would add or strengthen.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect the proposed change to its consequence, such as reducing an unsupported inference, making a trade-off explicit or aligning confidence with evidence limitations.</li><li><span class="util-guided-review__feature-key">Missing C:</span> If you have proposed a different option without explaining the reasoning weakness, refocus on how the original judgement could be better supported or qualified.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m3-item-2" data-checklist-item-id="checklist-a3-a3-m3-item-2"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m3-item-2">I have explained how the reasoning would improve</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m3-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m3-c-3" data-revision-criterion-id="a3-m3-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you expressed a transferable principle rather than repeating the traffic-management recommendation?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The final consolidation is successful when the learner can identify a reasoning standard that remains useful beyond the original decision context.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The principle describes a general operation used in evidence-informed judgement.</li><li><span class="util-guided-review__feature-key">B.</span> The principle could guide evaluation of reasoning in another unfamiliar decision.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Express the improvement as a general standard, such as separating observations from inference or relating confidence to evidence limitations, rather than naming a traffic-management action.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Remove details that make the principle depend on Options A, B or C, while preserving the reasoning operation that makes it useful.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m3-item-3" data-checklist-item-id="checklist-a3-a3-m3-item-3"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m3-item-3">My improvement expresses a transferable standard</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m3-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article></section><aside class="util-study-tips" data-region="study-tips" id="journey-study-tips" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--study-tips" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg></span><span class="util-semantic-icon__label">Study tips</span></h2><div class="util-study-tips__content util-prose-measure"><ul><li><strong>Evaluate reasoning, not agreement:</strong> Options A, B and C can each be considered defensible when the evidence, comparison and justification support the chosen action.</li><li><strong>Trace claims to evidence:</strong> Distinguish observations from assumptions and interpretations, and consider what limited evidence cannot establish.</li><li><strong>Make the judgement inspectable:</strong> Compare alternatives, explain trade-offs and express confidence in proportion to the available evidence.</li><li><strong>Use your self-evaluation beyond this case:</strong> Carry forward one demonstrated strength and one focused improvement, including the conditions under which a provisional judgement should be reconsidered.</li></ul></div></aside><style id="prism-rev
