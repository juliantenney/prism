s="util-learner-table-workspace__input" id="a1-a1-m4-input-r1-c3" name="a1-a1-m4-input-r1-c3" data-learner-cell="a1-a1-m4-input-r1-c3" rows="3" aria-labelledby="a1-a1-m4-row-1 a1-a1-m4-col-credibility-and-reliability-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m4-input-r1-c4" name="a1-a1-m4-input-r1-c4" data-learner-cell="a1-a1-m4-input-r1-c4" rows="3" aria-labelledby="a1-a1-m4-row-1 a1-a1-m4-col-principal-limitation-4" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m4-input-r1-c5" name="a1-a1-m4-input-r1-c5" data-learner-cell="a1-a1-m4-input-r1-c5" rows="3" aria-labelledby="a1-a1-m4-row-1 a1-a1-m4-col-unjustified-inference-or-necessary-qualification-5" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a1-a1-m4-row-2" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Student access comments</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m4-input-r2-c1" name="a1-a1-m4-input-r2-c1" data-learner-cell="a1-a1-m4-input-r2-c1" rows="3" aria-labelledby="a1-a1-m4-row-2 a1-a1-m4-col-directly-supported-claim-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m4-input-r2-c2" name="a1-a1-m4-input-r2-c2" data-learner-cell="a1-a1-m4-input-r2-c2" rows="3" aria-labelledby="a1-a1-m4-row-2 a1-a1-m4-col-relevance-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m4-input-r2-c3" name="a1-a1-m4-input-r2-c3" data-learner-cell="a1-a1-m4-input-r2-c3" rows="3" aria-labelledby="a1-a1-m4-row-2 a1-a1-m4-col-credibility-and-reliability-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m4-input-r2-c4" name="a1-a1-m4-input-r2-c4" data-learner-cell="a1-a1-m4-input-r2-c4" rows="3" aria-labelledby="a1-a1-m4-row-2 a1-a1-m4-col-principal-limitation-4" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m4-input-r2-c5" name="a1-a1-m4-input-r2-c5" data-learner-cell="a1-a1-m4-input-r2-c5" rows="3" aria-labelledby="a1-a1-m4-row-2 a1-a1-m4-col-unjustified-inference-or-necessary-qualification-5" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a1-a1-m4-row-3" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Provisional operational costs</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m4-input-r3-c1" name="a1-a1-m4-input-r3-c1" data-learner-cell="a1-a1-m4-input-r3-c1" rows="3" aria-labelledby="a1-a1-m4-row-3 a1-a1-m4-col-directly-supported-claim-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m4-input-r3-c2" name="a1-a1-m4-input-r3-c2" data-learner-cell="a1-a1-m4-input-r3-c2" rows="3" aria-labelledby="a1-a1-m4-row-3 a1-a1-m4-col-relevance-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m4-input-r3-c3" name="a1-a1-m4-input-r3-c3" data-learner-cell="a1-a1-m4-input-r3-c3" rows="3" aria-labelledby="a1-a1-m4-row-3 a1-a1-m4-col-credibility-and-reliability-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m4-input-r3-c4" name="a1-a1-m4-input-r3-c4" data-learner-cell="a1-a1-m4-input-r3-c4" rows="3" aria-labelledby="a1-a1-m4-row-3 a1-a1-m4-col-principal-limitation-4" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m4-input-r3-c5" name="a1-a1-m4-input-r3-c5" data-learner-cell="a1-a1-m4-input-r3-c5" rows="3" aria-labelledby="a1-a1-m4-row-3 a1-a1-m4-col-unjustified-inference-or-necessary-qualification-5" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Retain your four evaluations for comparison in the following activity.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>Four concise, source-specific evaluations that accurately distinguish reported information from interpretation. Each evaluation identifies a defensible supported claim, explains relevance and the available basis or uncertainty for credibility and reliability, identifies a consequential limitation, and qualifies at least one inference that would otherwise exceed the evidence. The evaluations preserve the usefulness of imperfect sources without making unsupported generalisations.</p></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-task-step-step-5-5" data-response-part-id="A1-task-step-step-5-5"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-task-step-step-5-5-label" for="learner-workspace-a1-a1-task-step-step-5-5">Your response</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-task-step-step-5-5-desc">Retain your four evaluations for comparison in the following activity.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-task-step-step-5-5" name="learner-workspace-a1-a1-task-step-step-5-5" rows="6" aria-describedby="learner-workspace-a1-a1-task-step-step-5-5-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a1" data-composition-moment="check" data-activity-id="A1" aria-labelledby="learner-check-a1-heading"><h3 class="util-composition-moment-heading" id="learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a1">Back to your task (Judge What Each Source Supports)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M5" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m5" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m5-c-0" data-revision-criterion-id="a1-m5-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you identified a claim each source directly supports without confusing reported information with interpretation?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An evaluation cannot establish evidential strength if the claim being evaluated already goes beyond what was recorded.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each supported claim refers to an identifiable observation, reported statement or stated estimate in its source record.</li><li><span class="util-guided-review__feature-key">B.</span> Claims about wider student behaviour, future conditions or population-wide patterns are distinguished from the reported information.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Locate the specific recorded value, observation or provisional condition and rewrite the claim so it describes only what that information establishes.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Mark where your claim moves from a recorded observation to a broader inference, then qualify that inference unless the source provides grounds for it.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m5-item-0" data-checklist-item-id="checklist-a1-a1-m5-item-0"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m5-item-0">My supported claims stay within the evidence</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m5-c-1" data-revision-criterion-id="a1-m5-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you judged relevance, credibility and reliability using reasons that apply to each source?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Treating these criteria as interchangeable can make a source appear strong for a question it does not actually address.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Relevance is explained in relation to a particular claim or question.</li><li><span class="util-guided-review__feature-key">B.</span> Credibility is linked to the available information about how the source was produced or reported.</li><li><span class="util-guided-review__feature-key">C.</span> Reliability is considered in relation to what was measured or reported, without assuming it predicts other circumstances.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the claim you are evaluating and explain which aspect of the source addresses it.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify what is known about the source&#39;s origin or collection process and distinguish that from information the record does not supply.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Specify the observation or reporting process whose dependability matters, and separate confidence in that record from confidence in a broader prediction.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m5-item-1" data-checklist-item-id="checklist-a1-a1-m5-item-1"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m5-item-1">My criteria are applied to the right claims</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m5-c-2" data-revision-criterion-id="a1-m5-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you identified a limitation specific to each source rather than applying the same generic criticism throughout?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Different limitations restrict different inferences; a generic weakness does not show how the evidence should be used.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The limitation is connected to an identifiable feature or omission in the relevant record.</li><li><span class="util-guided-review__feature-key">B.</span> The limitation does not automatically erase a narrower contribution the source can still make.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Point to the source&#39;s participation conditions, observation period, number of reports or provisional status, as applicable, and state what remains unknown.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Separate the limited broader inference from the more specific observation that remains available for consideration.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m5-item-2" data-checklist-item-id="checklist-a1-a1-m5-item-2"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m5-item-2">My limitations are source-specific</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m5-c-3" data-revision-criterion-id="a1-m5-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you shown how each limitation changes the conclusion that can reasonably follow?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Listing weaknesses without adjusting the conclusion leaves unsupported generalisations intact.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each row identifies at least one inference that would exceed the available evidence.</li><li><span class="util-guided-review__feature-key">B.</span> Each qualification narrows or conditions the inference rather than simply declaring the source useless.</li><li><span class="util-guided-review__feature-key">C.</span> Your final wording preserves the distinction between what is known and what remains uncertain.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the broader population, future condition, prevalence or fixed quantity your source does not establish.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Rewrite the overextended claim so it refers only to the observed group, recorded period, reported concern or provisional estimate.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Separate the recorded information from the unresolved question in two short clauses or sentences.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m5-item-3" data-checklist-item-id="checklist-a1-a1-m5-item-3"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m5-item-3">My conclusions reflect the limitations</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Weigh Evidence Across Different Questions</h2><div class="util-badge-row"><span class="util-badge util-badge-time">7 min</span></div></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your individual evaluations established that evidential strength depends on the claim being considered. Comparative judgement builds on those evaluations by examining how sources contribute differently to questions about preferences, historical behaviour, access and resources. The challenge is to justify relative significance without treating every source as though it measures the same thing.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have evaluated what each source can reasonably establish. Now consider how much each contributes when the question changes. Evidence that is particularly useful for understanding student preferences may be less useful for predicting attendance, identifying access difficulties or estimating operational costs.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Begin with the question being investigated, not with a preferred source. Compare sources according to their relevance to that question and the strength of the claims they support. Distinguish direct evidence from indirect or limited evidence. Recognise that different sources may complement one another without corroborating the same proposition.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">How did changing the question alter which source you considered most significant? What would be lost by assigning each source a single overall rank?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A2"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Review the short explanation of evidential significance and why it differs from credibility or numerical precision.</p></span></div></div><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><article class="util-material-block util-material-table-block" data-material-id="A2-M1" data-material-type="reference_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Simulated Evidence for Comparison</span></p><h3 class="util-md-heading util-md-heading--source-2">Revisit the evidence</h3><p>These are the same four records from the <strong>fictional university scenario</strong>, reproduced for comparison. They are simulated educational evidence, not independently verified institutional data.</p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Source</th><th>Directly inspectable particulars</th><th>Source condition</th></tr></thead><tbody><tr><td>Voluntary online student survey</td><td>240 responses from approximately 12,000 students; 168 respondents favour extended opening hours.</td><td>Participation was voluntary; no information establishes the characteristics of non-respondents.</td></tr><tr><td>Historical building-access records</td><td>Relatively low late-evening occupancy was recorded.</td><td>The observations concern previous opening arrangements.</td></tr><tr><td>Student comments</td><td>A small number of comments report unequal access to quiet study facilities.</td><td>The available comments are few; no wider frequency is provided.</td></tr><tr><td>Provisional operational costs</td><td>Additional staffing, security and operating costs have been identified.</td><td>Costs depend on the extent of the extension and remain provisional.</td></tr></tbody></table></div><p>The university is considering Option A, maintaining existing hours; Option B, extending hours throughout the examination period; and Option C, targeted extensions during periods of greatest anticipated demand. Your task remains to compare the evidence, <strong>not</strong> to select an option.</p></article></div><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Examine the apparent tension between survey support for extended hours and relatively low historical late-evening occupancy. Explain whether the findings necessarily contradict one another and identify the unresolved relationship.</p></span></div></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a2-question-dependent-significance-01-activity-a2-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/activity-a2-materials-entry.png" alt="Framework linking an evaluative question to relevant evidence, claim strength and significance; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-a2-question-dependent-significance-01-activity-a2-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption" id="figure-description-asset-vb-38-4-va-a2-question-dependent-significance-01-activity-a2-materials-entry"><strong>Figure 2.</strong> The framework begins with an evaluative question and moves through four linked considerations: identify the claim, locate relevant evidence, assess how strongly the evidence supports that claim, and judge its significance for the question. The available evidence categories are survey preferences, historical building access, student access comments and provisional operational costs. A return connection to the initial question indicates that a different question may change which evidence contributes most. No source is ranked or assigned a score.</figcaption></figure><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A2-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">How Evidential Significance Changes</span></p><h3 class="util-md-heading util-md-heading--source-2">Strength is not the same as significance</h3><p><strong>Evidential strength</strong> concerns how well information supports a particular claim. <strong>Evidential significance</strong> concerns how much that supported claim contributes to the question under consideration.</p><p>Imagine two records about a university service: a precisely counted number of visits and a detailed account of an access difficulty. If the question concerns recorded attendance, the count may contribute more directly. If the question concerns barriers to participation, the account may be more pertinent, although it cannot establish how common the difficulty is. Neither source becomes universally superior.</p><p>The relationship is therefore: <strong>question → relevant claim → evidential support → significance for that question</strong>. Ranking every source by numerical precision alone ignores what each measures. Sources can also complement one another when they address different aspects of a situation; different findings are not necessarily contradictory.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Revisit your evaluations from the previous activity and inspect the four evidence records again.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a2-a2-m3" data-material-source-id="A2-M3" data-activity-id="A2"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A2-M3" data-material-type="comparison_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Compare Sources by Question</span></p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="a2-a2-m3-col-question-0">Question</th><th scope="col" id="a2-a2-m3-col-most-directly-relevant-source-and-why-1">Most directly relevant source and why</th><th scope="col" id="a2-a2-m3-col-contribution-or-limitation-of-another-source-2">Contribution or limitation of another source</th><th scope="col" id="a2-a2-m3-col-relative-significance-and-justification-3">Relative significance and justification</th><th scope="col" id="a2-a2-m3-col-remaining-uncertainty-4">Remaining uncertainty</th></tr></thead><tbody><tr><th scope="row" id="a2-a2-m3-row-0" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">What do students prefer?</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r0-c1" name="a2-a2-m3-input-r0-c1" data-learner-cell="a2-a2-m3-input-r0-c1" rows="3" aria-labelledby="a2-a2-m3-row-0 a2-a2-m3-col-most-directly-relevant-source-and-why-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r0-c2" name="a2-a2-m3-input-r0-c2" data-learner-cell="a2-a2-m3-input-r0-c2" rows="3" aria-labelledby="a2-a2-m3-row-0 a2-a2-m3-col-contribution-or-limitation-of-another-source-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r0-c3" name="a2-a2-m3-input-r0-c3" data-learner-cell="a2-a2-m3-input-r0-c3" rows="3" aria-labelledby="a2-a2-m3-row-0 a2-a2-m3-col-relative-significance-and-justification-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r0-c4" name="a2-a2-m3-input-r0-c4" data-learner-cell="a2-a2-m3-input-r0-c4" rows="3" aria-labelledby="a2-a2-m3-row-0 a2-a2-m3-col-remaining-uncertainty-4" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a2-a2-m3-row-1" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">What can be established about library use and possible future attendance?</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r1-c1" name="a2-a2-m3-input-r1-c1" data-learner-cell="a2-a2-m3-input-r1-c1" rows="3" aria-labelledby="a2-a2-m3-row-1 a2-a2-m3-col-most-directly-relevant-source-and-why-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r1-c2" name="a2-a2-m3-input-r1-c2" data-learner-cell="a2-a2-m3-input-r1-c2" rows="3" aria-labelledby="a2-a2-m3-row-1 a2-a2-m3-col-contribution-or-limitation-of-another-source-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r1-c3" name="a2-a2-m3-input-r1-c3" data-learner-cell="a2-a2-m3-input-r1-c3" rows="3" aria-labelledby="a2-a2-m3-row-1 a2-a2-m3-col-relative-significance-and-justification-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r1-c4" name="a2-a2-m3-input-r1-c4" data-learner-cell="a2-a2-m3-input-r1-c4" rows="3" aria-labelledby="a2-a2-m3-row-1 a2-a2-m3-col-remaining-uncertainty-4" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a2-a2-m3-row-2" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">What do we know about access concerns and operational implications?</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r2-c1" name="a2-a2-m3-input-r2-c1" data-learner-cell="a2-a2-m3-input-r2-c1" rows="3" aria-labelledby="a2-a2-m3-row-2 a2-a2-m3-col-most-directly-relevant-source-and-why-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r2-c2" name="a2-a2-m3-input-r2-c2" data-learner-cell="a2-a2-m3-input-r2-c2" rows="3" aria-labelledby="a2-a2-m3-row-2 a2-a2-m3-col-contribution-or-limitation-of-another-source-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r2-c3" name="a2-a2-m3-input-r2-c3" data-learner-cell="a2-a2-m3-input-r2-c3" rows="3" aria-labelledby="a2-a2-m3-row-2 a2-a2-m3-col-relative-significance-and-justification-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r2-c4" name="a2-a2-m3-input-r2-c4" data-learner-cell="a2-a2-m3-input-r2-c4" rows="3" aria-labelledby="a2-a2-m3-row-2 a2-a2-m3-col-remaining-uncertainty-4" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Complete the comparison workspace for three questions: What do students prefer? What can be established about library use? What do we know about access concerns and operational implications? For each question, identify the most directly relevant evidence, explain what another source contributes or cannot establish, and justify the relative significance of the sources.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A2-M4" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Explain the Apparent Evidence Conflict</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Use the diagnostic feedback to improve your comparisons. Do not rank all four sources using one universal rule or select a library opening-hours option.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>Three justified, question-specific comparisons that identify relevant sources, explain differences in evidential strength and significance, and acknowledge consequential limitations. The learner also produces a reasoned explanation of the apparent disagreement between survey preferences and historical attendance, recognising that they measure different phenomena and do not establish future use. The work avoids unsupported corroboration and rejects a universal ranking based solely on numerical precision, sample size, vividness or cost.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m4-section-what-the-survey-measures-1" data-response-part-id="A2-template-section-a2-m4-section-what-the-survey-measures-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-template-section-a2-m4-section-what-the-survey-measures-1-label" for="learner-workspace-a2-a2-template-section-a2-m4-section-what-the-survey-measures-1">What the survey measures</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-template-section-a2-m4-section-what-the-survey-measures-1-desc">Record your response for What the survey measures.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-template-section-a2-m4-section-what-the-survey-measures-1" name="learner-workspace-a2-a2-template-section-a2-m4-section-what-the-survey-measures-1" rows="6" aria-describedby="learner-workspace-a2-a2-template-section-a2-m4-section-what-the-survey-measures-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m4-section-what-the-historical-records-measure-2" data-response-part-id="A2-template-section-a2-m4-section-what-the-historical-records-measure-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-template-section-a2-m4-section-what-the-historical-records-measure-2-label" for="learner-workspace-a2-a2-template-section-a2-m4-section-what-the-historical-records-measure-2">What the historical records measure</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-template-section-a2-m4-section-what-the-historical-records-measure-2-desc">Record your response for What the historical records measure.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-template-section-a2-m4-section-what-the-historical-records-measure-2" name="learner-workspace-a2-a2-template-section-a2-m4-section-what-the-historical-records-measure-2" rows="6" aria-describedby="learner-workspace-a2-a2-template-section-a2-m4-section-what-the-historical-records-measure-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m4-section-judgement-about-apparent-conflict-3" data-response-part-id="A2-template-section-a2-m4-section-judgement-about-apparent-conflict-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-template-section-a2-m4-section-judgement-about-apparent-conflict-3-label" for="learner-workspace-a2-a2-template-section-a2-m4-section-judgement-about-apparent-conflict-3">Judgement about apparent conflict</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-template-section-a2-m4-section-judgement-about-apparent-conflict-3-desc">Record your response for Judgement about apparent conflict.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-template-section-a2-m4-section-judgement-about-apparent-conflict-3" name="learner-workspace-a2-a2-template-section-a2-m4-section-judgement-about-apparent-conflict-3" rows="5" aria-describedby="learner-workspace-a2-a2-template-section-a2-m4-section-judgement-about-apparent-conflict-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m4-section-unresolved-relationship-4" data-response-part-id="A2-template-section-a2-m4-section-unresolved-relationship-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-template-section-a2-m4-section-unresolved-relationship-4-label" for="learner-workspace-a2-a2-template-section-a2-m4-section-unresolved-relationship-4">Unresolved relationship</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-template-section-a2-m4-section-unresolved-relationship-4-desc">Your explanation should identify what further relationship would need to be established before a stronger conclusion about future use could be drawn. Do not predict attendance without supporting evidence.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-template-section-a2-m4-section-unresolved-relationship-4" name="learner-workspace-a2-a2-template-section-a2-m4-section-unresolved-relationship-4" rows="6" aria-describedby="learner-workspace-a2-a2-template-section-a2-m4-section-unresolved-relationship-4-desc"></textarea></div></div></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a2" data-composition-moment="check" data-activity-id="A2" aria-labelledby="learner-check-a2-heading"><h3 class="util-composition-moment-heading" id="learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a2">Back to your task (Weigh Evidence Across Different Questions)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M5" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m5" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m5-c-0" data-revision-criterion-id="a2-m5-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you made each comparison in relation to the specific question being investigated?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A source may be informative about one question but contribute little to another; an unqualified overall ranking obscures that difference.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each table row names a source whose recorded information addresses that row&#39;s question.</li><li><span class="util-guided-review__feature-key">B.</span> Your explanation states why the selected source is relevant rather than merely naming it.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Return to the question and identify the observation, preference, concern or cost condition that bears on it.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect a particular source feature to the exact issue the question asks you to investigate.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m5-item-0" data-checklist-item-id="checklist-a2-a2-m5-item-0"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m5-item-0">My comparisons depend on the question</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m5-c-1" data-revision-criterion-id="a2-m5-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you justified relative significance using evidence particulars and their limitations?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A ranking based on size, vividness or apparent precision alone cannot explain how sources contribute to a particular judgement.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each comparison refers to an identifiable value, observation, reporting condition or estimate.</li><li><span class="util-guided-review__feature-key">B.</span> The comparison explains how a source&#39;s limitation affects its contribution to the question.</li><li><span class="util-guided-review__feature-key">C.</span> Sources with different purposes are compared without being forced onto a single numerical scale.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the specific source particular that supports the comparison, rather than relying on a general label such as &#39;more reliable&#39;.</li><li><span class="util-guided-review__feature-key">Missing B:</span> State which broader inference the source cannot establish and adjust its claimed significance accordingly.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain the different questions the sources help address before judging their respective contributions.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m5-item-1" data-checklist-item-id="checklist-a2-a2-m5-item-1"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m5-item-1">My significance judgements are justified</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m5-c-2" data-revision-criterion-id="a2-m5-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you distinguished the phenomena measured by the survey and historical usage records before judging whether they conflict?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Treating different measurements as direct contradictions can create a disagreement that the evidence does not establish.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The survey and historical records are described in terms of their respective recorded phenomena.</li><li><span class="util-guided-review__feature-key">B.</span> Your judgement explains whether the two observations logically exclude one another.</li><li><span class="util-guided-review__feature-key">C.</span> Your response identifies a relationship that remains unestablished.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify what each record actually captures and avoid replacing either with a claim about future attendance.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Consider whether both reported observations could hold under the stated conditions, then qualify any claim of contradiction.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Name the connection between expressed preferences, recorded use and possible use under changed arrangements that the available records do not resolve.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m5-item-2" data-checklist-item-id="checklist-a2-a2-m5-item-2"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m5-item-2">My treatment of apparent conflict is defensible</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m5-c-3" data-revision-criterion-id="a2-m5-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you identified uncertainties that genuinely restrict the conclusions drawn from each comparison?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Uncertainty matters when it changes what a comparison can establish, not when it is added as a generic disclaimer.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each remaining uncertainty concerns a specific missing relationship, condition or population inference.</li><li><span class="util-guided-review__feature-key">B.</span> The uncertainty is connected to the scope of your comparative conclusion.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Replace a general statement such as &#39;more evidence is needed&#39; with the particular fact or relationship that remains unknown.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain which part of your judgement would require qualification if that uncertainty cannot be resolved.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m5-item-3" data-checklist-item-id="checklist-a2-a2-m5-item-3"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m5-item-3">My uncertainties constrain my conclusions</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Synthesize Evidence and Preserve Uncertainty</h2><div class="util-badge-row"><span class="util-badge util-badge-time">8 min</span></div></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your comparisons established that sources can be significant for different reasons and that apparent disagreement does not necessarily indicate contradiction. This final activity combines those insights into an integrated evidence evaluation. It also tests whether you can recognise and qualify an overextended claim without relying on the earlier comparison structure.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>The final challenge is to bring the evidence together without forcing it into one ranking or moving prematurely to an opening-hours decision. You will produce a concise, qualified synthesis and then apply the same evaluative approach to a less familiar claim about the evidence.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">A balanced synthesis should preserve what each source contributes, explain where sources address different questions, and identify uncertainties that genuinely restrict broader conclusions. Do not treat uncertainty as proof that the evidence is useless. Equally, do not resolve uncertainty by inventing relationships between sources. Your conclusion should concern what the evidence supports, not which action the university should take.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which uncertainty most restricts a broader conclusion, and how would your synthesis change if you mistakenly treated that uncertainty as already resolved?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A3"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><article class="util-material-block util-material-table-block" data-material-id="A3-M1" data-material-type="reference_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Simulated Evidence for Final Synthesis</span></p><h3 class="util-md-heading util-md-heading--source-2">The evidence to bring together</h3><p>This is the established evidence set for the <strong>fictional university library scenario</strong>. The records are simulated educational evidence, not independently verified institutional data.</p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Evidence source</th><th>Reported particulars</th><th>Relevant condition</th></tr></thead><tbody><tr><td>Voluntary online survey</td><td>240 students responded from a population of approximately 12,000; 168 respondents favoured extended opening hours.</td><td>Participation was voluntary.</td></tr><tr><td>Historical building-access records</td><td>Relatively low late-evening occupancy under previous opening arrangements.</td><td>The observations were made under the arrangements in place at the time.</td></tr><tr><td>Student access comments</td><td>A small number of comments report unequal access to quiet study facilities.</td><td>The number of comments is small; population-wide prevalence is not reported.</td></tr><tr><td>Provisional operational costs</td><td>Additional staffing, security and operating costs depend on the extent of an extension.</td><td>Estimates are provisional; no fixed monetary amounts are supplied.</td></tr></tbody></table></div><p>Use your own earlier evaluations and comparisons alongside these records. This evidence evaluation prepares you for a later comparison of opening-hours options; it does not require you to recommend an option now.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Produce a concise integrated evaluation identifying the supported contribution of each source, at least one apparent conflict or unsupported connection, and the most consequential unresolved uncertainties.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M2" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Your Integrated Evidence Synthesis</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Apply your evaluation to a new claim presented as a short university briefing statement. Identify which parts are supported, which exceed the evidence, and how the claim should be qualified without introducing additional facts.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M5" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Your Qualified Replacement Briefing</p></article><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A3-M3" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Simulated University Briefing Statement</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-2">A briefing claim to evaluate</h3><p>The following is a <strong>fictional briefing statement</strong>, not an authoritative account or an additional verified source. It refers to the same simulated university evidence.</p><p>&gt; A voluntary survey of 240 students, from approximately 12,000, found that 168 favoured extended library hours, proving most students want longer opening. Historical records show relatively low late-evening occupancy under previous arrangements, so newly available hours would attract little use. A small number of comments report unequal access to quiet study facilities, establishing that this problem is widespread.</p><p>Inspect the statement&#39;s individual claims against the original evidence records. Some reported particulars are accurate; other conclusions may exceed what those particulars establish.</p></article></li></ol></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A concise integrated evidence synthesis that accurately preserves the four sources&#39; distinct contributions, distinguishes apparent conflict from established contradiction, identifies consequential uncertainties and states only conclusions supported by the available information. The learner also produces a defensible qualification of a less familiar briefing claim, identifying unsupported generalisations without adding facts. The final record is suitable for independent retention and later use in comparing actions, but does not recommend an opening-hours option.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-supported-contributions-of-the-four-sources-1" data-response-part-id="A3-template-section-a3-m2-section-supported-contributions-of-the-four-sources-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m2-section-supported-contributions-of-the-four-sources-1-label" for="learner-workspace-a3-a3-template-section-a3-m2-section-supported-contributions-of-the-four-sources-1">Supported contributions of the four sources</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="learner-workspace-a3-a3-template-section-a3-m2-section-supported-contributions-of-the-four-sources-1-desc"><p>Survey:</p><p>Historical building-access records:</p><p>Student access comments:</p><p>Provisional operational costs:</p></div><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m2-section-supported-contributions-of-the-four-sources-1" name="learner-workspace-a3-a3-template-section-a3-m2-section-supported-contributions-of-the-four-sources-1" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m2-section-supported-contributions-of-the-four-sources-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m5-section-supported-briefing-claims-1" data-response-part-id="A3-template-section-a3-m5-section-supported-briefing-claims-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m5-section-supported-briefing-claims-1-label" for="learner-workspace-a3-a3-template-section-a3-m5-section-supported-briefing-claims-1">Supported briefing claims</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m5-section-supported-briefing-claims-1-desc">Record your response for Supported briefing claims.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m5-section-supported-briefing-claims-1" name="learner-workspace-a3-a3-template-section-a3-m5-section-supported-briefing-claims-1" rows="5" aria-describedby="learner-workspace-a3-a3-template-section-a3-m5-section-supported-briefing-claims-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-apparent-conflict-or-unsupported-connection-2" data-response-part-id="A3-template-section-a3-m2-section-apparent-conflict-or-unsupported-connection-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m2-section-apparent-conflict-or-unsupported-connection-2-label" for="learner-workspace-a3-a3-template-section-a3-m2-section-apparent-conflict-or-unsupported-connection-2">Apparent conflict or unsupported connection</label><p class="ut ntry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-consequential-unresolved-uncertainties-3" data-response-part-id="A3-template-section-a3-m2-section-consequential-unresolved-uncertainties-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m2-section-consequential-unresolved-uncertainties-3-label" for="learner-workspace-a3-a3-template-section-a3-m2-section-consequential-unresolved-uncertainties-3">Consequential unresolved uncertainties</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m2-section-consequential-unresolved-uncertainties-3-desc">Record your response for Consequential unresolved uncertainties.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m2-section-consequential-unresolved-uncertainties-3" name="learner-workspace-a3-a3-template-section-a3-m2-section-consequential-unresolved-uncertainties-3" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m2-section-consequential-unresolved-uncertainties-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m5-section-qualified-replacement-briefing-3" data-response-part-id="A3-template-section-a3-m5-section-qualified-replacement-briefing-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m5-section-qualified-replacement-briefing-3-label" for="learner-workspace-a3-a3-template-section-a3-m5-section-qualified-replacement-briefing-3">Qualified replacement briefing</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="learner-workspace-a3-a3-template-section-a3-m5-section-qualified-replacement-briefing-3-desc"><p>Your replacement should preserve the available observations, distinguish them from interpretations and avoid adding information not supplied in the evidence.</p><h3 class="util-md-heading util-md-heading--source-3">Page learner-resource closure</h3><ul><li><strong>Evaluate claims, not source labels.</strong> Relevance, credibility and reliability help establish what a particular observation can reasonably support; limitations determine how far the conclusion can extend.</li><li><strong>Weigh evidence against the question.</strong> Survey preferences, historical usage, access concerns and provisional costs address different aspects of the library situation. Their significance changes with the question being investigated.</li><li><strong>Preserve uncertainty in your synthesis.</strong> Apparent disagreement does not necessarily mean contradiction. Identify which relationships remain unestablished rather than inventing a resolution.</li><li><strong>Keep your work for the next component.</strong> Save your four source evaluations, principal comparisons and unresolved uncertainties. You will need them when considering the opening-hours options; responses are not transferred automatically.</li></ul></div><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m5-section-qualified-replacement-briefing-3" name="learner-workspace-a3-a3-template-section-a3-m5-section-qualified-replacement-briefing-3" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m5-section-qualified-replacement-briefing-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-qualified-evidence-synthesis-4" data-response-part-id="A3-template-section-a3-m2-section-qualified-evidence-synthesis-4"><label class="util-composition-subheading util-learner-workspa
