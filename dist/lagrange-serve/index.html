acent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 5"><span class="util-journey-position__visible" aria-hidden="true">1 of 5</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c2--activity-A1" aria-label="Next section: Explore feasible area curves"><span class="util-journey-adjacent__title">Explore feasible area curves</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="lj-c2--util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c2--journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#lj-c2--activity-A1">Explore feasible area curves</a></li><li><a class="util-journey-all-link" href="#lj-c2--activity-A2">Predict gradients and tangents</a></li><li><a class="util-journey-all-link" href="#lj-c2--activity-A3">Test feasible directions</a></li><li><a class="util-journey-all-link" href="#lj-c2--activity-A4">Explain parallel gradients</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-page-orientation" data-region="orientation"><div id="lj-c2--journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>This self-study resource explores the geometry of constrained optimisation through a rectangle with fixed perimeter. Work through four activities in order, beginning with feasible area curves and progressing towards an explanation of why gradients become parallel at a regular constrained optimum. Make your predictions and complete each explanation before revealing its feedback. You can revisit earlier calculations as you develop your reasoning.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>The activities move from interpreting a feasible set to examining objective gradients, testing movement along a constraint, and explaining the geometric relationship behind the Lagrange multiplier condition. The final activity asks you to construct an explanation independently and apply the idea of parallel vectors to a separate claim.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><p>Constrained optimisation asks how large or small an objective function can become when the variables must satisfy specified conditions. In two variables, an objective \(f(x,y)\) assigns a value to each coordinate pair, while an equality constraint \(g(x,y)=c\) identifies the permitted set. A point can have an attractive objective value without being feasible. The optimisation problem concerns values achieved within the feasible set, not throughout the entire coordinate plane.</p><h3 class="util-md-heading util-md-heading--source-3">Level curves and gradients</h3><p>A level curve \(f(x,y)=k\) contains points sharing the same objective value \(k\). A family of level curves helps us distinguish changes in the objective from movement that preserves its value. The gradient</p><p>\[\nabla f=(f_x,f_y)\]</p><p>combines the two partial derivatives. Where it is non-zero, it points in the direction of greatest local increase per unit distance. Its magnitude gives the corresponding maximum rate of increase.</p><p>A tangent direction follows a smooth level curve locally. If \(\mathbf{r}(s)\) traces that curve, the objective remains constant along the path. Differentiating gives</p><p>\[\nabla f\cdot\mathbf{r}&#39;(s)=0.\]</p><p>Thus the gradient is perpendicular to the tangent at a regular level-curve point. The tangent describes movement that preserves the objective to first order; the gradient describes local increase without imposing the separate optimisation constraint.</p><h3 class="util-md-heading util-md-heading--source-3">Feasible movement</h3><p>For a differentiable equality constraint \(g(x,y)=c\), the constraint gradient \(\nabla g\) is normal to the feasible curve wherever \(\nabla g\ne\mathbf{0}\). A tangent direction \(\mathbf{t}\) to that curve satisfies</p><p>\[\nabla g\cdot\mathbf{t}=0.\]</p><p>The dot product \(\nabla f\cdot\mathbf{t}\) then measures the first-order change in the objective along that feasible direction, using the chosen tangent as a path velocity. A positive value indicates first-order increase in the specified direction; a negative value indicates decrease. A zero value means there is no first-order change in that direction. It does not, by itself, establish a maximum or minimum.</p><p>For example, consider the separate functions \(F(u,v)=u+2v\) and \(h(u,v)=u+v=6\). A tangent to the constraint has direction \((1,-1)\), since \((1,1)\cdot(1,-1)=0\). The objective gradient is \((1,2)\), so its dot product with this tangent is \(-1\). This calculation illustrates how to test a feasible direction; it is not a solution to the rectangle activities.</p><h3 class="util-md-heading util-md-heading--source-3">Why the multiplier relationship arises</h3><p>At an interior constrained local optimum on a regular equality-constraint curve, the objective has zero first-order change along the feasible tangent. Both \(\nabla f\) and \(\nabla g\) are therefore perpendicular to the same tangent direction. In two dimensions, this means they lie along the same normal line, giving the necessary first-order condition</p><p>\[\nabla f=\lambda\nabla g,\qquad g(x,y)=c.\]</p><p>The scalar \(\lambda\) is the Lagrange multiplier. Parallel gradients need not point in the same direction: the multiplier may be positive or negative. It may also be zero if the objective gradient vanishes. In that case, the objective level curve need not possess the regular tangent assumed in the familiar picture of two smooth curves touching.</p><p>The regularity requirement \(\nabla g\ne\mathbf{0}\) matters because it supplies a well-defined normal to the constraint. The multiplier equations identify stationary candidates under the stated assumptions; they do not prove that a candidate is a maximum or minimum. Establishing optimality requires additional reasoning about the objective along the feasible set.</p><p>Finally, the numerical value of the multiplier depends on how the constraint is expressed. Multiplying a constraint equation by a non-zero constant preserves its feasible set but rescales its gradient, and therefore changes the corresponding multiplier. The geometric relationship remains the same.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/knowledge-summary-after-content.png" alt="Concept map linking level curves, feasible tangents and the regular multiplier condition; detailed description follows." aria-describedby="lj-c2--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> Conceptual links between level curves, feasible tangents, gradients and the necessary multiplier condition.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c2--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content">Two branches distinguish the objective from the constraint. For the objective, a non-zero gradient is perpendicular to the tangent of a regular constant-value curve. For the equality constraint, a non-zero constraint gradient is perpendicular to the feasible tangent. A connecting relationship shows that at a regular constrained local optimum, first-order objective change along the feasible tangent is zero. Both gradients therefore lie on the same normal line and are scalar multiples. The final relationship is labelled necessary, not sufficient; the multiplier may have either sign or be zero.</p></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Interpret labelled level curves of A(x,y)=xy and the constraint x+y=10 to distinguish feasible from infeasible points and explain how the constraint restricts possible improvements in area. <span class="util-outcome-id">(LO1)</span></li><li>Calculate and interpret the gradient grad A=(y,x) at a specified feasible point, predict the direction of greatest local increase in area, and distinguish that direction from the tangent to a regular area level curve. <span class="util-outcome-id">(LO2)</span></li><li>Identify a feasible tangent direction for x+y=10 and use gradient directions or directional derivatives to explain why feasible first-order improvement is possible at (4,6) but absent at (5,5). <span class="util-outcome-id">(LO3)</span></li><li>Explain why the objective and constraint gradients are parallel at a regular constrained optimum, express this relationship as grad f=lambda grad g with grad g non-zero, and distinguish the resulting first-order condition from proof of optimality. <span class="util-outcome-id">(LO4)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="lj-c2--journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="lj-c2--activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Explore feasible area curves</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The central question is why the largest unrestricted area is not necessarily the largest feasible area. Begin with the rectangle and its constraint, using level curves to connect numerical choices with geometric possibilities.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>If you completed &#39;Why the constraint matters&#39;, revisit your initial prediction about the rectangle with perimeter 20 units and your explanation of feasible choices. Use that reasoning to distinguish points you can reach while preserving the perimeter from points that would require changing it. Now investigate how constant-area curves help you see this distinction.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Interpret the constraint before comparing areas. Predict which labelled area curves can contain feasible points, then inspect the supplied coordinates and equations to support or revise your interpretation.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Explain how the constraint changes which area curves matter. If your initial prediction differed from your interpretation of the supplied curves, identify the mathematical evidence that led you to reconsider it.</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A1"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Review the mathematical feedback, then explain why an area curve containing an infeasible point does not establish a solution to the constrained problem.</p></span></div></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a1-feasible-curves-01-activity-a1-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/activity-a1-materials-entry.png" alt="Coordinate diagram with a perimeter line, four area curves and points P–S; detailed description follows." aria-describedby="lj-c2--figure-description-asset-vb-38-4-va-a1-feasible-curves-01-activity-a1-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 2.</strong> Compare the fixed-perimeter line with labelled area curves before checking the coordinates.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c2--figure-description-asset-vb-38-4-va-a1-feasible-curves-01-activity-a1-materials-entry">The horizontal axis represents x and the vertical axis represents y, both positive. A descending straight line is labelled x+y=10. Four decreasing curves are labelled xy=16, xy=24, xy=25 and xy=36. P is at (2,8), Q at (4,6), R at (5,5) and S at (6,6). The straight constraint line is distinguishable from the curved area levels through direct labels and line conventions. No point is marked as feasible, infeasible or optimal; learners must establish those conclusions using the equations.</p></figure><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A1-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">How area curves and constraints fit together</span></p><p>A level curve collects all coordinate pairs that give the same value of a function. For the rectangle, \(A(x,y)=k\) means that every point on that curve has area \(k\). Different curves represent different area values, but the curves themselves do not tell us which rectangles satisfy the fixed-perimeter requirement.</p><p>The constraint \(x+y=10\), together with \(x&gt;0\) and \(y&gt;0\), selects the permitted part of the coordinate plane. A particular area level is <strong>attainable</strong> only if its level curve intersects this feasible set. The geometric problem therefore involves two overlapping structures: a family of constant-area curves and a line of permitted rectangles.</p><p>Imagine moving from one coordinate pair to another. If \(x\) increases by a small amount while \(y\) decreases by exactly the same amount, their sum stays fixed. This movement follows the feasible line, although the area may change. By contrast, increasing both side lengths can increase area while also increasing their sum. That unrestricted movement may leave the feasible line.</p><p>The distinction is not between high and low areas alone. It is between areas that occur <strong>somewhere</strong> in the coordinate plane and areas that can occur <strong>while the perimeter remains fixed</strong>. The labelled curves and coordinate pairs in the scenario let you investigate that distinction without relying on colour or the precision of a diagram.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c2--learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="lj-c2--learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="lj-c2--learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c2--learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c2--learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="lj-c2--learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c2--learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Reconsider your earlier rectangle prediction and use the supplied labelled curves and coordinate pairs to predict which points are feasible and which area levels are attainable.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A1-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated rectangle: Feasible points and area curves</span></p><h3 class="util-md-heading util-md-heading--source-3">Simulated mathematical scenario</h3><p>A rectangle has positive side lengths \(x\) and \(y\), measured in units. Its perimeter is fixed at 20 units.</p><p>The area is</p><p>\[A(x,y)=xy.\]</p><p>The perimeter condition is</p><p>\[2x+2y=20,\]</p><p>or equivalently</p><p>\[x+y=10,\qquad x&gt;0,\quad y&gt;0.\]</p><p>On a coordinate plane, the horizontal axis represents \(x\), increasing to the right, and the vertical axis represents \(y\), increasing upwards.</p><p>The feasible line is labelled \(C: x+y=10\). In the positive quadrant, it runs between the excluded boundary endpoints \((0,10)\) and \((10,0)\).</p><p>Four constant-area curves are labelled:</p><ul><li>\(L_{16}:xy=16\)</li><li>\(L_{24}:xy=24\)</li><li>\(L_{25}:xy=25\)</li><li>\(L_{36}:xy=36\)</li></ul><p>Each is a decreasing curve in the positive quadrant. Its label identifies the area shared by every point on that curve.</p><table><thead><tr><th>Label</th><th>Coordinate pair</th><th>Area</th></tr></thead><tbody><tr><td>P</td><td>\((2,8)\)</td><td>\(16\)</td></tr><tr><td>Q</td><td>\((4,6)\)</td><td>\(24\)</td></tr><tr><td>R</td><td>\((5,5)\)</td><td>\(25\)</td></tr><tr><td>S</td><td>\((6,6)\)</td><td>\(36\)</td></tr></tbody></table><p><strong>Accessible coordinate description:</strong> P lies left of and above Q; R lies to the right of and below Q; S lies above and to the right of R. Use the equations and coordinates rather than colour or visual proximity to decide whether a point lies on the feasible line.</p><p>For each point, inspect both \(xy\) and \(x+y\). The area value identifies a level curve; the perimeter equation determines whether the point is permitted. Record your classifications in the comparison table before viewing the feedback.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d e it with your calculations.</p><p><strong>Your explanation:</strong></p><p><strong>Evidence from a coordinate pair or level curve:</strong></p><p><strong>Prediction confirmed or reconsidered:</strong></p></div><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a1-a1-prompt-item-a1-m4-item-4-4" name="learner-workspace-a1-a1-prompt-item-a1-m4-item-4-4" rows="4" aria-describedby="lj-c2--learner-workspace-a1-a1-prompt-item-a1-m4-item-4-4-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c2--learner-check-a1" data-check-sidebar-open aria-controls="lj-c2--learner-check-a1" aria-expanded="false" aria-label="Check your work: Explore feasible area curves">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c2--learner-check-a1" data-composition-moment="check" data-activity-id="A1" data-check-sidebar="available" aria-labelledby="lj-c2--learner-check-a1-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c2--learner-check-a1-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c2--learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c2--learner-task-a1">Back to your task (Explore feasible area curves)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M6" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m6" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m6-c-0" data-revision-criterion-id="a1-m6-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you tested feasibility using the perimeter equation rather than the area value?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Area measures the objective, whereas the equality constraint determines which rectangles belong to the optimisation problem.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each coordinate pair has an explicit substitution into x+y=10.</li><li><span class="util-guided-review__feature-key">B.</span> The feasibility judgement follows the constraint calculation.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Add the sum of the two coordinates in every row and compare that sum with the required value 10.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Where a judgement relies on area size or the apparent position in a diagram, replace that basis with the corresponding perimeter check.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a1-a1-m6-item-0" data-checklist-item-id="checklist-a1-a1-m6-item-0"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a1-a1-m6-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m6-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m6-c-1" data-revision-criterion-id="a1-m6-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you distinguished a point on an area curve from an attainable area level?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A level curve can contain infeasible points, so classifying one point does not always classify the entire level.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response connects each given area to its constant-area curve.</li><li><span class="util-guided-review__feature-key">B.</span> Claims of attainability are supported by a feasible point, while broader unattainability claims have separate justification.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the level equation xy=k associated with the coordinate pair before discussing attainability.</li><li><span class="util-guided-review__feature-key">Missing B:</span> If you infer that a whole level is impossible from one infeasible point, reconsider whether other points on the same curve could satisfy the constraint.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a1-a1-m6-item-1" data-checklist-item-id="checklist-a1-a1-m6-item-1"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a1-a1-m6-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m6-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m6-c-2" data-revision-criterion-id="a1-m6-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Does your explanation distinguish feasible movement from unrestricted movement?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The distinction explains why an unrestricted increase in area may not be an allowable improvement.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The explanation identifies a movement that preserves the sum of side lengths.</li><li><span class="util-guided-review__feature-key">B.</span> An unrestricted movement is discussed in relation to its effect on the constraint.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Describe how a change in one side length must be balanced by the opposite change in the other.</li><li><span class="util-guided-review__feature-key">Missing B:</span> For the movement you describe, state whether the sum x+y changes and why that matters.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a1-a1-m6-item-2" data-checklist-item-id="checklist-a1-a1-m6-item-2"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a1-a1-m6-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m6-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m6-c-3" data-revision-criterion-id="a1-m6-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you used the supplied mathematical particulars to justify your conclusions?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Coordinate-based evidence makes the interpretation testable rather than dependent on visual impressions.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> At least one specific coordinate pair supports the written explanation.</li><li><span class="util-guided-review__feature-key">B.</span> Area values and perimeter values are not conflated.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Select a point from the scenario and connect its coordinate sum to the claim you are making.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Where you mention a numerical result, identify whether it is an area or a sum of side lengths and explain its role.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a1-a1-m6-item-3" data-checklist-item-id="checklist-a1-a1-m6-item-3"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a1-a1-m6-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m6-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Review the example response</summary><div class="util-composition-reveal__body"><article class="util-material-block util-sample-output util-prose-measure" data-material-id="A1-M5" data-material-type="sample_output" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></span><span class="util-semantic-icon__label">Feedback: Checking feasible area levels</span></p><h3 class="util-md-heading util-md-heading--source-3">Reveal after completing your comparison</h3><p>The perimeter constraint is \(x+y=10\).</p><table><thead><tr><th>Point</th><th>Area</th><th>Constraint check</th><th>Feasible point?</th></tr></thead><tbody><tr><td>\((2,8)\)</td><td>\(16\)</td><td>\(2+8=10\)</td><td>Yes</td></tr><tr><td>\((4,6)\)</td><td>\(24\)</td><td>\(4+6=10\)</td><td>Yes</td></tr><tr><td>\((5,5)\)</td><td>\(25\)</td><td>\(5+5=10\)</td><td>Yes</td></tr><tr><td>\((6,6)\)</td><td>\(36\)</td><td>\(6+6=12\)</td><td>No</td></tr></tbody></table><p>The first three pairs establish that area levels 16, 24 and 25 are attainable. The pair \((6,6)\) has area 36, but its perimeter is 24 units rather than 20 units. Its larger area does not make it a feasible solution.</p><p>An infeasible point on a level curve does not, by itself, prove that the entire level is unattainable. Here we can test the level 36 more carefully. With \(y=10-x\), a feasible rectangle has</p><p>\[A=x(10-x)=25-(x-5)^2.\]</p><p>Because \((x-5)^2\geq0\), feasible area cannot exceed 25. Consequently, area 36 is unattainable under this constraint. This calculation also establishes that \((5,5)\) gives the unique global maximum among positive feasible side lengths.</p><p>This algebraic verification is distinct from the <strong>gradient and tangency argument</strong> developed later. A diagram can help you recognise where an area curve meets the feasible line, but the gradient argument will explain the local geometry of a regular constrained optimum.</p><h3 class="util-md-heading util-md-heading--source-3">Debrief</h3><p>Check whether your explanation distinguished a point&#39;s feasibility from an area level&#39;s attainability. If you initially treated the largest listed area as the best constrained answer, identify which constraint calculation changed that interpretation.</p></article></div></details></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c2--activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Predict gradients and tangents</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The level-curve comparison established which area values are feasible. The next step is to investigate local change at a point, so that the direction of increasing area can be distinguished from the direction that preserves an area level.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>A level curve shows where area stays constant. A gradient describes how area changes locally. Investigate how these two geometric ideas are related, and why the direction of greatest unrestricted increase differs from movement along a constant-area curve.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Begin with a prediction from the supplied local geometry. Calculate the gradient components, compare the resulting vector with the level-curve tangent, and use their dot product or equivalent reasoning to explain the relationship.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Explain why a gradient arrow and a tangent arrow describe different kinds of local movement. State how the calculation supports your interpretation.</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A2"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Review the modelled relationship and explain why movement along a regular level curve produces no first-order change in area.</p></span></div></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="3" data-figure-id="asset-vb-38-4-va-a2-gradient-normal-01-activity-a2-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/activity-a2-materials-entry.png" alt="Area curve through Q with its tangent and an unresolved normal direction; detailed description follows." aria-describedby="lj-c2--figure-description-asset-vb-38-4-va-a2-gradient-normal-01-activity-a2-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 3.</strong> Inspect the tangent at Q, then calculate the objective gradient to determine its normal direction.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c2--figure-description-asset-vb-38-4-va-a2-gradient-normal-01-activity-a2-materials-entry">On axes with x increasing rightwards and y upwards, the decreasing area curve xy=24 passes through Q=(4,6). A straight tangent line passes through Q and slopes downwards with slope -3/2. The tangent direction is identified as movement along the curve. A separate normal-direction cue indicates the perpendicular relationship to investigate, without supplying a numerical gradient vector or selecting a candidate direction. The fixed-perimeter tangent is not substituted for this area-level tangent.</p></figure><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A2-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Why gradients are normal to level curves</span></p><p>A differentiable function can change when either of its coordinates changes. Its partial derivatives describe the local rate of change with respect to each coordinate while the other is held fixed. Combining them gives the gradient:</p><p>\[\nabla f=(f_x,f_y).\]</p><p>At a point where \(\nabla f\ne\mathbf{0}\), the gradient points in the direction of greatest local increase <strong>per unit distance</strong>. Its magnitude gives that maximum rate. A direction vector \(\mathbf{t}\) describes another possible movement; the dot product \(\nabla f\cdot\mathbf{t}\) measures the first-order change per unit of the parameter whose path velocity is \(\mathbf{t}\). For a unit direction, it is the directional derivative per unit distance.</p><p>Now imagine travelling along a differentiable curve on which the function value stays constant. If the path is \(\mathbf{r}(s)\), then \(f(\mathbf{r}(s))=k\). Differentiating with respect to \(s\) gives</p><p>\[\frac{d}{ds}f(\mathbf{r}(s))=\nabla f\cdot\mathbf{r}&#39;(s)=0.\]</p><p>The path velocity \(\mathbf{r}&#39;(s)\) is tangent to the level curve. The zero dot product says that the gradient is perpendicular to this tangent. Where the gradient is non-zero, the level curve is regular locally, so this gives a meaningful normal direction.</p><p>The distinction is geometric: a tangent follows a route of constant function value to first order; a non-zero gradient points towards greatest increase. At a point where the gradient vanishes, the usual interpretation of a unique gradient normal to a regular level curve cannot simply be assumed.</p><p>Use this general reasoning to interpret the specific point and tangent in the scenario.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c2--learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="lj-c2--learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="lj-c2--learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c2--learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c2--learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="lj-c2--learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c2--learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect the supplied feasible point and local area-curve representation, then predict the direction of greatest unrestricted local increase.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A2-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated local geometry at a rectangle</span></p><h3 class="util-md-heading util-md-heading--source-3">Simulated mathematical scenario</h3><p>Consider the area function</p><p>\[A(x,y)=xy\]</p><p>at the point \(Q=(4,6)\). This point satisfies the fixed-perimeter constraint \(x+y=10\), but the curve you are investigating here is the <strong>area level curve</strong></p><p>\[xy=24.\]</p><p>The horizontal axis is \(x\), increasing to the right; the vertical axis is \(y\), increasing upwards. The area curve passes through Q and slopes downwards as it moves to the right.</p><p>A local tangent line touches the area curve at Q. To inspect its direction without relying on a drawing, use the following line description:</p><p>\[y-6=-\frac{3}{2}(x-4).\]</p><p>This describes the line&#39;s slope and position, but does not identify the gradient or interpret its relationship with the tangent.</p><p>For your initial prediction, consider three candidate directions from Q:</p><ul><li>Direction I: right and upwards, with displacement \((1,1)\).</li><li>Direction II: right and downwards, with displacement \((2,-3)\).</li><li>Direction III: left and upwards, with displacement \((-1,2)\).</li></ul><p>Predict which general direction best matches the greatest unrestricted local increase in area. Then calculate the gradient to determine the precise direction. You may use the tangent-line equation and coordinates instead of drawing arrows.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Calculate the partial derivatives of the area function and evaluate its gradient at the specified point.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A2-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Gradient and tangent reasoning workspace</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify a tangent direction to the area level curve and compare it with the gradient using a geometric or dot-product explanation.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A prediction of local increase, a correctly derived and evaluated gradient, and a reasoned comparison between the gradient and a tangent to the regular area level curve. The explanation uses the supplied point and mathematical relationships to distinguish greatest local increase from first-order constant-area movement.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m3-section-predicted-direction-1" data-response-part-id="A2-template-section-a2-m3-section-predicted-direction-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m3-section-predicted-direction-1-label" for="lj-c2--learner-workspace-a2-a2-template-section-a2-m3-section-predicted-direction-1">Predicted direction</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m3-section-predicted-direction-1-desc">Record your response for Predicted direction.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m3-section-predicted-direction-1" name="learner-workspace-a2-a2-template-section-a2-m3-section-predicted-direction-1" rows="6" aria-d
