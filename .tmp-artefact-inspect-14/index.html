" data-lj-nav-id="c3">From Evidence to Justified Action</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c4">Reconsidering a Provisional Decision</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c5">Independent Evidence-Informed Judgement</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c6">Evaluating the Quality of Independent Judgement</button></li></ol></nav></div></div></aside><div class="lj-shell__workspace"><div id="lj-shell-live" class="lj-shell__live" aria-live="polite" aria-atomic="true"></div><main id="lj-shell-main" class="lj-shell__main" data-lj-role="active-resource" tabindex="-1"></main></div></div><div class="lj-shell__templates" hidden aria-hidden="true"><template id="lj-resource-overview"><article class="lj-shell-overview" data-lj-overview="true" role="region" aria-labelledby="lj-shell-overview-heading"><h2 id="lj-shell-overview-heading" class="lj-shell-overview__title" data-lj-resource-title="true" tabindex="-1">Overview</h2><div class="lj-shell-overview__body"><p>Important decisions rarely come with perfect information. Evidence may be incomplete, sources may disagree, and different people may draw different conclusions from the same facts. Yet a decision may still be necessary.</p><p>In this Learning Journey, you will practise moving from uncertain evidence to a decision you can explain and defend. You will learn to distinguish what the evidence establishes from what people infer or assume, evaluate competing information, compare possible actions and justify a provisional choice.</p><p>You will also revisit an earlier decision when new evidence emerges. The aim is not always to change your mind, but to recognise when maintaining, qualifying or revising a judgement is justified.</p><p>You will begin with a university decision about library opening hours. As the journey develops, you will take increasing responsibility for evaluating evidence and making a recommendation. Finally, you will apply the same reasoning independently to an unfamiliar decision about traffic management near a school.</p><p><strong>What you will be able to do</strong></p><p>By the end, you should be able to:</p><ul><li>Distinguish evidence from interpretations and assumptions.</li><li>Evaluate the relevance and limitations of competing evidence.</li><li>Compare plausible actions and defend a provisional decision.</li><li>Reconsider a judgement when new information becomes available.</li><li>Apply these capabilities independently in an unfamiliar situation.</li></ul><p><strong>How to study</strong></p><p>Allow approximately <strong>120 minutes</strong> in total, completed at your own pace over <strong>one week</strong>. The six experiences build on one another, so work through them in order. You may take breaks between experiences.</p><p>You will sometimes need to retain your own reasoning for use later. In particular, keep a copy of the decision and justification you produce in the third experience. You will return to it when new evidence becomes available.</p><p>There may be more than one defensible answer. The quality of your reasoning matters more than selecting a particular option.</p></div></article></template><template id="lj-resource-c1"><article class="util-learner-page util-page util-learner-renderer-vnext util-page--expository" data-renderer="vnext" data-page-kind="expository" data-persistence-page-key="v1::d39a33d6-5b27-44f9-962f-03b1c153d574::learner-page::2.0.0::no-activities::evidence-interpretation-and-uncertainty" data-persistence-storage-key="learner-renderer-vnext:draft:v1::d39a33d6-5b27-44f9-962f-03b1c153d574::learner-page::2.0.0::no-activities::evidence-interpretation-and-uncertainty" data-composition-mode="moments" data-composed-activity-count="0" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Recognising Evidence, Interpretation and Uncertainty</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="5"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">A decision without a complete answer</span><p class="util-journey-position" aria-label="Section 1 of 5"><span class="util-journey-position__visible" aria-hidden="true">1 of 5</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#exposition-S2" aria-label="Next section: Evidence, interpretation and assumption: Three different roles"><span class="util-journey-adjacent__title">Evidence, interpretation and assumption: Three different roles</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#exposition-S1" aria-current="location">A decision without a complete answer</a></li><li><a class="util-journey-all-link" href="#exposition-S2">Evidence, interpretation and assumption: Three different roles</a></li><li><a class="util-journey-all-link" href="#exposition-S3">When evidence supports a claim but does not prove it</a></li><li><a class="util-journey-all-link" href="#exposition-S4">What remains uncertain, and why?</a></li><li><a class="util-journey-all-link" href="#exposition-S5">Making a reasonable judgement when information is incomplete</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/editorial-opening.png" alt="Illustration of students studying in a university library during the evening." loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> A quiet university library during an examination period, with individual study spaces and a visible evening atmosphere.</figcaption></figure></div><section class="util-exposition-sections" data-region="exposition"><section class="util-exposition-section" data-region-item="exposition-section" data-section-id="S1" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">A decision without a complete answer</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Imagine that your university is deciding whether to change its library opening hours during the examination period. Students need somewhere to study, but keeping a building open for longer requires staff, security and other resources. The university wants to make a reasonable decision, yet it cannot know in advance exactly how students would respond to different opening hours.</p><p>There are three options under consideration:</p><ul><li><strong>Option A:</strong> Maintain existing opening hours.</li><li><strong>Option B:</strong> Extend opening hours throughout the examination period.</li><li><strong>Option C:</strong> Introduce targeted extensions during periods of greatest anticipated demand.</li></ul><p>Each option raises questions. How many students want additional opening hours? Would they actually use them? Do some students have fewer opportunities than others to study at home? What would additional opening hours cost?</p><p>The university has some relevant information. Students have responded to a survey about opening hours. Building-access records show how the library was used during a previous examination period. Some students have described difficulties finding suitable places to study. The university also knows that extending hours would involve additional expenditure.</p><p>These sources are useful, but they do not provide a complete answer. A survey records what respondents said, not necessarily what every student thinks. Previous library use does not tell us exactly what would happen under different opening hours. Individual experiences may reveal important difficulties without showing how widespread they are. Costs depend partly on the arrangements eventually chosen.</p><p>The challenge is not simply to collect information and read off the correct option. Someone must decide what the information establishes, what it might suggest and what remains unknown. Those distinctions are the foundation of evidence-informed judgement.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-M01" data-material-kind="Accessible decision-options comparison" data-material-type="expository_structured_table" data-section-id="S1" data-expository-structured="table"><h3>The university&#39;s three options</h3><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Option</th><th scope="col">Proposed arrangement</th></tr></thead><tbody><tr><td>Option A</td><td>Maintain existing opening hours.</td></tr><tr><td>Option B</td><td>Extend opening hours throughout the examination period.</td></tr><tr><td>Option C</td><td>Introduce targeted extensions during periods of greatest anticipated demand.</td></tr></tbody></table></div></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" data-section-id="S2" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Evidence, interpretation and assumption: Three different roles</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Consider three statements about the university&#39;s proposed library opening hours:</p><ol><li><strong>A voluntary survey received 240 responses, and 168 respondents supported extended opening hours.</strong></li><li><strong>The survey suggests that longer opening hours could benefit some students.</strong></li><li><strong>Students who support longer opening hours will use the library during those additional hours.</strong></li></ol><p>These statements are connected, but they do different things.</p><h3 class="util-md-heading util-md-heading--source-3">Evidence: What information do we have?</h3><p><strong>Evidence</strong> is information relevant to supporting or challenging a claim. A claim is something that can be considered in light of available information. Evidence might include observations, records, survey responses or accounts of people&#39;s experiences.</p><p>The first statement reports a survey finding. It tells us what was recorded: 240 people responded, and 168 of them supported extending opening hours. Assuming the survey figures have been reported accurately, this is evidence about the preferences expressed by those respondents.</p><p>Notice the limits of the statement. It does not say that all students support longer opening hours. It does not say that respondents would use the additional hours. It simply reports the available information.</p><h3 class="util-md-heading util-md-heading--source-3">Interpretation: What might the evidence mean?</h3><p>An <strong>interpretation</strong> is an explanation of what evidence might indicate. It moves beyond reporting information to considering its significance.</p><p>The second statement interprets the survey result. If many respondents favour longer opening hours, it is reasonable to consider whether additional access could benefit some students. However, the survey does not directly measure the benefits students would receive. The interpretation connects the recorded preferences to a possible consequence.</p><p>An interpretation is not automatically wrong because it goes beyond the evidence. Reasoning often requires us to consider what information means. The question is whether the interpretation is plausible and whether its limitations are acknowledged.</p><h3 class="util-md-heading util-md-heading--source-3">Assumption: What are we treating as true?</h3><p>An <strong>assumption</strong> is something treated as true without sufficient evidence establishing it in the situation.</p><p>The third statement assumes that students who express support will actually use the additional hours. That might happen, but the survey result alone does not establish it. Someone might favour longer opening hours because they value having the option, even if they rarely use it. Others might use the library more often than they initially expect.</p><p>Assumptions are not necessarily false. Sometimes decisions require assumptions about circumstances that cannot yet be observed. What matters is recognising them rather than presenting them as findings.</p><h3 class="util-md-heading util-md-heading--source-3">How the three roles connect</h3><p>A line of reasoning might begin with a reported finding, develop an interpretation and rely on an assumption. For example:</p><ul><li><strong>Evidence:</strong> 168 of 240 survey respondents supported extended hours.</li><li><strong>Interpretation:</strong> Longer opening hours may meet a need among some students.</li><li><strong>Assumption:</strong> Those students would make use of the additional opening hours.</li></ul><p>The first statement reports information. The second proposes what it might mean. The third introduces something that has not been established.</p><p>These are roles within reasoning, rather than permanent labels attached to sentences. If the university later collected reliable information about actual use of extended hours, a proposition previously treated as an assumption might become supported by evidence.</p><p>Keeping the roles distinct makes an argument easier to examine. It allows you to agree that a finding is accurate while questioning an interpretation, or to accept that an interpretation is plausible while recognising that it depends on an uncertain assumption.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material util-exposition-structured-fallback" data-material-id="XM-M02" data-material-kind="Annotated reasoning-chain representation" data-material-type="expository_structured_fallback" data-section-id="S2" data-expository-structured="fallback"><h3>One argument, three different roles</h3><div><p><strong>Introductory text</strong></p><p>These statements concern the same library decision, but each performs a different role in the reasoning.</p></div><section><h4>Items</h4><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Position</th><th scope="col">Role</th><th scope="col">Statement</th><th scope="col">Annotation</th><th scope="col">Reasoning function</th></tr></thead><tbody><tr><td>1</td><td>Evidence</td><td>A voluntary survey received 240 responses, and 168 respondents supported extended opening hours.</td><td>This reports recorded information about the people who responded. It establishes their expressed preferences, not the preferences or future behaviour of every student.</td><td>Provides a factual starting point.</td></tr><tr><td>2</td><td>Interpretation</td><td>Longer opening hours may meet a need among some students.</td><td>This proposes a possible meaning of the survey finding. Expressed support makes the interpretation plausible, but the survey does not directly establish the benefit that additional hours would provide.</td><td>Connects the finding to a possible consequence.</td></tr><tr><td>3</td><td>Assumption</td><td>Students who support longer opening hours will use the library during those additional hours.</td><td>This treats expressed support as a reliable indication of future behaviour. The survey does not establish that respondents would actually use the additional hours.</td><td>Introduces a proposition that has not been sufficiently established.</td></tr></tbody></table></div></section><div><p><strong>Relationship summary</strong></p><p>The evidence records what respondents said. The interpretation suggests what their responses might mean. The assumption concerns what those students would do if opening hours changed.</p></div><div><p><strong>Qualification</strong></p><p>These are roles within this particular argument, not permanent labels for statements. An interpretation or assumption is not necessarily false. Further evidence could support, challenge or change its status.</p></div></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" data-section-id="S3" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">When evidence supports a claim but does not prove it</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The university&#39;s survey offers a useful example of why evidence can support a claim without proving it.</p><p>The university has approximately 12,000 students. A voluntary online survey about library opening hours received 240 responses. Of those respondents, 168 supported extended opening hours.</p><p>That means <strong>70% of respondents</strong> supported an extension. It does not mean that 70% of all students supported one.</p><p>The difference comes from the group being described. The survey result directly concerns the 240 people who chose to respond. The university&#39;s wider student population is much larger, and the survey does not establish that respondents reflect the views of everyone else.</p><h3 class="util-md-heading util-md-heading--source-3">From a finding to a broader claim</h3><p>Consider three statements:</p><ul><li><strong>&#39;168 of the 240 respondents supported extended hours.&#39;</strong> This reports the survey finding.</li><li><strong>&#39;The survey provides evidence that some students favour longer opening hours.&#39;</strong> This is supported by the finding, while remaining appropriately limited.</li><li><strong>&#39;Seventy per cent of all university students want longer opening hours.&#39;</strong> This goes beyond what the survey establishes.</li></ul><p>The third statement might turn out to be true, but the available survey cannot establish it. The problem is not the arithmetic. Seventy per cent is the correct proportion of respondents who supported an extension. The problem is applying that percentage to a different group without sufficient justification.</p><h3 class="util-md-heading util-md-heading--source-3">Why voluntary participation matters</h3><p>The survey was voluntary: students decided whether to respond. People with strong opinions about library opening hours may have been particularly motivated to participate. Those who were less interested might have been less likely to respond.</p><p>This creates uncertainty about <strong>representativeness</strong>: how far the respondents reflect the wider student population.</p><p>We cannot tell from the supplied information how closely the survey represents all students. We also cannot calculate the preferences of non-respondents. The survey therefore gives useful evidence of expressed support among respondents, but it does not settle the preferences of the whole university.</p><h3 class="util-md-heading util-md-heading--source-3">Support is not the same as proof</h3><p>Evidence <strong>supports</strong> a claim when it provides reasons to regard the claim as credible. Evidence <strong>proves</strong> a claim only when it is sufficient to establish it conclusively. Many practical decisions rely on evidence that provides support without removing all uncertainty.</p><p>The survey supports the claim that there is interest in longer opening hours among at least some students. It does not prove that most students want them, that respondents will use the additional hours, or that extending hours is the best option.</p><p>This does not make the survey worthless. Rejecting the broader generalisation does not require rejecting the narrower finding. A careful conclusion preserves what the evidence establishes while avoiding claims it cannot justify.</p><p>For example: <strong>&#39;A majority of survey respondents supported extended hours, suggesting that additional access may be valued by some students. Because participation was voluntary, the result does not establish the preferences of the wider student population.&#39;</strong></p><p>That conclusion is qualified, but it is not indecisive. It tells us both what the survey contributes and what remains uncertain.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-M03" data-material-kind="Graduated evidence-to-claim comparison" data-material-type="expository_structured_table" data-section-id="S3" data-expository-structured="table"><h3>How far does the survey evidence reach?</h3><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Statement</th><th scope="col">Relationship to evidence</th><th scope="col">Explanation</th></tr></thead><tbody><tr><td>168 of the 240 survey respondents supported extended opening hours.</td><td>Directly supported finding</td><td>This reports the recorded result. It concerns the respondents and does not make a claim about students who did not respond.</td></tr><tr><td>The survey provides evidence that some students favour longer opening hours.</td><td>Supported, appropriately limited conclusion</td><td>The responses establish that some students expressed this preference. The statement does not claim that their views represent the whole university.</td></tr><tr><td>70% of all university students want longer opening hours.</td><td>Not established by the survey</td><td>The percentage describes respondents, not the approximately 12,000 students. Because participation was voluntary, respondents may overrepresent students with strong interests in opening hours. The preferences of non-respondents are unknown.</td></tr></tbody></table></div></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" data-section-id="S4" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">What remains uncertain, and why?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The survey is not the only source of information available to the university. It also has records of previous library use and comments from students about their study circumstances. These sources reveal different kinds of uncertainty.</p><h3 class="util-md-heading util-md-heading--source-3">Previous use is not the same as future demand</h3><p>Building-access records from a previous examination period show that late-evening occupancy was relatively low compared with daytime use.</p><p>That is a finding about <strong>observed behaviour</strong>: how the building was used under the arrangements operating at the time.</p><p>One interpretation is that relatively few students need library access late in the evening. If that interpretation is accurate, extending opening hours might produce limited additional use.</p><p>But another possibility is that existing arrangements restricted opportunities to study later. Students cannot use opening hours that are not available, and their behaviour might change if the university offered different access.</p><p>The records do not establish which interpretation best predicts future use. They tell us what happened previously, not exactly what would happen under a new arrangement.</p><p>This distinction separates <strong>historical usage</strong> from <strong>future demand</strong>. Historical records are relevant evidence, but predictions about future demand require an additional step in reasoning. That step may depend on assumptions about how students would respond to changed opening hours.</p><p>The appropriate conclusion is not that the records prove there is no need for an extension. Nor is it that the records are irrelevant. They provide useful information about previous occupancy while leaving demand for newly available hours uncertain.</p><h3 class="util-md-heading util-md-heading--source-3">Reported difficulties are not the same as their prevalence</h3><p>The university has also received a small collection of student comments describing difficulties studying at home. Some students mention shared accommodation, caring responsibilities or limited access to quiet space.</p><p>These comments provide evidence of <strong>reported experiences</strong>. They identify circumstances in which access to a university study space may be particularly valuable.</p><p>However, the comments do not tell us how widespread those circumstances are across the university. The number of comments is small, and no information has been provided that would establish the proportion of students affected.</p><p>This is the distinction between an experience being reported and its <strong>prevalence</strong>: how common it is in a wider population.</p><p>It would be unsupported to conclude that most students lack suitable study space at home. It would also be mistaken to dismiss the comments simply because their prevalence is unknown. The reports identify possible access difficulties that are relevant to the decision, even though they do not establish how many students experience them.</p><h3 class="util-md-heading util-md-heading--source-3">Different evidence leaves different questions open</h3><p>The survey tells us about the preferences of respondents, but not necessarily the whole population. Historical access records tell us about previous occupancy, but not demand for newly available hours. Student comments describe reported difficulties, but not how widespread they are.</p><p>Each source has a different contribution and a different limitation.</p><p><strong>Uncertainty</strong> means that some relevant questions cannot be answered confidently or completely from the available information. It does not mean that nothing is known.</p><p>A useful way to express a conclusion is to state what the evidence establishes and then identify the unresolved question. For example: <strong>&#39;Previous records show relatively low late-evening occupancy, but they do not establish how students would use newly available opening hours.&#39;</strong></p><p>That statement preserves the finding and its limitation together. It avoids turning uncertainty into either unwarranted certainty or a reason to ignore the evidence.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-M04" data-material-kind="Evidence contribution and uncertainty comparison" data-material-type="expository_structured_table" data-section-id="S4" data-expository-structured="table"><h3>Different evidence, different uncertainties</h3><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Evidence source</th><th scope="col">What it establishes</th><th scope="col">What it might suggest</th><th scope="col">What remains uncertain</th><th scope="col">Central distinction</th></tr></thead><tbody><tr><td>Historical building-access records from a previous examination period</td><td>Late-evening occupancy was relatively low compared with daytime use under the opening arrangements operating at that time.</td><td>One interpretation is that relatively few students needed late-evening access. Another possibility is that existing arrangements limited opportunities for later use.</td><td>The records cannot establish how students would use newly available hours. Neither interpretation of future demand is proved by the historical records.</td><td>Observed behaviour is not the same as future demand.</td></tr><tr><td>A small collection of student comments about difficulties studying at home</td><td>Some students reported difficulties associated with shared accommodation, caring responsibilities or limited access to quiet space.</td><td>Access to a university study space may be particularly valuable to students experiencing these circumstances.</td><td>The comments do not establish how widespread these difficulties are across the student population.</td><td>Reported experience is not the same as prevalence.</td></tr></tbody></table></div></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" data-section-id="S5" data-expository-section-role="terminal-close" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Making a reasonable judgement when information is incomplete</span></h2><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material util-exposition-diagram-caption" data-material-id="XM-M05" data-material-kind="Integrated evidence-to-judgement reasoning map" data-material-type="expository_diagram_caption" data-section-id="S5" data-expository-structured="diagram_caption" data-diagram-represented-by="section-visual-affordance"><h3>From available evidence to provisional judgement</h3></article></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--section-after-content" data-visual-slot="section-after-content" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-s5-generate-01-section-s5-section-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/section-after-content.png" alt="Concept map connecting evidence, interpretation, assumption and uncertainty to provisional judgement; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-s5-generate-01-section-s5-section-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption" id="figure-description-asset-vb-38-4-va-s5-generate-01-section-s5-section-after-content"><strong>Figure 2.</strong> Five labelled concepts form a relationship map. Evidence is connected to Interpretation with the explanation that evidence informs possible meanings without automatically establishing them. Interpretation is connected to Assumption because an interpretation may depend on something not sufficiently established. Evidence is also connected to Uncertainty because its limitations leave relevant questions unanswered. Interpretation, Assumption and Uncertainty each connect to Provisional judgement. Their connections explain that qualified interpretations can inform a judgement, assumptions should be acknowledged, and unresolved questions may require the judgement to be revised. The relationships are not presented as a mandatory sequence. The map does not identify a preferred library opening-hours option.</figcaption></figure><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation" data-expository-closure="terminal"><p>The university now has several pieces of relevant information, but important questions remain unanswered.</p><p>The survey shows support for extended opening hours among respondents, although it does not establish the preferences of all students. Previous access records show relatively low late-evening occupancy compared with daytime use, although they cannot establish demand for newly available hours. Student comments identify difficulties studying at home, although they do not show how widespread those difficulties are.</p><p>The university must also consider resources. Extending opening hours would require additional staffing, security and operational expenditure. The costs are provisional because they depend on how far and when opening hours are extended.</p><p>None of these findings, considered alone, establishes what the university should do.</p><h3 class="util-md-heading util-md-heading--source-3">Considering the three alternatives</h3><p><strong>Option A: Maintain existing opening hours.</strong> This would avoid expenditure associated with extending opening hours. However, maintaining the existing arrangements might leave some students&#39; requests or access difficulties unresolved. The evidence does not establish how many students would be affected.</p><p><strong>Option B: Extend opening hours throughout the examination period.</strong> This would make additional library access available during the period. Some students might value or use that access, but the survey does not establish how many would use it. Additional staffing, security and operational costs would also need to be considered.</p><p><strong>Option C: Introduce targeted extensions during periods of greatest anticipated demand.</strong> This would concentrate additional opening hours at selected times. Its usefulness would depend partly on whether the university could anticipate demand accurately. Historical records may inform that judgement, but they cannot establish future demand for newly available hours.</p><p>These are considerations, not settled conclusions about which option is best. Different interpretations of the available evidence could lead people to place different weight on access, anticipated use and costs.</p><h3 class="util-md-heading util-md-heading--source-3">What makes a judgement provisional?</h3><p>A <strong>provisional judgement</strong> is a reasoned conclusion made using the information currently available while recognising that the conclusion may need to change if further evidence becomes available.</p><p>Provisional does not mean random, careless or unsupported. It means that the reasons for a judgement are made clear without pretending that all uncertainty has disappeared.</p><p>A transparent explanation of a decision would distinguish four things:</p><ol><li><strong>What the evidence establishes.</strong> For example, the survey records support among 168 respondents, and previous records show relatively low late-evening occupancy compared with daytime use.</li><li><strong>What is interpreted from that evidence.</strong> For example, survey support may suggest that additional access would benefit some students, while historical usage may suggest limits to likely demand.</li><li><strong>What is being assumed.</strong> For example, a prediction about how students would use additional opening hours depends on assumptions about future behaviour.</li><li><strong>What remains uncertain.</strong> For example, the university does not know the preferences of all students, the demand for newly available hours, the prevalence of reported study difficulties or the final costs of an extension.</li></ol><p>These distinctions allow a judgement to be examined and, if necessary, reconsidered. New information might strengthen an existing interpretation, weaken an assumption or change the apparent merits of an alternative.</p><h3 class="util-md-heading util-md-heading--source-3">Reasoning without pretending to know everything</h3><p>A university may need to decide on opening hours before every question can be answered. Waiting for complete certainty may not be possible, but acting without examining the evidence would also be difficult to justify.</p><p>Evidence-informed judgement lies between those extremes. It uses relevant information, explains what that information supports, acknowledges the assumptions connecting findings to possible consequences, and recognises unresolved questions.</p><p>The library case remains open: Option A, Option B and Option C each involve considerations that the available evidence does not settle conclusively. The purpose of distinguishing evidence, interpretation and assumption is not to make every decision obvious. It is to make the reasoning behind a decision clearer.</p><p>You can now recognise the different roles within an argument. A <strong>finding</strong> describes what is recorded. An <strong>interpretation</strong> explains what that finding might mean. An <strong>assumption</strong> identifies something being treated as true without sufficient evidence. <strong>Uncertainty</strong> marks the limits of what can be established, and a <strong>provisional judgement</strong> uses the available information without concealing those limits.</p><p>A conclusion can therefore be careful and useful without being final. Evidence may support a claim without proving it, and a reasonable decision may still be necessary while important questions remain unanswered.</p></div></section></section></article></template><template id="lj-resource-c2"><article class="util-learner-page util-page util-learner-renderer-vnext" data-renderer="vnext" data-page-kind="interactive" data-persistence-page-key="v1::fb0ecbab-8522-4c44-9739-938b112fb8be::learner-page::2.0.0::a1-a2-a3::judging-evidence:-strength-significance-and-uncertainty" data-persistence-storage-key="learner-renderer-vnext:draft:v1::fb0ecbab-8522-4c44-9739-938b112fb8be::learner-page::2.0.0::a1-a2-a3::judging-evidence:-strength-significance-and-uncertainty" data-composition-mode="moments" data-composed-activity-count="3" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Evaluating and Weighing Evidence</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="5"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 5"><span class="util-journey-position__visible" aria-hidden="true">1 of 5</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#activity-A1" aria-label="Next section: Judge What Each Source Supports"><span class="util-journey-adjacent__title">Judge What Each Source Supports</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#activity-A1">Judge What Each Source Supports</a></li><li><a class="util-journey-all-link" href="#activity-A2">Weigh Evidence Across Different Questions</a></li><li><a class="util-journey-all-link" href="#activity-A3">Synthesize Evidence and Preserve Uncertainty</a></li><li><a class="util-journey-all-link" href="#journey-study-tips">Study tips</a></li></ul></div></div></nav><section class="util-page-orientation" data-region="orientation"><div id="journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>This self-study resource uses a fictional university library scenario to explore how evidence can be evaluated and compared. Begin with the four evidence records in the first activity, then compare their contributions to different questions before producing a qualified synthesis. The activities take approximately 25 minutes and build on your earlier work distinguishing evidence, interpretation and assumption. You do not need to retrieve previous responses.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>The activities progress from evaluating individual sources to making comparative judgements and then integrating evidence into a qualified account. The first activity provides explicit criteria and a worked example; the later activities require increasingly independent reasoning. The opening-hours options provide a common context, but choosing between them belongs to the next learning component.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><p>Evidence evaluation begins by distinguishing <strong>what a source reports</strong> from <strong>what someone infers from it</strong>. An observation may support a narrow conclusion without establishing a broader claim.</p><p><strong>Relevance</strong> concerns whether evidence addresses the question being asked. <strong>Credibility</strong> concerns the grounds for trusting the source and its account. <strong>Reliability</strong> concerns the dependability of the process that produced the information. <strong>Limitations</strong> identify conditions or missing information that restrict what can reasonably be concluded.</p><p><strong>Evidential strength</strong> describes how well a source supports a particular claim. <strong>Evidential significance</strong> describes how much that supported claim contributes to a particular question. Neither is a permanent ranking attached to a source independently of its use.</p><p>The fictional library evidence illustrates these distinctions:</p><ul><li>A <strong>voluntary survey</strong> records that 168 of 240 respondents favoured extended hours, from a student population of approximately 12,000. It provides evidence about respondents&#39; expressed preferences, but voluntary participation prevents an unsupported generalisation to all students. Expressed preferences do not establish future attendance.</li><li><strong>Historical building-access records</strong> indicate relatively low late-evening occupancy under previous arrangements. They describe observed use in those conditions but do not establish demand for hours that were not previously available.</li><li>A <strong>small number of student comments</strong> report unequal access to quiet study facilities. They identify concerns worth considering but do not establish how widespread those concerns are. Limited evidence of prevalence does not make the reported concern unimportant.</li><li><strong>Provisional operational costs</strong> identify additional staffing, security and operating implications. Their significance depends on the question being considered, and their provisional status means they must not be presented as fixed costs.</li></ul><p>These sources address different phenomena: expressed preference, observed behaviour, reported access concerns and estimated resource implications. They may <strong>complement</strong> one another without <strong>corroborating</strong> the same claim. Apparent tension between survey support for extended hours and low historical occupancy is not necessarily a genuine contradiction, because the records concern different observations and conditions.</p><p>A defensible synthesis identifies each source&#39;s contribution, explains the limits of any connections between sources and preserves <strong>consequential uncertainty</strong>. It does not resolve missing relationships by assumption or treat uncertainty as a reason to discard every source. The resulting evaluation provides a basis for later consideration of the three opening-hours options; it does not itself determine which option should be chosen.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/knowledge-summary-after-content.png" alt="Concept map linking evidence evaluation, comparative significance and qualified synthesis; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption" id="figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><strong>Figure 1.</strong> The map connects a reported source and a particular claim to relevance, credibility, reliability and limitations. These considerations inform a judgement of evidential strength. A separate connection links the supported claim to the question being investigated, establishing its evidential significance. Four source categories remain distinct: expressed preferences, historical observed use, reported access concerns and provisional costs. Their contributions may be complementary without being direct corroboration. Apparent conflicts and unresolved uncertainties restrict broader inference. The final relationship leads to a qualified evidence synthesis, not a choice of opening-hours option.</figcaption></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Evaluate the relevance, credibility, reliability and limitations of individual evidence sources, explaining what each source can reasonably support and where broader conclusions would be unjustified. <span class="util-outcome-id">(LO1)</span></li><li>Compare the evidential strength and significance of different sources, justifying how their contributions vary according to the question being considered rather than applying a single ranking criterion. <span class="util-outcome-id">(LO2)</span></li><li>Synthesize the available evidence into a qualified evaluation that distinguishes apparent conflicts from genuine contradictions, identifies consequential uncertainties, and explains which conclusions remain supported without selecting a course of action. <span class="util-outcome-id">(LO3)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Judge What Each Source Supports</h2><div class="util-badge-row"><span class="util-badge util-badge-time">10 min</span></div></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Distinguishing evidence from interpretation and assumption provides the starting point for evaluating its strength. This activity moves from recognising reported information to judging the relevance, credibility, reliability and limitations of the four sources available to the university.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>The university is considering three library opening-hours arrangements for the examination period: Option A maintains existing hours, Option B extends hours throughout the examination period, and Option C introduces targeted extensions during periods of greatest anticipated demand. Your task here is to evaluate the evidence, not choose an option. If you completed the earlier activity on evidence, interpretation and assumption, revisit your own distinctions and use them to separate reported information from conclusions that go beyond it. No previous responses are required or transferred automatically.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Evaluate each source in relation to a specific claim. Consider what the source directly establishes, whether its collection or recording process supports confidence, and which broader conclusions remain unjustified. A limitation should change the scope of your conclusion rather than automatically invalidate the source.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which conclusion did you initially think a source supported, and how did examining its limitations change the strength or scope of that conclusion?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A1"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Read the four evidence records concerning student preferences, historical library usage, student access concerns and provisional costs.</p></span></div></div><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A1-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Five Ways to Evaluate Evidence</span></p><h3 class="util-md-heading util-md-heading--source-2">What can this evidence support?</h3><p><strong>Relevance</strong> concerns whether information addresses the particular claim being considered. A trustworthy record can still be irrelevant to a different question.</p><p><strong>Credibility</strong> concerns reasons to trust the source and its account, including how information was obtained and represented. Credibility does not guarantee that every interpretation of the information is justified.</p><p><strong>Reliability</strong> concerns the dependability of the information-producing process. A consistently recorded observation may be reliable for what was measured without predicting what would happen under different conditions.</p><p><strong>Limitations</strong> identify what the evidence leaves unknown or what restricts its use. A limitation does not necessarily make evidence worthless; it may narrow the conclusion that can reasonably follow.</p><p><strong>Evidential strength</strong> is the degree of support a source provides for a <strong>specific claim</strong>. To judge strength, connect the claim to the reported particulars, consider their credibility and reliability, and explain how limitations affect the conclusion. The same source may strongly support one claim and weakly support another.</p></article></div><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Examine the brief explanation of relevance, credibility, reliability and evidential strength, including a separate illustration of how a limitation changes a conclusion.</p></span></div></div><div class="util-composition-learn-item util-composition-learn-item--example" data-composition-role="example"><article class="util-worked-example util-prose-measure" data-material-id="A1-M3" data-material-type="worked_example" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></span><span class="util-semantic-icon__label">Worked Example: Evaluating a Service Record</span></p><h3 class="util-md-heading util-md-heading--source-2">From an observation to a qualified judgement</h3><p>Consider a <strong>separate fictional university service</strong>. A campus equipment-loan desk recorded 36 laptop loans on one Tuesday. Its electronic transaction log lists the date, each completed loan and the equipment category. A manager proposes the claim: <em>Students need at least 36 loan laptops every day.</em></p><p>The transaction log is <strong>relevant</strong> because it records actual completed loans, rather than opinions about the service. Its credibility is supported by identifiable transaction records generated during normal service. Its reliability is plausible for counting completed loans, although the example provides no independent audit of the log. These features give reasonable grounds to accept that 36 loans were recorded on the specified Tuesday.</p><p>The proposed claim, however, concerns <strong>every day</strong>, while the observation concerns only one Tuesday. Completed loans also do not reveal requests that could not be met or how many students might have borrowed equipment under different arrangements. An alternative interpretation is that Tuesday&#39;s demand differed from other days. Neither interpretation can be resolved from this single record.</p><p>The record therefore provides stronger support for a <strong>day-specific account of completed borrowing</strong> than for a general daily requirement. The defensible judgement is: <em>The desk recorded 36 completed laptop loans on the Tuesday observed; further evidence would be needed to estimate a typical daily requirement.</em></p><p>Notice the reasoning sequence: identify the precise claim, assess what was recorded, weigh the grounds for confidence against the observation&#39;s limits, and narrow the conclusion accordingly. Apply that method independently to the library evidence.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Complete the evidence evaluation table. For each source, identify what it directly supports, judge its relevance and the available grounds for credibility or reliability, identify its principal limitation, and explain one broader inference that would be unjustified.</p></span></div><article class="util-material-block util-material-table-block" data-material-id="A1-M1" data-material-type="data_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Simulated Library Evidence Records</span></p><h3 class="util-md-heading util-md-heading--source-2">Evidence available to the university</h3><p>The following records belong to a <strong>fictional university scenario</strong>. They are simulated educational evidence, not independently verified institutional data.</p><p>The university is considering whether to maintain existing library opening hours, extend hours throughout the examination period, or introduce targeted extensions during periods of greatest anticipated demand.</p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Source</th><th>Reported information</th><th>Collection context or condition</th></tr></thead><tbody><tr><td>Student preference survey</td><td>A voluntary online survey received responses from 240 students out of a student population of approximately 12,000. Of the 240 respondents, 168 favoured extended library opening hours.</td><td>Participation was voluntary. The record does not establish how respondents compare with students who did not participate.</td></tr><tr><td>Historical building-access records</td><td>Records from previous arrangements show relatively low late-evening occupancy.</td><td>The records concern attendance under the opening arrangements that existed when the observations were made.</td></tr><tr><td>Student access comments</td><td>A small number of student comments report unequal access to quiet study facilities.</td><td>The available information consists of a small number of comments; no population-wide frequency is supplied.</td></tr><tr><td>Provisional operational costs</td><td>Additional staffing, security and operating costs have been identified.</td><td>The estimates are provisional, and the additional costs depend on the extent of any opening-hours extension.</td></tr></tbody></table></div><p>Use the reported information and its collection conditions to evaluate each source. The table deliberately does not state which conclusions you should reach.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Use the diagnostic feedback to review whether each limitation has a genuine consequence for the conclusion you can support.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a1-a1-m4" data-material-source-id="A1-M4" data-activity-id="A1"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A1-M4" data-material-type="analysis_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Your Four-Source Evaluation</span></p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="a1-
