r than merely summarising the comparison. Connect evidence to consequences, explain the weighting of priorities, and establish why the selected option is preferable under those priorities. Acknowledge competing reasons without weakening the clarity of the recommendation.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">What is the strongest reason for your chosen action, and what is the strongest reasonable objection to it? How does your justification address that objection?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A2"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A2-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Reasoning Towards a Defensible Recommendation</span></p><h3 class="util-md-heading util-md-heading--source-2">Turning comparison into justified action</h3><p>The question is not simply whether students would welcome longer opening hours. It is <strong>which of the three available policies can be defended most convincingly under your stated priorities, given what the evidence does and does not establish</strong>.</p><p>A recommendation requires a judgement about competing considerations. The original evidence offers several relevant grounds for that judgement, but none determines a unique answer.</p><p>The survey records support for extended hours among the students who responded. That is relevant to potential access benefits, but voluntary participation means the result cannot be treated as a representative measure of demand across the university. Historical access records provide a different perspective: late-evening occupancy was relatively low under previous arrangements. They matter when considering resource commitments, but they do not establish how students would behave if opening arrangements changed. The limited student comments identify access difficulties that deserve consideration, without revealing how common those difficulties are. Provisional costs establish that staffing, security and operations belong in the decision, but not the precise scale of the financial consequences.</p><p>These sources therefore create a genuine policy tension. Additional availability may address access needs, yet its benefits and resource requirements cannot be measured confidently from the supplied information. Maintaining current arrangements avoids committing to a change, but that choice must still be considered against possible unmet needs. Targeting extensions changes the relationship between availability and anticipated demand, but deciding when demand will be greatest remains uncertain.</p><h3 class="util-md-heading util-md-heading--source-3">How to make the judgement</h3><p>Begin with your priorities. If access and equity receive greatest weight, explain why those considerations matter and how the evidence bears on them. If resource restraint or uncertainty receives greater weight, explain why that deserves priority instead. Neither approach is automatically superior: its strength depends on the connection between the criterion, the evidence and the policy consequences.</p><p>Then compare your selected action with <strong>both</strong> alternatives. A defensible argument recognises what the rejected policies might achieve, identifies the trade-offs your own choice accepts, and explains why your priorities justify accepting them. The argument is weaker if it treats the survey as representative of all students, assumes previous occupancy predicts future demand, invents precise costs or dismisses competing policies without examination.</p><p>Finally, make a clear <strong>provisional</strong> judgement. The decision can be reasoned and actionable without being certain. Your conclusion should follow from the relative weight you give the evidence, access needs, resource commitments and unresolved uncertainty. Another learner may reasonably choose differently while meeting the same standard of justification.</p><p>Use your own comparison to complete the recommendation workspace. No option has been selected for you.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Compose a written justification identifying the selected action and explaining which original evidence most strongly supports it. Distinguish evidence from interpretation where necessary.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A2-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated Library Evidence for Your Decision</span></p><h3 class="util-md-heading util-md-heading--source-2">The decision and original evidence</h3><p><strong>Fictional, simulated educational case.</strong> The university is deciding how its library should operate during the examination period. Use the evidence below together with the comparison you have just completed. No new evidence has been introduced.</p><h3 class="util-md-heading util-md-heading--source-3">Available actions</h3><ul><li><strong>Option A:</strong> Maintain existing opening hours.</li><li><strong>Option B:</strong> Extend opening hours throughout the examination period.</li><li><strong>Option C:</strong> Introduce targeted extensions during periods of greatest anticipated demand.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Evidence unit 1: Voluntary student survey</h3><ul><li>Approximate student population: <strong>12,000</strong>.</li><li>Voluntary survey respondents: <strong>240</strong>.</li><li>Respondents supporting extended hours: <strong>168</strong>, or <strong>70% of respondents</strong>.</li><li>Self-selection limits any claim that the survey represents the entire student population.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Evidence unit 2: Historical building-access records</h3><ul><li>Previous arrangements recorded <strong>relatively low late-evening occupancy</strong>.</li><li>These records do not establish how much demand would exist under extended opening hours.</li><li>No additional hourly figures or demand forecasts are supplied.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Evidence unit 3: Student comments</h3><ul><li>A <strong>limited number of comments</strong> identify unequal access to suitable study space.</li><li>Their limited availability does not establish how widespread the problem is.</li><li>No verbatim comments or prevalence estimates are supplied.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Evidence unit 4: Operational costs</h3><ul><li>Staffing, security and operational costs are relevant to opening-hours changes.</li><li>Available cost information is <strong>provisional</strong>.</li><li>No confirmed amounts or definitive cost rankings are supplied.</li></ul><p>Your recommendation must be based on these particulars, their limitations and your explicitly stated priorities. More than one option may be defensible.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain why your selected action is preferable to each of the other two options under your stated priorities. Acknowledge relevant strengths of the alternatives rather than dismissing them.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A2-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">My Provisional Library Recommendation</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain the principal benefits you seek and the disadvantages, resource commitments or risks you are prepared to accept.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>An independently composed provisional recommendation that explicitly selects one established library option and presents a coherent evidence-based argument for it. The justification must accurately use relevant original evidence, explain the learner&#39;s priorities, compare the selected policy with both alternatives, and acknowledge meaningful trade-offs. The reasoning must remain defensible without claiming that the chosen option is unquestionably superior or that unresolved evidence limitations have disappeared.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m3-section-my-provisional-recommendation-1" data-response-part-id="A2-template-section-a2-m3-section-my-provisional-recommendation-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-template-section-a2-m3-section-my-provisional-recommendation-1-label" for="learner-workspace-a2-a2-template-section-a2-m3-section-my-provisional-recommendation-1">My provisional recommendation</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-template-section-a2-m3-section-my-provisional-recommendation-1-desc">State whether you recommend Option A, Option B or Option C. Identify the action clearly.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-template-section-a2-m3-section-my-provisional-recommendation-1" name="learner-workspace-a2-a2-template-section-a2-m3-section-my-provisional-recommendation-1" rows="5" aria-describedby="learner-workspace-a2-a2-template-section-a2-m3-section-my-provisional-recommendation-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m3-section-supporting-evidence-and-its-significance-2" data-response-part-id="A2-template-section-a2-m3-section-supporting-evidence-and-its-significance-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-template-section-a2-m3-section-supporting-evidence-and-its-significance-2-label" for="learner-workspace-a2-a2-template-section-a2-m3-section-supporting-evidence-and-its-significance-2">Supporting evidence and its significance</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-template-section-a2-m3-section-supporting-evidence-and-its-significance-2-desc">Identify the original evidence that matters most to your decision. Explain how it supports your reasoning and where its limitations constrain your claims.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-template-section-a2-m3-section-supporting-evidence-and-its-significance-2" name="learner-workspace-a2-a2-template-section-a2-m3-section-supporting-evidence-and-its-significance-2" rows="6" aria-describedby="learner-workspace-a2-a2-template-section-a2-m3-section-supporting-evidence-and-its-significance-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m3-section-my-priorities-and-reasons-for-weighting-them-3" data-response-part-id="A2-template-section-a2-m3-section-my-priorities-and-reasons-for-weighting-them-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-template-section-a2-m3-section-my-priorities-and-reasons-for-weighting-them-3-label" for="learner-workspace-a2-a2-template-section-a2-m3-section-my-priorities-and-reasons-for-weighting-them-3">My priorities and reasons for weighting them</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-template-section-a2-m3-section-my-priorities-and-reasons-for-weighting-them-3-desc">State which considerations carry greatest weight in your judgement and why. Explain how those priorities influence your selection.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-template-section-a2-m3-section-my-priorities-and-reasons-for-weighting-them-3" name="learner-workspace-a2-a2-template-section-a2-m3-section-my-priorities-and-reasons-for-weighting-them-3" rows="6" aria-describedby="learner-workspace-a2-a2-template-section-a2-m3-section-my-priorities-and-reasons-for-weighting-them-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m3-section-why-i-prefer-this-action-to-the-first-alternative-4" data-response-part-id="A2-template-section-a2-m3-section-why-i-prefer-this-action-to-the-first-alternative-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-template-section-a2-m3-section-why-i-prefer-this-action-to-the-first-alternative-4-label" for="learner-workspace-a2-a2-template-section-a2-m3-section-why-i-prefer-this-action-to-the-first-alternative-4">Why I prefer this action to the first alternative</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-template-section-a2-m3-section-why-i-prefer-this-action-to-the-first-alternative-4-desc">Identify one option you have not selected. Explain a relevant advantage it may offer and why your chosen action is preferable under your priorities.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-template-section-a2-m3-section-why-i-prefer-this-action-to-the-first-alternative-4" name="learner-workspace-a2-a2-template-section-a2-m3-section-why-i-prefer-this-action-to-the-first-alternative-4" rows="6" aria-describedby="learner-workspace-a2-a2-template-section-a2-m3-section-why-i-prefer-this-action-to-the-first-alternative-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m3-section-why-i-prefer-this-action-to-the-second-alternative-5" data-response-part-id="A2-template-section-a2-m3-section-why-i-prefer-this-action-to-the-second-alternative-5"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-template-section-a2-m3-section-why-i-prefer-this-action-to-the-second-alternative-5-label" for="learner-workspace-a2-a2-template-section-a2-m3-section-why-i-prefer-this-action-to-the-second-alternative-5">Why I prefer this action to the second alternative</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-template-section-a2-m3-section-why-i-prefer-this-action-to-the-second-alternative-5-desc">Identify the other option you have not selected. Explain a relevant advantage it may offer and why your chosen action is preferable under your priorities.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-template-section-a2-m3-section-why-i-prefer-this-action-to-the-second-alternative-5" name="learner-workspace-a2-a2-template-section-a2-m3-section-why-i-prefer-this-action-to-the-second-alternative-5" rows="6" aria-describedby="learner-workspace-a2-a2-template-section-a2-m3-section-why-i-prefer-this-action-to-the-second-alternative-5-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="6" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m3-section-benefits-sought-and-trade-offs-accepted-6" data-response-part-id="A2-template-section-a2-m3-section-benefits-sought-and-trade-offs-accepted-6"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-template-section-a2-m3-section-benefits-sought-and-trade-offs-accepted-6-label" for="learner-workspace-a2-a2-template-section-a2-m3-section-benefits-sought-and-trade-offs-accepted-6">Benefits sought and trade-offs accepted</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-template-section-a2-m3-section-benefits-sought-and-trade-offs-accepted-6-desc">Explain the main consequences you hope to achieve and the disadvantages, resource commitments or risks you are prepared to accept. Keep predictions distinct from established observations.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-template-section-a2-m3-section-benefits-sought-and-trade-offs-accepted-6" name="learner-workspace-a2-a2-template-section-a2-m3-section-benefits-sought-and-trade-offs-accepted-6" rows="6" aria-describedby="learner-workspace-a2-a2-template-section-a2-m3-section-benefits-sought-and-trade-offs-accepted-6-desc"></textarea></div></div></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a2" data-composition-moment="check" data-activity-id="A2" aria-labelledby="learner-check-a2-heading"><h3 class="util-composition-moment-heading" id="learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a2">Back to your task (Defend Your Provisional Decision)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Review your justification against the diagnostic criteria and revise any unsupported claims or incomplete comparisons. Preserve your own conclusion rather than attempting to match a model answer.</p></span></div><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m4-c-0" data-revision-criterion-id="a2-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you selected a clear action and supported it with accurately represented evidence?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A recommendation without a clear action or traceable evidential grounds is difficult to evaluate and may depend on claims the case does not support.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The recommendation explicitly identifies Option A, B or C.</li><li><span class="util-guided-review__feature-key">B.</span> The justification connects at least one directly inspectable evidence detail to a reason for the choice.</li><li><span class="util-guided-review__feature-key">C.</span> Claims remain within the limitations of the original evidence.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State one of the three established opening-hours policies as your provisional action.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify the relevant survey value, occupancy observation, access comment category or provisional cost information and explain how it bears on your recommendation.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Correct any population-wide survey claim, definitive demand forecast, unsupported prevalence statement or invented cost figure.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-0" data-checklist-item-id="checklist-a2-a2-m4-item-0"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m4-c-1" data-revision-criterion-id="a2-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you compared your recommendation with both rejected alternatives?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without explicit comparison, the argument may explain why a policy is attractive without showing why it is preferable to the available alternatives.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Both unselected options are named or unambiguously identified.</li><li><span class="util-guided-review__feature-key">B.</span> A relevant potential strength of each alternative is acknowledged.</li><li><span class="util-guided-review__feature-key">C.</span> The preference is explained through shared decision criteria rather than assertion alone.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify each of the two policies you rejected and discuss them separately.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify something each rejected option could reasonably offer before explaining why it receives less weight in your decision.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Compare the chosen and rejected options against the access, equity, resource or uncertainty criteria that guide your judgement.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-1" data-checklist-item-id="checklist-a2-a2-m4-item-1"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m4-c-2" data-revision-criterion-id="a2-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you made your priorities and accepted trade-offs transparent?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Different defensible policies can follow from different priorities; leaving those priorities implicit hides the reasoning behind the choice.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The criteria receiving greatest weight are explicitly identified.</li><li><span class="util-guided-review__feature-key">B.</span> The relative weighting of those criteria is justified.</li><li><span class="util-guided-review__feature-key">C.</span> The recommendation acknowledges a consequential disadvantage, commitment or risk.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the considerations you regard as most important in the library decision.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain why your leading considerations deserve greater importance than competing access or operational concerns.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify a meaningful cost, limitation or potential loss associated with your chosen policy and explain why you still consider it acceptable.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-2" data-checklist-item-id="checklist-a2-a2-m4-item-2"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m4-c-3" data-revision-criterion-id="a2-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Does your argument reach a defensible provisional judgement without claiming unsupported certainty?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A strong policy justification must support action while remaining open about evidence gaps and reasonable disagreement.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The conclusion follows from the stated evidence, priorities and comparison.</li><li><span class="util-guided-review__feature-key">B.</span> The argument distinguishes anticipated consequences from demonstrated outcomes.</li><li><span class="util-guided-review__feature-key">C.</span> Competing options are treated as plausible rather than inherently unreasonable.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Make the connection between your most important evidence, the criterion it affects and the resulting preference explicit.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Qualify statements about future demand, access benefits or operational effects that have not been established by the supplied evidence.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Replace unsupported dismissal of an alternative with an explanation of why its strengths receive less weight under your priorities.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-3" data-checklist-item-id="checklist-a2-a2-m4-item-3"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Qualify and Preserve Your Decision</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">You have selected an action and justified it through evidence, comparison and priorities. The remaining challenge is to test the limits of that reasoning. By examining consequential assumptions and calibrating confidence, you will turn your recommendation into a transparent provisional decision that can be reconsidered when circumstances or evidence change.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>A defensible decision does not require certainty. Before completing your recommendation, identify the assumptions on which it depends, explain what remains unresolved and judge how confident you can reasonably be. You will then preserve your original decision and justification for a later learning experience.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Evaluate the limits of your own argument. Distinguish established evidence from assumptions, consider how unresolved uncertainty affects the recommendation, and explain confidence as a judgement about the strength of reasoning rather than certainty of success. Communicate the conclusion without concealing relevant limitations.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which unresolved assumption would most affect your confidence if it proved incorrect, and why does your current evidence justify the confidence level you have stated?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A3"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A3-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Assumptions, Uncertainty and Confidence</span></p><h3 class="util-md-heading util-md-heading--source-2">What makes a decision provisional?</h3><p>A <strong>provisional decision</strong> is a reasoned choice made using the evidence currently available, with an acknowledgement that important questions remain unresolved. Provisional does not mean arbitrary or unjustified. It means the reasoning is open to reconsideration if relevant information changes.</p><h3 class="util-md-heading util-md-heading--source-3">Distinguish three elements of your reasoning</h3><p><strong>Observation:</strong> Something recorded or explicitly supplied in the case, such as a survey count or a description of previous library use.</p><p><strong>Inference:</strong> An interpretation or anticipated consequence drawn from an observation. An inference may be reasonable without being certain.</p><p><strong>Assumption:</strong> A condition your reasoning depends on but which the available evidence does not establish. An assumption becomes consequential when your preference or confidence would change materially if it proved incorrect.</p><p>For example, a decision about opening hours may depend on expectations about how students will use additional availability. The original survey, historical records and access comments offer relevant information, but they do not establish every future consequence. Provisional costs create further uncertainty about the resources different actions may require.</p><h3 class="util-md-heading util-md-heading--source-3">Calibrate confidence</h3><p>Confidence is not the same as certainty that a policy will succeed. It is your judgement about how strongly the available evidence and comparative reasoning support your selected action.</p><p>Confidence may be strengthened when the relevant evidence is consistent with the recommendation, the reasoning addresses both alternatives, and important trade-offs have been examined. It may be limited when the decision depends heavily on unverified assumptions, evidence that cannot be generalised confidently, or operational implications that remain provisional.</p><p>You may express confidence in words, such as a carefully qualified level, provided you explain what that level means in relation to your reasoning. There is no prescribed confidence level for any of the three options.</p><p>A transparent recommendation can therefore state a clear action, acknowledge uncertainty and identify the assumptions on which the decision depends. This makes the original reasoning available for meaningful reconsideration later.</p></article></div><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A3-M7" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Save Your Original Decision for c4</span></p><h3 class="util-md-heading util-md-heading--source-2">Retain your original decision record</h3><p>You have now produced your first explicit provisional recommendation for the university library decision. <strong>Keep an accessible copy of your original work</strong> so that you can return to it in <strong>c4</strong>.</p><p>Your retained record should include:</p><ul><li>The selected action: <strong>Option A, B or C</strong>.</li><li>Your supporting evidence and explanation of its significance.</li><li>Your comparison with both rejected alternatives.</li><li>The priorities that influenced your choice and the trade-offs you accepted.</li><li>Your consequential assumptions, unresolved uncertainties and stated degree of confidence.</li></ul><p>Save or copy your responses into a format you can access later, such as a personal document or accessible notes. Check that the full reasoning is included, not just the name of the selected option.</p><p><strong>Your responses are not transferred automatically between learning resources.</strong> In c4, you will be asked to revisit your own original action, reasons, assumptions and confidence. Preserve the original record rather than rewriting it retrospectively; this will allow you to examine how your reasoning develops.</p><h3 class="util-md-heading util-md-heading--source-3">Page learner-resource closure</h3><ul><li><strong>Evidence to comparison:</strong> Use original observations accurately, recognise their limitations and compare the consequences of all three available actions against shared criteria.</li><li><strong>Comparison to judgement:</strong> Make your priorities explicit, explain why one provisional action is preferable to both alternatives, and acknowledge the trade-offs you accept.</li><li><strong>Judgement under uncertainty:</strong> Distinguish evidence from assumptions, identify unresolved questions and express confidence in proportion to the strength of your reasoning.</li><li><strong>Retain your reasoning:</strong> Keep an accessible copy of the original recommendation, justification, assumptions and confidence so that you can reconsider it meaningfully in c4.</li></ul></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Revisit your provisional recommendation and identify the assumptions that most materially influence its justification.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A3-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated Evidence and Remaining Uncertainty</span></p><h3 class="util-md-heading util-md-heading--source-2">Original library decision: evidence reference</h3><p><strong>Fictional, simulated educational case.</strong> Use the unchanged evidence below to examine the assumptions and confidence associated with your own provisional recommendation. This is not a new decision scenario and contains no additional evidence.</p><h3 class="util-md-heading util-md-heading--source-3">Available options</h3><ul><li><strong>Option A:</strong> Maintain existing opening hours.</li><li><strong>Option B:</strong> Extend opening hours throughout the examination period.</li><li><strong>Option C:</strong> Introduce targeted extensions during periods of greatest anticipated demand.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Evidence unit 1: Voluntary survey</h3><ul><li>Approximate student population: <strong>12,000</strong>.</li><li>Voluntary survey respondents: <strong>240</strong>.</li><li>Respondents supporting extended hours: <strong>168</strong>, representing <strong>70% of respondents</strong>.</li><li>Self-selection limits generalisation to all students.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Evidence unit 2: Historical building access</h3><ul><li>Relatively low late-evening occupancy was recorded under previous opening arrangements.</li><li>These records do not establish future demand if opening hours change.</li><li>No additional occupancy figures or forecasts are supplied.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Evidence unit 3: Student access comments</h3><ul><li>Limited student comments identify unequal access to suitable study space.</li><li>The prevalence of these difficulties is not established.</li><li>No verbatim comments or further respondent information are supplied.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Evidence unit 4: Operational costs</h3><ul><li>Staffing, security and operational costs are relevant to the decision.</li><li>Cost information remains provisional.</li><li>No confirmed amounts or definitive cost rankings are supplied.</li></ul><p>Refer to these particulars when explaining what you know, what you infer, what you assume and how confident you can reasonably be.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain which important uncertainties remain unresolved and how they affect the strength of your reasoning. Refer to relevant limitations in the original evidence.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Qualify Your Original Recommendation</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>State your degree of confidence and justify it in relation to the supporting evidence, competing alternatives and unresolved assumptions.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M5" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Decision Briefing Workspace</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Use the diagnostic review to check the proportionality of your confidence and the transparency of your assumptions. Retain an accessible copy of your original selected action and complete justification, including its assumptions and confidence, for c4. Your responses will not be transferred automatically.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A completed qualification of the original provisional recommendation that identifies consequential assumptions, explains unresolved uncertainties and justifies a confidence level proportionate to the evidence and reasoning. A concise transfer briefing should communicate the same provisional judgement to a different audience without overstating its certainty or introducing unsupported information. The learner must retain an accessible original decision record containing the selected action, supporting evidence, comparison with alternatives, priorities, trade-offs, assumptions and confidence for later reconsideration in c4.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-consequential-assumptions-1" data-response-part-id="A3-template-section-a3-m3-section-consequential-assumptions-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m3-section-consequential-assumptions-1-label" for="learner-workspace-a3-a3-template-section-a3-m3-section-consequential-assumptions-1">Consequential assumptions</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m3-section-consequential-assumptions-1-desc">Identify the assumptions on which your selected action most depends. Explain why each matters to your preference.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m3-section-consequential-assumptions-1" name="learner-workspace-a3-a3-template-section-a3-m3-section-consequential-assumptions-1" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m3-section-consequential-assumptions-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m5-section-recommendation-for-the-colleague-1" data-response-part-id="A3-template-section-a3-m5-section-recommendation-for-the-colleague-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m5-section-recommendation-for-the-colleague-1-label" for="learner-workspace-a3-a3-template-section-a3-m5-section-recommendation-for-the-colleague-1">Recommendation for the colleague</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m5-section-recommendation-for-the-colleague-1-desc">State your selected library opening-hours option in a concise sentence.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m5-section-recommendation-for-the-colleague-1" name="learner-workspace-a3-a3-template-section-a3-m5-section-recommendation-for-the-colleague-1" rows="5" aria-describedby="learner-workspace-a3-a3-template-section-a3-m5-section-recommendation-for-the-colleague-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-unresolved-uncertainties-and-their-significance-2" data-response-part-id="A3-template-section-a3-m3-section-unresolved-uncertainties-and-their-significance-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m3-section-unresolved-uncertainties-and-their-significance-2-label" for="learner-workspace-a3-a3-template-section-a3-m3-section-unresolved-uncertainties-and-their-significance-2">Unresolved uncertainties and their significance</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m3-section-unresolved-uncertainties-and-their-significance-2-desc">Identify important gaps or limitations in the original evidence. Explain how they constrain the claims you can make about your chosen action.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m3-section-unresolved-uncertainties-and-their-significance-2" name="learner-workspace-a3-a3-template-section-a3-m3-section-unresolved-uncertainties-and-their-significance-2" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m3-section-unresolved-uncertainties-and-their-significance-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m5-section-strongest-evidence-based-reason-2" data-response-part-id="A3-template-section-a3-m5-section-strongest-evidence-based-reason-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m5-section-strongest-evidence-based-reason-2-label" for="learner-workspace-a3-a3-template-section-a3-m5-section-strongest-evidence-based-reason-2">Strongest evidence-based reason</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m5-section-strongest-evidence-based-reason-2-desc">Identify the most important supporting evidence and explain its significance without overstating what it establishes.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m5-section-strongest-evidence-based-reason-2" name="learner-workspace-a3-a3-template-section-a3-m5-section-strongest-evidence-based-reason-2" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m5-section-strongest-evidence-based-reason-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-my-degree-of-confidence-3" data-response-part-id="A3-template-section-a3-m3-section-my-degree-of-confidence-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m3-section-my-degree-of-confidence-3-label" for="learner-workspace-a3-a3-template-section-a3-m3-section-my-degree-of-confidence-3">My degree of confidence</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m3-section-my-degree-of-confidence-3-desc">State how confident you are in the provisional recommendation. Use a description that communicates your judgement clearly.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m3-section-my-degree-of-confidence-3" name="learner-workspace-a3-a3-template-section-a3-m3-section-my-degree-of-confidence-3" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m3-section-my-degree-of-confidence-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m5-section-important-trade-off-or-assumption-3" data-response-part-id="A3-template-section-a3-m5-section-important-trade-off-or-assumption-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m5-section-important-trade-off-or-assumption-3-label" for="learner-workspace-a3-a3-template-section-a3-m5-section-important-trade-off-or-assumption-3">Important trade-off or assumption</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m5-section-important-trade-off-or-assumption-3-desc">Acknowledge one consequential compromise or assumption that the colleague should understand when evaluating your decision.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m5-section-important-trade-off-or-assumption-3" name="learner-workspace-a3-a3-template-section-a3-m5-section-important-trade-off-or-assumption-3" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m5-section-important-trade-off-or-assumption-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-why-this-confidence-is-proportionate-4" data-response-part-id="A3-template-section-a3-m3-section-why-this-confidence-is-proportionate-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m3-section-why-this-confidence-is-proportionate-4-label" for="learner-workspace-a3-a3-template-section-a3-m3-section-why-this-confidence-is-proportionate-4">Why this confidence is proportionate</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m3-section-why-this-confidence-is-proportionate-4-desc">Connect your stated confidence to the quality of the evidence, the strength of your comparison and the importance of unresolved limitations.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m3-section-why-this-confidence-is-proportionate-4" name="learner-workspace-a3-a3-template-section-a3-m3-section-why-this-confidence-is-proportionate-4" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m3-section-why-this-confidence-is-proportionate-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m5-section-confidence-and-justification-4" data-response-part-id="A3-template-section-a3-m5-section-confidence-and-justification-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m5-section-confidence-and-justification-4-label" for="learner-workspace-a3-a3-template-section-a3-m5-section-confidence-and-justification-4">Confidence and justification</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m5-section-confidence-and-justification-4-desc">State your confidence and briefly explain why that level is warranted despite unresolved uncertainty.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m5-section-confidence-and-justification-4" name="learner-workspace-a3-a3-template-section-a3-m5-section-confidence-and-justification-4" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m5-section-confidence-and-justification-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-what-could-materially-change-my-confidence-5" data-response-part-id="A3-template-section-a3-m3-section-what-could-materially-change-my-confidence-5"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m3-section-what-could-materially-change-my-confidence-5-label" for="learner-workspace-a3-a3-template-section-a3-m3-section-what-could-materially-change-my-confidence-5">What could materially change my confidence</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m3-section-what-could-materially-change-my-confidence-5-desc">Identify an assumption or unresolved issue that would substantially affect your judgement if it turned out differently from what you currently expect.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m3-section-what-could-materially-change-my-confidence-5" name="learner-workspace-a3-a3-template-section-a3-m3-section-what-could-materially-change-my-confidence-5" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m3-section-what-could-materially-change-my-confidence-5-desc"></textarea></div></div></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a3" data-composition-moment="check" data-activity-id="A3" aria-labelledby="learner-check-a3-heading"><h3 class="util-composition-moment-heading" id="learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a3">Back to your task (Qualify and Preserve Your Decision)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M6" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m6" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m6-c-0" data-revision-criterion-id="a3-m6-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you distinguished consequential assumptions from established evidence?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Treating an assumption as an observed fact can conceal a weakness on which the recommendation materially depends.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> At least one assumption is identified as something not established by the original evidence.</li><li><span class="util-guided-review__feature-key">B.</span> The relationship between each consequential assumption and the recommendation is explained.</li><li><span class="util-guided-review__feature-key">C.</span> Observed survey, occupancy, access or cost information is not presented as proof of the assumption.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify a condition your preferred policy depends on and state explicitly that the available evidence does not confirm it.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain how the selected policy would become more or less defensible if the assumption proved incorrect.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Separate the recorded case particulars from the expectation or prediction you have drawn from them.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m6-item-0" data-checklist-item-id="checklist-a3-a3-m6-item-0"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m6-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m6-c-1" data-revision-criterion-id="a3-m6-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you explained how unresolved uncertainties affect the strength of your reasoning?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Listing unknowns without explaining their consequences does not show whether they matter to the recommendation.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Relevant limitations of the original evidence are identified accurately.</li><li><span class="util-guided-review__feature-key">B.</span> Each major uncertainty is connected to a claim or comparison it constrains.</li><li><span class="util-guided-review__feature-key">C.</span> The explanation does not introduce unsupported new evidence or numerical estimates.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Refer to the specific limitation that matters, such as voluntary survey participation, unknown future demand, limited access comments or provisional costs.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain which part of your recommendation becomes less certain because the information is incomplete.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Remove invented demand, prevalence or cost figures and state the uncertainty using the supplied particulars.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m6-item-1" data-checklist-item-id="checklist-a3-a3-m6-item-1"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m6-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m6-c-2" data-revision-criterion-id="a3-m6-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Is your stated confidence proportionate to the available evidence and the importance of its limitations?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confidence without an evidential rationale can make a provisional judgement sound either unjustifiably certain or arbitrarily hesitant.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> A recognisable degree of confidence is stated.</li><li><span class="util-guided-review__feature-key">B.</span> The confidence judgement refers to both supporting grounds and significant limitations.</li><li><span class="util-guided-review__feature-key">C.</span> A consequential development that could change confidence is identified.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Describe how strongly you currently support your selected action rather than leaving confidence implicit.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect your confidence to the strongest evidence-based reason for your choice and to an uncertainty that limits it.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Specify which unresolved assumption or evidence gap would materially affect your confidence if resolved differently.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m6-item-2" data-checklist-item-id="checklist-a3-a3-m6-item-2"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m6-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m6-c-3" data-revision-criterion-id="a3-m6-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Does your briefing communicate the same provisional judgement clearly to someone with different priorities?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A decision briefing must make its reasoning inspectable without assuming the audience already knows the case or shares the decision-maker&#39;s values.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The briefing identifies the same selected option as the original recommendation.</li><li><span class="util-guided-review__feature-key">B.</span> The strongest supporting reason is linked to original evidence and remains appropriately qualified.</li><li><span class="util-guided-review__feature-key">C.</span> The briefing acknowledges a meaningful trade-off or assumption and explains confidence.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Check that the option named in the briefing matches your original decision rather than introducing a revised choice.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Name the relevant original evidence detail and explain its significance without turning it into a population-wide claim or certain forecast.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Add the compromise or unverified condition a differently prioritising colleague should know, then connect your confidence level to that limitation.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m6-item-3" data-checklist-item-id="checklist-a3-a3-m6-item-3"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m6-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A3"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M4" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Brief a Colleague with Different Priorities</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910" data-response-part-id="A3-transfer-prompt-a3-m4-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910-label" for="learner-workspace-a3-a3-transfer-prompt-a3-m4-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910-desc"><p>A university colleague who has not participated in these learning activities asks you to explain your provisional library opening-hours decision. The colleague may place a different emphasis on student access and operational resources.</p><p>Write a <strong>concise decision briefing</strong> using your existing recommendation. Identify the selected option, its strongest evidence-based reason, one important trade-off or assumption, and your justified degree of confidence.</p><p>Your task is to communicate the reasoning clearly to someone who may not share your priorities. Do not invent new evidence, change the three available policies or assume the colleague will agree with your conclusion.</p><p>Complete the associated briefing workspace.</p></div><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910" name="learner-workspace-a3-a3-transfer-prompt-a3-m4-910" rows="5" aria-describedby="learner-workspace-a3-a3-transfer-prompt-a3-m4-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><aside class="util-study-tips" data-region="study-tips" id="journey-study-tips" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--study-tips" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0
