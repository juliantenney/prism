, access finding or revised cost comparison changes its relative case, even where the effect is limited.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-0" data-checklist-item-id="checklist-a2-a2-m4-item-0"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m4-c-1" data-revision-criterion-id="a2-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you used both chronological layers of evidence accurately?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Ignoring the original evidence or overstating the follow-up findings can distort the comparative balance between access, demand and cost.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The original survey, occupancy, access comments or provisional costs inform my comparison.</li><li><span class="util-guided-review__feature-key">B.</span> The concentrated occupancy pattern and revised cost comparison are described at their reported level of specificity.</li><li><span class="util-guided-review__feature-key">C.</span> My comparison distinguishes estimated expenditure from demonstrated or potential student need.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Bring the relevant original observations back into the option comparison instead of allowing the follow-up review to replace them.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Use the supplied qualitative findings without inventing dates, occupancy figures, cost amounts or demand projections.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Separate the revised relative cost estimate from the occupancy and access findings before explaining how they interact in the decision.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-1" data-checklist-item-id="checklist-a2-a2-m4-item-1"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m4-c-2" data-revision-criterion-id="a2-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you weighed meaningful trade-offs and evidential limitations?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A list of benefits without competing considerations cannot justify why one pattern of opening might be more proportionate than another.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> I address broader access alongside the operational commitments it may require.</li><li><span class="util-guided-review__feature-key">B.</span> I address targeted provision alongside uncertainty about identifying future high-demand dates.</li><li><span class="util-guided-review__feature-key">C.</span> I recognise that maintaining current hours may avoid additional expenditure while leaving some reported access concerns unresolved.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Explain how the scope of an extension affects both possible student access and staffing, security or other resource requirements.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain why historical concentration of use may inform targeting without guaranteeing which dates would attract demand under changed arrangements.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Include both the resource implications of retaining current hours and the relevance of the reported difficulty accessing alternative study space.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-2" data-checklist-item-id="checklist-a2-a2-m4-item-2"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m4-c-3" data-revision-criterion-id="a2-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Does your comparative conclusion follow proportionately from the evidence?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The conclusion should identify meaningful differences without turning limited observations into certainty about future demand or a predetermined preferred option.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> I identify which differences between the alternatives have become more consequential.</li><li><span class="util-guided-review__feature-key">B.</span> I explain why those differences matter to the university&#39;s decision.</li><li><span class="util-guided-review__feature-key">C.</span> I acknowledge an unresolved uncertainty that limits the comparative judgement.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the comparison that now carries greatest weight for you, such as breadth of access relative to operational commitment, and connect it to the reported evidence.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect the selected differences to the practical consequences of providing, restricting or timing late-evening access.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify a remaining unknown, such as future use under new hours, and state how it prevents a stronger conclusion.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-3" data-checklist-item-id="checklist-a2-a2-m4-item-3"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Defend Your Reconsidered Judgement</h2></header><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--activity-after-header" data-visual-slot="activity-after-header" data-learner-content-kind="image" data-figure-number="3" data-figure-id="asset-vb-38-4-va-a3-choice-confidence-01-activity-a3-activity-after-header"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c4/activity-a3-activity-after-header.png" alt="Contrast between preferred recommendation and confidence in that recommendation; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-a3-choice-confidence-01-activity-a3-activity-after-header" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption" id="figure-description-asset-vb-38-4-va-a3-choice-confidence-01-activity-a3-activity-after-header"><strong>Figure 3.</strong> The figure distinguishes two questions. The first asks which library opening-hours option is currently preferred after considering the combined evidence. The second asks how strongly the evidence supports that preference. Their relationship is conditional rather than automatic: an unchanged option may be accompanied by higher or lower confidence, while a revised option may still involve substantial uncertainty. No option or confidence level is selected for the learner.</figcaption></figure><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your initial analysis established which assumptions were affected, and your comparison considered the implications for all three options. This activity brings those strands together into an accountable judgement. You must now decide how much change, if any, the evidence warrants and explain why your response is neither an automatic defence of your original position nor an overreaction to recent findings.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You now have an analysis of how the new findings affect your earlier reasoning and a comparison of the three options. Decide whether your original recommendation should be maintained, qualified or revised. Any of these responses can be justified. What matters is whether your conclusion and confidence are proportionate to the combined evidence.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Treat the reconsidered recommendation and confidence judgement as related but distinct decisions. A preferred option may remain unchanged while confidence increases or decreases. Evaluate supporting and challenging evidence before deciding whether maintenance, qualification or revision is warranted.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">If another learner reached a different recommendation using the same evidence, what would make their reasoning defensible, and what distinguishes your own judgement?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A3"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A3-M3" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Diagnostic Feedback: Consistency Without Rigidity</span></p><h3 class="util-md-heading util-md-heading--source-2">Review how you reconsidered</h3><p><strong>If your conclusion largely repeats your c3 justification:</strong> Check whether you have explicitly addressed findings that could challenge it. An unchanged recommendation can be defensible, but simply restating the original reasons may indicate <strong>confirmation bias</strong>: giving preferential attention to evidence that supports an existing position while discounting contrary information. Identify the strongest relevant new challenge and explain why it does or does not change the balance.</p><p><strong>If you changed your recommendation as soon as you saw the follow-up findings:</strong> Check whether the new evidence warrants the strength of your conclusion. <strong>Overreaction</strong> occurs when recent findings are treated as more decisive than their limitations permit. Historical concentration of use, reports from a particular group of users and revised comparative costs can inform a decision without proving what will happen under new arrangements.</p><p><strong>If you considered only evidence supporting your final preference:</strong> Return to the three-option comparison. Explain a credible reason someone might favour another option and identify the trade-off that leads you to weigh the evidence differently. The point is not to make every option appear equally persuasive, but to test whether your preference survives a fair comparison.</p><p><strong>If you are uncertain how to express confidence:</strong> Separate your choice from your certainty. You might judge one option preferable while remaining uncertain about future use. Alternatively, new evidence may clarify a particular trade-off without changing your selected option. State what has become better supported and what remains unresolved.</p><p>Maintaining, qualifying and revising are all legitimate responses when they follow from balanced reasoning. A proportionate judgement is neither an automatic defence of the first decision nor an automatic reversal.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Justify the decision by referring explicitly to your original reasoning, at least two consequential findings and the comparative trade-offs between the alternatives.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M2" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">My Reconsidered Recommendation</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain whether your confidence in the recommendation has increased, decreased or remained broadly unchanged, and why.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A3-M1" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Decision Record for Reconsideration</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-2">Reconsider the provisional recommendation</h3><p><strong>Simulated evidence — fictional university scenario</strong></p><p>Your task is to reconsider the actual recommendation you retained from c3. You may <strong>maintain</strong>, <strong>qualify</strong> or <strong>revise</strong> it. The evidence does not prescribe which response is appropriate.</p><h3 class="util-md-heading util-md-heading--source-3">Available alternatives</h3><ul><li><strong>Option A:</strong> Maintain the existing library opening hours.</li><li><strong>Option B:</strong> Extend opening hours throughout the examination period.</li><li><strong>Option C:</strong> Introduce targeted extensions on dates when demand is anticipated to be greatest.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Original evidence</h3><ol><li><strong>Student survey:</strong> A voluntary survey received <strong>240 responses</strong> from approximately <strong>12,000 students</strong>. <strong>168 respondents</strong> supported extended hours. Self-selection may limit representativeness.</li><li><strong>Historical occupancy:</strong> Building-access records showed relatively low late-evening occupancy under previous arrangements. Those records do not establish demand under substantially extended hours.</li><li><strong>Student experience:</strong> A limited number of comments raised concerns about unequal access to suitable study space.</li><li><strong>Operational planning:</strong> Provisional staffing, security and other operational costs were identified for extended opening.</li></ol><h3 class="util-md-heading util-md-heading--source-3">Later evidence</h3><ol><li><strong>Timing of demand:</strong> During the previous examination period, late-evening occupancy was concentrated on particular high-demand dates.</li><li><strong>Access difficulty:</strong> Late-evening users disproportionately reported difficulty finding suitable study space elsewhere.</li><li><strong>Revised costs:</strong> Targeted extensions were estimated to cost materially less than extending hours throughout the examination period.</li></ol><h3 class="util-md-heading util-md-heading--source-3">Limits on interpretation</h3><p>The historical records cannot establish future demand under a substantial extension. The access finding concerns the reported experiences of late-evening users, not a representative estimate of all students&#39; circumstances. The revised cost estimate compares approaches but does not establish their eventual use or educational impact.</p><h3 class="util-md-heading util-md-heading--source-3">Decision to produce</h3><p>Use your original c3 response and the comparison you completed in A2. Explain whether the combined evidence warrants maintaining your recommendation, qualifying its scope or conditions, or revising it to another option. Then explain whether your <strong>confidence</strong> has increased, decreased or remained broadly unchanged.</p><p>A recommendation can remain the same while its justification or confidence changes. Equally, a revised recommendation can remain uncertain. Neither changing your mind nor refusing to change it is inherently evidence-responsive.</p></article></li></ol></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A coherent reconsidered recommendation explicitly connected to the learner&#39;s retained c3 decision. The response identifies whether the original recommendation is maintained, qualified or revised; explains the resulting preferred option through balanced consideration of original and later evidence; addresses relevant trade-offs and limitations; and provides a calibrated confidence judgement. It demonstrates proportionate reconsideration by acknowledging evidence that could challenge the preferred option without giving recent findings unjustified authority. No particular option or change of mind is required for success.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-original-c3-recommendation-1" data-response-part-id="A3-template-section-a3-m2-section-original-c3-recommendation-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m2-section-original-c3-recommendation-1-label" for="learner-workspace-a3-a3-template-section-a3-m2-section-original-c3-recommendation-1">Original c3 recommendation</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m2-section-original-c3-recommendation-1-desc">[State your original option and the main consideration that led you to recommend it.]</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m2-section-original-c3-recommendation-1" name="learner-workspace-a3-a3-template-section-a3-m2-section-original-c3-recommendation-1" rows="5" aria-describedby="learner-workspace-a3-a3-template-section-a3-m2-section-original-c3-recommendation-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-maintain-qualify-or-revise-2" data-response-part-id="A3-template-section-a3-m2-section-maintain-qualify-or-revise-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m2-section-maintain-qualify-or-revise-2-label" for="learner-workspace-a3-a3-template-section-a3-m2-section-maintain-qualify-or-revise-2">Maintain, qualify or revise</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m2-section-maintain-qualify-or-revise-2-desc">[State which response is warranted. If you qualify your recommendation, identify what is now conditional or less certain. If you revise it, identify what changed in the comparative balance. If you maintain it, explain why the new evidence does not outweigh your original grounds.]</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m2-section-maintain-qualify-or-revise-2" name="learner-workspace-a3-a3-template-section-a3-m2-section-maintain-qualify-or-revise-2" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m2-section-maintain-qualify-or-revise-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-resulting-preferred-option-3" data-response-part-id="A3-template-section-a3-m2-section-resulting-preferred-option-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m2-section-resulting-preferred-option-3-label" for="learner-workspace-a3-a3-template-section-a3-m2-section-resulting-preferred-option-3">Resulting preferred option</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m2-section-resulting-preferred-option-3-desc">[Identify Option A, B or C. Any option may be defended if the reasoning is proportionate to the evidence.]</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m2-section-resulting-preferred-option-3" name="learner-workspace-a3-a3-template-section-a3-m2-section-resulting-preferred-option-3" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m2-section-resulting-preferred-option-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-evidence-based-justification-4" data-response-part-id="A3-template-section-a3-m2-section-evidence-based-justification-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m2-section-evidence-based-justification-4-label" for="learner-workspace-a3-a3-template-section-a3-m2-section-evidence-based-justification-4">Evidence-based justification</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m2-section-evidence-based-justification-4-desc">[Write a connected explanation integrating your earlier reasoning with at least two consequential findings. Explain how the survey, occupancy records, access concerns and cost evidence bear on the scope and timing of library provision. Distinguish observed patterns from predictions about future use.]</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m2-section-evidence-based-justification-4" name="learner-workspace-a3-a3-template-section-a3-m2-section-evidence-based-justification-4" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m2-section-evidence-based-justification-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-competing-evidence-and-trade-offs-5" data-response-part-id="A3-template-section-a3-m2-section-competing-evidence-and-trade-offs-5"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m2-section-competing-evidence-and-trade-offs-5-label" for="learner-workspace-a3-a3-template-section-a3-m2-section-competing-evidence-and-trade-offs-5">Competing evidence and trade-offs</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m2-section-competing-evidence-and-trade-offs-5-desc">[Identify the strongest relevant consideration against your resulting preference. Weigh student access needs against operational commitments, breadth of provision against concentrated historical use, and the comparative cost of targeted provision against unresolved demand uncertainty where relevant. Explain why your preferred option remains defensible despite those tensions.]</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m2-section-competing-evidence-and-trade-offs-5" name="learner-workspace-a3-a3-template-section-a3-m2-section-competing-evidence-and-trade-offs-5" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m2-section-competing-evidence-and-trade-offs-5-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="6" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-confidence-change-and-explanation-6" data-response-part-id="A3-template-section-a3-m2-section-confidence-change-and-explanation-6"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m2-section-confidence-change-and-explanation-6-label" for="learner-workspace-a3-a3-template-section-a3-m2-section-confidence-change-and-explanation-6">Confidence change and explanation</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m2-section-confidence-change-and-explanation-6-desc">[State whether your confidence has increased, decreased or remained broadly unchanged since c3. Explain which evidence affects confidence and what remains unknown. Confidence need not change in the same direction as the preferred option.]</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m2-section-confidence-change-and-explanation-6" name="learner-workspace-a3-a3-template-section-a3-m2-section-confidence-change-and-explanation-6" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m2-section-confidence-change-and-explanation-6-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="7" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-refined-justification-7" data-response-part-id="A3-template-section-a3-m2-section-refined-justification-7"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m2-section-refined-justification-7-label" for="learner-workspace-a3-a3-template-section-a3-m2-section-refined-justification-7">Refined justification</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m2-section-refined-justification-7-desc">[After using the diagnostic feedback and checklist, write a concise final version of your judgement. Retain the strongest supporting and challenging evidence, the decisive trade-off, and an appropriately qualified confidence statement.]</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m2-section-refined-justification-7" name="learner-workspace-a3-a3-template-section-a3-m2-section-refined-justification-7" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m2-section-refined-justification-7-desc"></textarea></div></div></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a3" data-composition-moment="check" data-activity-id="A3" aria-labelledby="learner-check-a3-heading"><h3 class="util-composition-moment-heading" id="learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a3">Back to your task (Defend Your Reconsidered Judgement)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>State whether you will maintain, qualify or revise your original c3 recommendation, and identify your resulting preferred option.</p></span></div><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m4-c-0" data-revision-criterion-id="a3-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Does your reconsidered recommendation follow explicitly from your actual c3 decision?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without continuity between the original and reconsidered positions, the response becomes a new recommendation rather than an accountable reconsideration.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> I identify my actual original option and its principal justification.</li><li><span class="util-guided-review__feature-key">B.</span> I state whether I maintain, qualify or revise that position.</li><li><span class="util-guided-review__feature-key">C.</span> I explain why the original-to-current relationship is warranted by the evidence.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Consult the retained c3 response and restore the option and reasoning you recorded before the follow-up evidence was available.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Name the type of reconsideration and specify whether the preferred option, the conditions attached to it, or only the strength of its justification has changed.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify the original assumption or trade-off whose significance has changed or remained stable, and connect it to the resulting judgement.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m4-item-0" data-checklist-item-id="checklist-a3-a3-m4-item-0"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m4-c-1" data-revision-criterion-id="a3-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you integrated supporting and challenging evidence rather than selecting only favourable findings?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Selective treatment of evidence can conceal weaknesses in a recommendation and create unjustified confidence.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> I use relevant original and later findings in the justification.</li><li><span class="util-guided-review__feature-key">B.</span> I identify evidence or an interpretation that could challenge my resulting preference.</li><li><span class="util-guided-review__feature-key">C.</span> I respond to the challenge without dismissing it or treating it as automatically decisive.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Connect at least two consequential later findings to the survey, occupancy, access or cost considerations that shaped your earlier reasoning.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Select the strongest relevant counter-consideration from the three-option comparison and explain its potential effect on your recommendation.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain why the counter-consideration changes, qualifies or does not outweigh your other grounds, acknowledging its evidential limits.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m4-item-1" data-checklist-item-id="checklist-a3-a3-m4-item-1"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m4-c-2" data-revision-criterion-id="a3-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you weighed comparative trade-offs without claiming more than the evidence supports?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The decision concerns the proportionality of different opening arrangements, not simply whether an isolated finding is favourable.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> I compare the preferred option with a credible alternative.</li><li><span class="util-guided-review__feature-key">B.</span> I consider access needs alongside staffing, security or other operational commitments.</li><li><span class="util-guided-review__feature-key">C.</span> I preserve uncertainty about demand under changed opening hours.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify an alternative that could address a relevant access or operational concern and explain the difference that matters to your choice.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain how the scope or timing of extended provision affects both potential access and resource requirements.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Qualify any claim that historical occupancy establishes future use; distinguish an observed past pattern from an untested forecast.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m4-item-2" data-checklist-item-id="checklist-a3-a3-m4-item-2"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m4-c-3" data-revision-criterion-id="a3-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Is your confidence judgement proportionate and protected against confirmation bias or overreaction?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A defensible option choice can still be poorly justified if confidence ignores unresolved uncertainty or gives recent evidence excessive weight.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> I state how confidence has changed or remained stable and why.</li><li><span class="util-guided-review__feature-key">B.</span> I acknowledge a consequential unknown that could affect the decision.</li><li><span class="util-guided-review__feature-key">C.</span> I have tested both the temptation to defend my original view and the temptation to privilege recent findings.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify which findings increase or reduce support for your recommendation and connect them explicitly to your confidence statement.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Name a specific unresolved issue, such as future demand under new hours, and explain how it limits certainty.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Reconsider one challenging finding you might have discounted and one recent finding you might have overstated, then adjust your justification if either received disproportionate weight.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m4-item-3" data-checklist-item-id="checklist-a3-a3-m4-item-3"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A4" data-journey-section="true" data-activity-id="A4" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Define Conditions for Future Revision</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A4"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">You have defended a reconsidered recommendation and calibrated your confidence using the combined evidence. The final step makes that judgement explicitly conditional: it identifies what remains unresolved and what would justify reconsideration in future. Applying the same principle to a less familiar institutional decision prepares you to exercise independent evidence-responsive judgement in c5.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>A justified recommendation can remain provisional. Consider what is still uncertain, what additional evidence would matter, and how a future finding could affect your confidence or preferred course of action. Apply the same reasoning beyond the immediate library decision.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Identify uncertainties that could materially affect the recommendation rather than listing information that would merely be interesting. Connect each evidence need to a possible implication for future confidence or choice. In the transfer context, apply the same relationship between provisional judgement, consequential evidence and proportionate reconsideration without requiring certainty.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">What would need to become known for you to reconsider your recommendation again, and why would that information be consequential rather than merely additional?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A4"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--example" data-composition-role="example"><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A4-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated Transfer Case: Academic Support Sessions</span></p><h3 class="util-md-heading util-md-heading--source-2">A different university decision</h3><p><strong>Simulated evidence — fictional transfer scenario</strong></p><p>A university department is considering whether to provide additional <strong>staffed academic support sessions</strong> during a concentrated assessment period. Staff time and room availability are limited, and the department must decide how much additional support to offer.</p><p>Three alternatives are available:</p><ul><li><strong>Option 1 — Retain current provision:</strong> Continue the existing schedule of staffed support sessions.</li><li><strong>Option 2 — Extend throughout the assessment period:</strong> Offer additional staffed sessions across the full assessment period.</li><li><strong>Option 3 — Target anticipated high-demand times:</strong> Offer additional staffed sessions at selected times when demand is expected to be greatest.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Original decision context</h3><p>Initial indications of demand were limited. Existing session-use records did not indicate consistently high attendance, and extending staffed provision would require additional staff and room resources.</p><p><strong>Provisional recommendation recorded by the department:</strong> Retain current provision for the time being.</p><p><strong>Original justification:</strong> The limited evidence of sustained demand did not clearly establish that the additional resources required for extended sessions would be warranted.</p><h3 class="util-md-heading util-md-heading--source-3">Later development</h3><p>After that recommendation, a closer review of previous assessment-period records found that <strong>use of staffed support sessions had been concentrated on particular dates</strong> rather than spread evenly across the period.</p><p>An updated operational comparison also found that <strong>targeted additional sessions would require fewer staff and room resources than extending sessions throughout the whole period</strong>.</p><h3 class="util-md-heading util-md-heading--source-3">What remains unknown</h3><p>These findings describe previous use and comparative resource requirements. They do not establish how many students would attend if the department offered additional sessions or whether demand would occur at the same times in a future assessment period.</p><p>This case is separate from the library decision. Use it to test whether you can apply the same approach to a new provisional judgement without assuming that the new evidence determines a single correct outcome.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a4" data-composition-moment="do" data-activity-id="A4" aria-labelledby="learner-task-a4-heading"><h3 class="util-composition-moment-heading" id="learner-task-a4-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a4" hidden data-revision-reminder="true" data-activity-id="A4" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a4" hidden data-revision-guidance="true" data-activity-id="A4" aria-labelledby="learner-revision-guidance-a4-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a4-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify one consequential uncertainty that remains after your reconsidered library recommendation.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Future Evidence and Transfer Workspace</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Specify further evidence that could address that uncertainty and explain how a plausible finding could affect your recommendation or confidence.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Produce a concise final statement explaining what makes a decision responsive to evidence without making it unstable.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A concise account identifying a consequential unresolved uncertainty in the library decision, a relevant additional evidence need and a plausible condition for future revision or confidence adjustment. The transfer response applies the same reasoning to a distinct institutional context, distinguishing what later information establishes from what remains uncertain and defending a proportionate response. The final statement expresses the principle of evidence-responsive judgement without equating change with success or requiring all uncertainty to be resolved.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-consequential-library-uncertainty-1" data-response-part-id="A4-template-section-a4-m3-section-consequential-library-uncertainty-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a4-a4-template-section-a4-m3-section-consequential-library-uncertainty-1-label" for="learner-workspace-a4-a4-template-section-a4-m3-section-consequential-library-uncertainty-1">Consequential library uncertainty</label><p class="util-learner-workspace__prompt" id="learner-workspace-a4-a4-template-section-a4-m3-section-consequential-library-uncertainty-1-desc">[Identify one unresolved question that could affect your library recommendation or confidence. Explain why it matters to the choice between the options.]</p><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-template-section-a4-m3-section-consequential-library-uncertainty-1" name="learner-workspace-a4-a4-template-section-a4-m3-section-consequential-library-uncertainty-1" rows="6" aria-describedby="learner-workspace-a4-a4-template-section-a4-m3-section-consequential-library-uncertainty-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-further-evidence-needed-2" data-response-part-id="A4-template-section-a4-m3-section-further-evidence-needed-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a4-a4-template-section-a4-m3-section-further-evidence-needed-2-label" for="learner-workspace-a4-a4-template-section-a4-m3-section-further-evidence-needed-2">Further evidence needed</label><p class="util-learner-workspace__prompt" id="learner-workspace-a4-a4-template-section-a4-m3-section-further-evidence-needed-2-desc">[Specify a realistic observation, comparison or other source of information that could help address that uncertainty. Explain what it would need to establish.]</p><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-template-section-a4-m3-section-further-evidence-needed-2" name="learner-workspace-a4-a4-template-section-a4-m3-section-further-evidence-needed-2" rows="6" aria-describedby="learner-workspace-a4-a4-template-section-a4-m3-section-further-evidence-needed-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-possible-effect-on-recommendation-or-confidence-3" data-response-part-id="A4-template-section-a4-m3-section-possible-effect-on-recommendation-or-confidence-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a4-a4-template-section-a4-m3-section-possible-effect-on-recommendation-or-confidence-3-label" for="learner-workspace-a4-a4-template-section-a4-m3-section-possible-effect-on-recommendation-or-confidence-3">Possible effect on recommendation or confidence</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="learner-workspace-a4-a4-template-section-a4-m3-section-possible-effect-on-recommendation-or-confidence-3-desc"><p>[Describe a plausible finding and explain how it could justify maintaining, qualifying or revising your recommendation, or changing your confidence. Do not assume the finding has already occurred.]</p><h3 class="util-md-heading util-md-heading--source-2">Apply the reasoning to the transfer case</h3></div><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-template-section-a4-m3-section-possible-effect-on-recommendation-or-confidence-3" name="learner-workspace-a4-a4-template-section-a4-m3-section-possible-effect-on-recommendation-or-confidence-3" rows="5" aria-describedby="learner-workspace-a4-a4-template-section-a4-m3-section-possible-effect-on-recommendation-or-confidence-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-transfer-scenario-provisional-judgement-4" data-response-part-id="A4-template-section-a4-m3-section-transfer-scenario-provisional-judgement-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a4-a4-template-section-a4-m3-section-transfer-scenario-provisional-judgement-4-label" for="learner-workspace-a4-a4-template-section-a4-m3-section-transfer-scenario-provisional-judgement-4">Transfer scenario provisional judgement</label><p class="util-learner-workspace__prompt" id="learner-workspace-a4-a4-template-section-a4-m3-section-transfer-scenario-provisional-judgement-4-desc">[Identify the original recommendation and its stated justification in the academic support case.]</p><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-template-section-a4-m3-section-transfer-scenario-provisional-judgement-4" name="learner-workspace-a4-a4-template-section-a4-m3-section-transfer-scenario-provisional-judgement-4" rows="5" aria-describedby="learner-workspace-a4-a4-template-section-a4-m3-section-transfer-scenario-provisional-judgement-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-significance-and-limitation-of-later-information-5" data-response-part-id="A4-template-section-a4-m3-section-significance-and-limitation-of-later-information-5"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a4-a4-template-section-a4-m3-section-significance-and-limitation-of-later-information-5-label" for="learner-workspace-a4-a4-template-section-a4-m3-section-significance-and-limitation-of-later-information-5">Significance and limitation of later information</label><p class="util-learner-workspace__prompt" id="learner-workspace-a4-a4-template-section-a4-m3-section-significance-and-limitation-of-later-information-5-desc">[Explain which part of that justification the later evidence affects. Distinguish observed past use and comparative resource requirements from predictions about future attendance.]</p><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-template-section-a4-m3-section-significance-and-limitation-of-later-information-5" name="learner-workspace-a4-a4-template-section-a4-m3-section-significance-and-limitation-of-later-information-5" rows="6" aria-describedby="learner-workspace-a4-a4-template-section-a4-m3-section-significance-and-limitation-of-later-information-5-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="6" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-transfer-reconsideration-and-confidence-6" data-response-part-id="A4-template-section-a4-m3-section-transfer-reconsideration-and-confidence-6"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a4-a4-template-section-a4-m3-section-transfer-reconsideration-and-confidence-6-label" for="learner-workspace-a4-a4-template-section-a4-m3-section-transfer-reconsideration-and-confidence-6">Transfer reconsideration and confidence</label><p class="util-learner-workspace__prompt" id="learner-workspace-a4-a4-template-section-a4-m3-section-transfer-reconsideration-and-confidence-6-desc">[Defend maintenance, qualification or revision of the provisional recommendation. Identify the resulting preferred option, weigh a credible alternative, and state your confidence with a reason.]</p><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-template-section-a4-m3-section-transfer-reconsideration-and-confidence-6" name="learner-workspace-a4-a4-template-section-a4-m3-section-transfer-reconsideration-and-confidence-6" rows="5" aria-describedby="learner-workspace-a4-a4-template-section-a4-m3-section-transfer-reconsideration-and-confidence-6-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="7" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-principle-of-evidence-responsive-judgement-7" data-response-part-id="A4-template-section-a4-m3-section-principle-of-evidence-responsive-judgement-7"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a4-a4-template-section-a4-m3-section-principle-of-evidence-responsive-judgement-7-label" for="learner-workspace-a4-a4-template-section-a4-m3-section-principle-of-evidence-responsive-judgement-7">Principle of evidence-responsive judgement</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="learner-workspace-a4-a4-template-section-a4-m3-section-principle-of-evidence-responsive-judgement-7-desc"><p>[In one or two sentences, explain how a decision-maker can remain open to consequential evidence without changing position whenever new information appears.]</p><h3 class="util-md-heading util-md-heading--source-3">Page learner-resource closure</h3><ul><li><strong>Start with the decision actually made.</strong> Revisit its evidence, assumptions and uncertainties before judging the significance of later information.</li><li><strong>Separate observation from inference.</strong> Historical use, reported access difficulties and revised cost estimates can change the balance of reasons without establishing future demand.</li><li><strong>Reconsider proportionately.</strong> Maintaining, qualifying and revising are all defensible when supported by a fair comparison of evidence, trade-offs and limitations; confidence may change independently of the preferred option.</li><li><strong>Make judgements revisable for a reason.</strong> Identify the consequential uncertainty, the further evidence that could address it, and how a plausible finding might affect the decision.</li></ul></div><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-template-section-a4-m3-section-principle-of-evidence-responsive-judgement-7" name="learner-workspace-a4-a4-template-section-a4-m3-section-principle-of-evidence-responsive-judgement-7" rows="5" aria-describedby="learner-workspace-a4-a4-template-section-a4-m3-section-principle-of-evidence-responsive-judgement-7-desc"></textarea></div></div></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a4" data-composition-moment="check" data-activity-id="A4" aria-labelledby="learner-check-a4-heading"><h3 class="util-composition-moment-heading" id="learner-check-a4-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a4">Back to your task (Define Conditions for Future Revision)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A4-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a4-a4-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a4-m4-c-0" data-revision-criterion-id="a4-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you identified a consequential uncertainty in the library decision rather than an incidental information gap?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Only uncertainties that could affect the comparative case for an option help establish meaningful conditions for future reconsideration.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My uncertainty concerns an issue that could affect the preferred library arrangement.</li><li><span class="util-guided-review__feature-key">B.</span> I explain why resolving the uncertainty could matter to the choice or my confidence.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify an unresolved question about demand, access or operational feasibility and explain which aspect of your recommendation depends on it.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect the unknown to a specific difference between the options or to the strength of the evidence supporting your preference.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a4-a4-m4-item-0" data-checklist-item-id="checklist-a4-a4-m4-item-0"><label class="util-interactive-checklist__label" for="checklist-a4-a4-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a4-m4-c-1" data-revision-criterion-id="a4-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you specified further evidence and explained how a plausible finding could affect your judgement?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A request for more information becomes decision-relevant only when the information could alter the reasoning or confidence supporting the recommendation.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> I identify an evidence source or observation capable of addressing the selected uncertainty.</li><li><span class="util-guided-review__feature-key">B.</span> I connect a plausible future finding to a possible decision implication.</li><li><span class="util-guided-review__feature-key">C.</span> I distinguish evidence not yet collected from evidence already reported.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Specify what would need to be observed or compared, such as actual use under a changed opening arrangement, rather than asking generally for more research.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Describe a conditional outcome and explain why it would strengthen, weaken or refine the case for your current option.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Present the proposed finding as a possibility, not as an observed result, and keep it separate from the original and follow-up records.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a4-a4-m4-item-1" data-checklist-item-id="checklist-a4-a4-m4-item-1"><label class="util-interactive-checklist__label" for="checklist-a4-a4-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a4-m4-c-2" data-revision-criterion-id="a4-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you applied the reasoning independently and proportionately to the academic support scenario?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Transfer is demonstrated by using the same reasoning process in a different institutional decision, not by copying the library conclusion.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> I identify the academic support case&#39;s actual provisional recommendation and its original grounds.</li><li><span class="util-guided-review__feature-key">B.</span> I connect the later findings to the original justification while preserving their limitations.</li><li><span class="util-guided-review__feature-key">C.</span> I defend maintenance, qualification or revision by weighing a competing provision option.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State the department&#39;s initial provision choice and explain how limited indications of demand and resource constraints informed it.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain the relevance of concentrated historical use and the resource comparison, then distinguish them from unsupported claims about future attendance.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify an alternative approach and explain the access or resource trade-off that supports your resulting preference without treating the later findings as conclusive.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a4-a4-m4-item-2" data-checklist-item-id="checklist-a4-a4-m4-item-2"><label class="util-interactive-checklist__label" for="checklist-a4-a4-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a4-m4-c-3" data-revision-criterion-id="a4-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><
