view" aria-current="page">Overview</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c1">Why the constraint matters</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c2">Seeing gradients and tangency</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c3">From geometry to the multiplier equations</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c4">What does the calculation prove?</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c5">Diagnosing mathematical claims</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c6">Independent constrained optimisation</button></li></ol></nav></div></div></aside><div class="lj-shell__workspace"><div id="lj-shell-live" class="lj-shell__live" aria-live="polite" aria-atomic="true"></div><main id="lj-shell-main" class="lj-shell__main" data-lj-role="active-resource" aria-label="Learning content" tabindex="-1"></main></div></div><div class="lj-shell__templates" hidden aria-hidden="true"><template id="lj-resource-overview"><article class="lj-shell-overview" data-lj-overview="true" role="region" aria-labelledby="lj-shell-overview-heading"><h2 id="lj-shell-overview-heading" class="lj-shell-overview__title" data-lj-resource-title="true" tabindex="-1">Overview</h2><div class="util-editorial-opening" data-region="editorial-opening"><figure class="util-visual-asset util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-figure-number="1"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/editorial-opening.png" alt="" loading="lazy" decoding="async" /></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> Understanding Lagrange Multipliers — editorial_opening.</figcaption></figure></div><div class="lj-shell-overview__body"><p>How do you find the best possible outcome when your choices are restricted?</p><p>You may already know how to differentiate a function and find stationary points. But a constrained optimisation problem is different: the best permissible solution need not be a stationary point of the unrestricted function.</p><p>In this journey, you will discover why Lagrange multipliers work, what their equations mean geometrically and how to use them to solve problems accurately.</p><p>You will begin with a familiar problem, investigate gradients and tangency, connect the geometry to the formal equations, and learn to distinguish candidate solutions from justified optima. Finally, you will apply your understanding independently in a new context.</p><p><strong>What you will learn to do</strong></p><ul><li>Identify an objective function, a constraint and the feasible choices.</li><li>Explain how gradients and tangency relate to constrained optima.</li><li>Construct and solve Lagrange multiplier equations.</li><li>Recognise limitations, common errors and unsupported conclusions.</li><li>Apply the method independently and justify your answer.</li></ul><p><strong>Study time:</strong> Approximately 90 minutes, available to complete over one week. You can spread the experiences across several study sessions. The journey assumes familiarity with partial differentiation and basic functions of two variables, but no previous knowledge of Lagrange multipliers.</p><p>Make your predictions before viewing explanations, attempt the mathematical reasoning yourself and use feedback to revisit earlier ideas. The aim is not simply to remember a procedure, but to understand when and why it works.</p></div></article></template><template id="lj-resource-c1"><article class="util-learner-page util-page util-learner-renderer-vnext" data-renderer="vnext" data-page-kind="interactive" data-persistence-page-key="v1::25416221-1206-4b10-83c1-4697623229b7::learner-page::2.0.0::a1-a2-a3::understanding-constraints-in-optimisation" data-persistence-storage-key="learner-renderer-vnext:draft:v1::25416221-1206-4b10-83c1-4697623229b7::learner-page::2.0.0::a1-a2-a3::understanding-constraints-in-optimisation" data-composition-mode="moments" data-composed-activity-count="3" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Why the constraint matters</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="5"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="lj-c1--util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 5"><span class="util-journey-position__visible" aria-hidden="true">1 of 5</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c1--activity-A1" aria-label="Next section: Predict and define the rectangle"><span class="util-journey-adjacent__title">Predict and define the rectangle</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="lj-c1--util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c1--journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#lj-c1--activity-A1">Predict and define the rectangle</a></li><li><a class="util-journey-all-link" href="#lj-c1--activity-A2">Test which rectangles are feasible</a></li><li><a class="util-journey-all-link" href="#lj-c1--activity-A3">Defend the best permissible choice</a></li><li><a class="util-journey-all-link" href="#lj-c1--journey-study-tips">Study tips</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-page-orientation" data-region="orientation"><div id="lj-c1--journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>This self-study resource explores how a fixed perimeter affects the choices available when maximising the area of a rectangle. Begin by recording your own prediction, then investigate proposed rectangles and use the evidence to explain what makes an improvement permissible. The three activities build on one another, so retain your initial prediction and complete each comparison before revealing its feedback.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>The activities progress from identifying the mathematical problem, through checking proposed choices, to explaining and transferring the reasoning. Your initial prediction provides a starting point for comparison with evidence. The final activity asks you to use the same principle in a different limited-resource decision.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><p>Constrained optimisation concerns finding the best value of an objective while respecting restrictions on the choices available.</p><h3 class="util-md-heading util-md-heading--source-3">Objectives and decision variables</h3><p>An <strong>objective function</strong> assigns a numerical value to a proposed choice. It represents the quantity we want to maximise or minimise. <strong>Decision variables</strong> are the quantities whose values can change.</p><p>For a rectangle with side lengths \(x\) and \(y\), the area objective is</p><p>\[A(x,y)=xy\]</p><p>The two side lengths are decision variables. Changing either dimension can change the area, but it may also affect whether the rectangle satisfies the problem&#39;s restrictions.</p><h3 class="util-md-heading util-md-heading--source-3">Constraints and permissible choices</h3><p>A <strong>constraint</strong> specifies a condition that choices must satisfy. An equality constraint requires a mathematical expression to equal a fixed value. Other restrictions may require variables to remain positive or non-negative.</p><p>For a rectangle with a fixed perimeter of 20 units, the equality constraint is</p><p>\[2x+2y=20\]</p><p>Equivalently,</p><p>\[x+y=10\]</p><p>The additional conditions \(x&gt;0\) and \(y&gt;0\) require positive side lengths.</p><p>The <strong>feasible set</strong> contains every choice satisfying all the restrictions. A choice is <strong>feasible</strong> when it belongs to that set and <strong>infeasible</strong> when it violates at least one required condition.</p><h3 class="util-md-heading util-md-heading--source-3">Two separate mathematical questions</h3><p>Evaluating a proposed choice involves distinguishing two questions:</p><ol><li><strong>Is the choice permissible?</strong> Check every constraint and other restriction.</li><li><strong>What objective value does it produce?</strong> Substitute the decision-variable values into the objective function.</li></ol><p>These checks serve different purposes. A numerical objective value can be calculated for a proposed choice even when that choice is infeasible. A larger objective value therefore does not, by itself, establish a permissible improvement.</p><p>A <strong>constrained improvement</strong> increases the objective while preserving the restrictions. An <strong>infeasible improvement</strong> may increase the numerical objective but fails at least one condition defining the available choices.</p><h3 class="util-md-heading util-md-heading--source-3">Dependence between variables</h3><p>Under a fixed total, the decision variables cannot necessarily increase independently. In the rectangle problem, \(x+y=10\) means that increasing one side requires decreasing the other by the same amount.</p><p>This dependence changes the available comparisons. Without the fixed-perimeter restriction, positive rectangle dimensions could both increase. With the restriction, any proposed change must preserve the required total.</p><h3 class="util-md-heading util-md-heading--source-3">Comparing alternatives and supporting claims</h3><p>A useful investigation begins with a prediction, checks candidate choices against the restrictions, calculates their objective values and compares only the feasible alternatives.</p><p>The strength of the conclusion must match the evidence. Comparing a finite collection of rectangles can identify the best <strong>among those examined</strong>. Establishing a <strong>global maximum</strong> requires an argument covering every feasible choice, not merely the examples inspected.</p><p>One possible method for an equality constraint is <strong>substitution</strong>: express one decision variable in terms of the other, then examine the resulting single-variable objective over the permitted domain. This method can support a general mathematical justification when its reasoning covers the whole feasible set.</p><p>The activities will ask you to distinguish feasibility from objective value, test competing claims, and reconsider an initial prediction using mathematical evidence. The particular comparisons and their conclusions are left for you to establish.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/knowledge-summary-after-content.png" alt="Concept map linking rectangle variables, area, constraints and feasible comparison; detailed description follows." aria-describedby="lj-c1--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> How objective values and restrictions jointly determine which choices can be compared.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c1--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content">The decision variables x and y connect to two separate mathematical operations. The area function A(x,y)=xy assigns an objective value, while x+y=10 and the positivity conditions determine whether the proposed dimensions belong to the feasible set. Only choices satisfying the restrictions proceed to comparison as permissible alternatives. A comparison of selected feasible choices identifies the best among those examined; establishing a global maximum requires an argument covering the entire feasible set.</p></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Identify the objective function, decision variables and restrictions in the fixed-perimeter rectangle problem, distinguishing the quantity to be maximised from the conditions that permissible choices must satisfy. <span class="util-outcome-id">(LO1)</span></li><li>Classify proposed rectangle dimensions as feasible or infeasible by applying the perimeter and positivity restrictions, and compare the areas of feasible alternatives. <span class="util-outcome-id">(LO2)</span></li><li>Explain, using the rectangle comparisons and their own initial prediction, why constrained optimisation seeks the greatest objective value among permissible choices rather than the greatest numerical value regardless of restrictions. <span class="util-outcome-id">(LO3)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="lj-c1--journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="lj-c1--activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Predict and define the rectangle</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The central enquiry is what makes a choice the best permissible choice. Familiar ideas about rectangle area and perimeter provide a concrete starting point for distinguishing an objective function from a constraint before introducing any formal optimisation method.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have 20 units of material to make the perimeter of a rectangle. Its positive side lengths are \(x\) and \(y\), and your aim is to enclose as much area as possible. Before calculating anything, predict whether a long, narrow rectangle, a more balanced rectangle or a square would work best. Keep your prediction: you will return to it after exploring the choices. You will then distinguish what you want to maximise from the restrictions that every permissible rectangle must satisfy.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Begin with your own geometric intuition, then translate the problem into mathematical language. Keep the quantity being maximised separate from the conditions restricting the available choices.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">What did you initially expect to happen to the area as the rectangle&#39;s shape changed? Which mathematical expression describes your goal, and which expressions limit the choices available to you?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A1"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a1-concept-01-activity-a1-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/activity-a1-materials-entry.png" alt="Contrast of rectangle decision variables, area objective and perimeter restrictions; detailed description follows." aria-describedby="lj-c1--figure-description-asset-vb-38-4-va-a1-concept-01-activity-a1-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 2.</strong> What can change, what is measured and what must remain true.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c1--figure-description-asset-vb-38-4-va-a1-concept-01-activity-a1-materials-entry">The rectangle&#39;s positive side lengths x and y are identified as decision variables. One relationship leads to the area objective A(x,y)=xy, which measures the value of a proposed choice. A separate relationship leads to the fixed-perimeter equality 2x+2y=20, or x+y=10, together with x&gt;0 and y&gt;0. These conditions determine whether the choice is permissible. The contrast does not identify a preferred shape or calculate any candidate&#39;s area.</p></figure><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A1-M1" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Understanding the rectangle problem</span></p><h3 class="util-md-heading util-md-heading--source-2">What are we trying to achieve?</h3><p>Imagine using 20 units of material to form the boundary of a rectangle. You can choose its length and width, but you cannot use more or less material. Your aim is to enclose the greatest possible area.</p><p><strong>Before reading the mathematical description, record your own prediction in the response workspace.</strong> Would a long, narrow rectangle, a more balanced rectangle or a square enclose the most area? Give a reason based on your intuition. You do not need to calculate anything yet.</p><h3 class="util-md-heading util-md-heading--source-3">Two quantities, two different jobs</h3><p>Call the positive side lengths \(x\) and \(y\). These are the <strong>decision variables</strong>: changing them changes the rectangle you make.</p><p>The area is</p><p>\[A(x,y)=xy\]</p><p>This is the <strong>objective function</strong>. It tells us how much area each proposed pair of dimensions encloses. Maximising the objective means seeking the greatest possible value of \(A\).</p><p>However, the perimeter must remain 20 units. A rectangle has two sides of each length, so</p><p>\[2x+2y=20\]</p><p>Dividing by 2 gives the equivalent <strong>equality constraint</strong>:</p><p>\[x+y=10\]</p><p>The sides must also be positive:</p><p>\[x&gt;0,\qquad y&gt;0\]</p><p>Together, these restrictions determine the <strong>feasible set</strong>: every pair of positive side lengths whose sum is 10. A feasible choice is one that satisfies all the restrictions.</p><h3 class="util-md-heading util-md-heading--source-3">Why the distinction matters</h3><p>The objective and constraint do different jobs. The objective tells us <strong>how good</strong> a choice is according to area. The constraint tells us <strong>whether that choice is allowed</strong>.</p><p>Without the fixed perimeter, we could enlarge both positive dimensions and increase the area. With the perimeter fixed, increasing one side means decreasing the other by the same amount. We therefore cannot treat every larger area value as an available improvement.</p><p>This is the essential difference between unconstrained and constrained optimisation. Unconstrained optimisation considers choices without the specified restriction; constrained optimisation seeks the best choice <strong>within the feasible set</strong>.</p><p>The key question is not simply, &#39;Which dimensions give a large area?&#39; It is, &#39;Which permissible dimensions give the greatest area?&#39;</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c1--learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="lj-c1--learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="lj-c1--learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c1--learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c1--learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="lj-c1--learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c1--learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Record your initial prediction about which rectangle shape will give the greatest area and explain your reasoning without calculating a solution.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A1-M2" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Your prediction and problem definition</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify the decision variables and write the objective function for area.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Express the fixed perimeter as an equality constraint, simplify it, and state the conditions on the side lengths.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain in your own words the difference between the quantity you are trying to maximise and the conditions that a permissible rectangle must satisfy.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>An original, retained prediction with a brief geometric justification; correct identification of the two decision variables and the area objective; an accurate mathematical statement of the perimeter and positivity restrictions; and a clear distinction between maximising area and satisfying the conditions defining permissible rectangles. The initial prediction is treated as reasoning to investigate, not as an answer that must already be correct.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m2-section-initial-prediction-1" data-response-part-id="A1-template-section-a1-m2-section-initial-prediction-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-initial-prediction-1-label" for="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-initial-prediction-1">Initial prediction</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-initial-prediction-1-desc">Before using calculations, which rectangle shape do you expect to enclose the greatest area? Record your own prediction. Keep it unchanged so you can revisit it later.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-initial-prediction-1" name="learner-workspace-a1-a1-template-section-a1-m2-section-initial-prediction-1" rows="6" aria-describedby="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-initial-prediction-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m2-section-prediction-reasoning-2" data-response-part-id="A1-template-section-a1-m2-section-prediction-reasoning-2"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-prediction-reasoning-2-label" for="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-prediction-reasoning-2">Prediction reasoning</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-prediction-reasoning-2-desc">Explain briefly why you expect that shape to work best. You may use everyday geometric intuition.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-prediction-reasoning-2" name="learner-workspace-a1-a1-template-section-a1-m2-section-prediction-reasoning-2" rows="6" aria-describedby="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-prediction-reasoning-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure util-learner-workspace--math-entry" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-3" data-response-part-id="A1-template-section-a1-m2-section-decision-variables-and-objective-3" data-input-modality="math" data-math-entry="true" data-math-field-id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-3" data-math-label-id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-3-label"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-3-label" for="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-3">Decision variables and objective</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-3-desc">Name the two quantities you can choose and write the mathematical expression for the area you want to maximise.</p><div class="util-math-entry" data-math-entry-root><div class="util-math-entry__mount" data-math-entry-mount hidden></div><textarea class="util-learner-workspace__input util-learner-workspace__input--canonical" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-3" name="learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-3" rows="6" aria-labelledby="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-3-label" aria-describedby="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-3-desc lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-3-math-hint"></textarea><p class="util-math-entry__hint" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-3-math-hint">Enter your mathematical expression. Use the maths keyboard for symbols and structures.</p><p class="util-math-entry__hint util-math-entry__hint--fallback-only">If the maths editor is unavailable, enter mathematical notation in this field.</p></div></div><div class="util-learner-workspace util-prose-measure util-learner-workspace--math-entry" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m2-section-equality-and-positivity-restrictions-4" data-response-part-id="A1-template-section-a1-m2-section-equality-and-positivity-restrictions-4" data-input-modality="math" data-math-entry="true" data-math-field-id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-equality-and-positivity-restrictions-4" data-math-label-id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-equality-and-positivity-restrictions-4-label"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-equality-and-positivity-restrictions-4-label" for="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-equality-and-positivity-restrictions-4">Equality and positivity restrictions</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-equality-and-positivity-restrictions-4-desc">Write the fixed-perimeter equality, its simplified equivalent and the conditions that the side lengths must satisfy.</p><div class="util-math-entry" data-math-entry-root><div class="util-math-entry__mount" data-math-entry-mount hidden></div><textarea class="util-learner-workspace__input util-learner-workspace__input--canonical" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-equality-and-positivity-restrictions-4" name="learner-workspace-a1-a1-template-section-a1-m2-section-equality-and-positivity-restrictions-4" rows="6" aria-labelledby="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-equality-and-positivity-restrictions-4-label" aria-describedby="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-equality-and-positivity-restrictions-4-desc lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-equality-and-positivity-restrictions-4-math-hint"></textarea><p class="util-math-entry__hint" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-equality-and-positivity-restrictions-4-math-hint">Enter your mathematical expression. Use the maths keyboard for symbols and structures.</p><p class="util-math-entry__hint util-math-entry__hint--fallback-only">If the maths editor is unavailable, enter mathematical notation in this field.</p></div></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m2-section-objective-versus-restriction-5" data-response-part-id="A1-template-section-a1-m2-section-objective-versus-restriction-5"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-objective-versus-restriction-5-label" for="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-objective-versus-restriction-5">Objective versus restriction</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-objective-versus-restriction-5-desc">In your own words, explain what the objective function measures and what the restrictions determine. Why do you need both when selecting a rectangle?</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-objective-versus-restriction-5" name="learner-workspace-a1-a1-template-section-a1-m2-section-objective-versus-restriction-5" rows="6" aria-describedby="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-objective-versus-restriction-5-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c1--learner-check-a1" data-check-sidebar-open aria-controls="lj-c1--learner-check-a1" aria-expanded="false" aria-label="Check your work: Predict and define the rectangle">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c1--learner-check-a1" data-composition-moment="check" data-activity-id="A1" data-check-sidebar="available" aria-labelledby="lj-c1--learner-check-a1-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c1--learner-check-a1-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c1--learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c1--learner-task-a1">Back to your task (Predict and define the rectangle)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M3" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m3" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m3-c-0" data-revision-criterion-id="a1-m3-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you preserved an initial prediction and explained the intuition behind it?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A recorded starting judgement gives you something specific to test against the mathematical evidence later; its initial correctness is not the criterion.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My response identifies a particular predicted rectangle shape.</li><li><span class="util-guided-review__feature-key">B.</span> My prediction has a reason that can be reconsidered.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Record whether you initially favoured a long, narrow shape, a more balanced shape or a square. Do not change that first prediction to match later feedback.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Add a short statement about how you thought changing the side lengths would affect the enclosed area.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a1-a1-m3-item-0" data-checklist-item-id="checklist-a1-a1-m3-item-0"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a1-a1-m3-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m3-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m3-c-1" data-revision-criterion-id="a1-m3-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you identified the decision variables and the quantity to maximise?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confusing the variables with the objective makes it unclear what can change and what the optimisation is trying to improve.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Both side lengths are identified as quantities that can vary.</li><li><span class="util-guided-review__feature-key">B.</span> The objective is expressed as a function of the two side lengths.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the two rectangle dimensions as decision variables and distinguish them from the fixed total perimeter.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Write the rectangle area as a product of its two dimensions and identify area as the quantity being maximised.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a1-a1-m3-item-1" data-checklist-item-id="checklist-a1-a1-m3-item-1"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a1-a1-m3-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m3-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m3-c-2" data-revision-criterion-id="a1-m3-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you represented all restrictions on the dimensions?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Leaving out a restriction changes which rectangles count as permissible and therefore changes the mathematical problem.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The fixed perimeter is expressed as an equality involving both dimensions.</li><li><span class="util-guided-review__feature-key">B.</span> Both side lengths are required to be positive.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Account for both pairs of opposite sides when writing the perimeter equation, then simplify the equality.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Add the positivity conditions so the mathematical description excludes zero or negative side lengths.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a1-a1-m3-item-2" data-checklist-item-id="checklist-a1-a1-m3-item-2"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a1-a1-m3-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m3-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m3-c-3" data-revision-criterion-id="a1-m3-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Does your explanation distinguish the objective from the feasible set?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The central idea of constrained optimisation is lost if a large objective value is automatically treated as an available choice.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The objective is described as a measure of area rather than a permission rule.</li><li><span class="util-guided-review__feature-key">B.</span> The restrictions are described as conditions defining permissible choices.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State what numerical quantity the area function assigns to each proposed rectangle.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain that a proposed pair must satisfy the perimeter and positivity conditions before it can be considered an acceptable solution.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a1-a1-m3-item-3" data-checklist-item-id="checklist-a1-a1-m3-item-3"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a1-a1-m3-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m3-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c1--activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Test which rectangles are feasible</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The mathematical description developed earlier now becomes a decision rule. Identifying the objective and constraint is not enough: applying them to actual dimensions reveals why a large numerical area and a permissible solution are different things.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have identified the area objective and the fixed-perimeter restriction. Now investigate four proposed rectangles. Some may offer a larger area but fail the perimeter requirement. Check each choice before deciding which represents an improvement within the permitted choices. Keep the original prediction available without changing it.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Use two separate checks for each rectangle: first determine whether the dimensions satisfy all restrictions, then calculate the area. Compare objective values only after establishing which choices are permissible.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which check determines whether a rectangle is allowed? Which calculation tells you how much area it encloses? How do these two pieces of information work together when deciding which choice is better?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A2"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="3" data-figure-id="asset-vb-38-4-va-a2-feasibility-01-activity-a2-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/activity-a2-materials-entry.png" alt="Decision pathway separating perimeter checks from area calculations; detailed description follows." aria-describedby="lj-c1--figure-description-asset-vb-38-4-va-a2-feasibility-01-activity-a2-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 3.</strong> Check permission and area separately before comparing alternatives.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c1--figure-description-asset-vb-38-4-va-a2-feasibility-01-activity-a2-materials-entry">A proposed pair of rectangle dimensions leads to two distinct checks. One checks positivity and whether the dimensions satisfy x+y=10; this determines feasibility. The other calculates the numerical area using A(x,y)=xy. A proposal enters the permissible comparison only if it satisfies every restriction. The area value remains a separate result and cannot make an infeasible proposal eligible. No supplied candidate is calculated or classified.</p></figure><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A2-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">How feasibility changes a comparison</span></p><h3 class="util-md-heading util-md-heading--source-2">Two checks for every proposed rectangle</h3><p>A rectangle can have a perfectly calculable area without being allowed by the problem. That is why area and feasibility need separate calculations.</p><p>Consider a proposed rectangle with positive side lengths \(u\) and \(v\). Its total perimeter is \(2u+2v\). Because the available perimeter is fixed at 20 units, the same requirement can be checked using \(u+v=10\). This gives the first intermediate finding: whether the proposed dimensions satisfy the fixed-perimeter equality. Positivity is also checked, because the sides must describe a genuine rectangle.</p><p>That feasibility finding determines whether the proposal is eligible for selection. Its area, \(uv\), can then be calculated as a separate numerical result. A large value of \(uv\) tells us how much area the proposed dimensions would enclose; it does not overturn a failed perimeter check.</p><p>Now imagine comparing several proposed rectangles. The perimeter and positivity findings identify which belong to the feasible set. Their calculated areas can then be compared to determine which of those permissible alternatives performs best. An alternative outside that set cannot be selected merely because its area is greater.</p><p>The resulting judgement has a precise scope: it identifies the best <strong>among the alternatives examined</strong>. To claim the greatest area across every feasible rectangle, we would need reasoning that covers the entire feasible set rather than just a handful of examples.</p><p>Apply this distinction to the four proposed rectangles in your comparison table. The calculations and classifications are yours to establish.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c1--learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="lj-c1--learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="lj-c1--learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c1--learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c1--learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="lj-c1--learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c1--learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect the four proposed side-length pairs in the supplied rectangle comparison.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A2-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Four proposed rectangles</span></p><h3 class="util-md-heading util-md-heading--source-2">Investigate the alternatives</h3><p><em>Simulated teaching example: these dimensions are supplied for mathematical investigation, not drawn from an empirical study.</em></p><p>A rectangle must have a perimeter of exactly <strong>20 units</strong>, with both side lengths positive. Its area is the product of its two side lengths.</p><p>Four proposed rectangles have the following dimensions:</p><ul><li><strong>Rectangle P:</strong> \((x,y)=(2,8)\)</li><li><strong>Rectangle Q:</strong> \((x,y)=(4,6)\)</li><li><strong>Rectangle R:</strong> \((x,y)=(5,5)\)</li><li><strong>Rectangle S:</strong> \((x,y)=(6,6)\)</li></ul><p>For each rectangle, investigate two separate questions: does it satisfy the restrictions, and what area would it enclose?</p><p>Use the comparison workspace to record your calculations. Do not assume that the rectangle with the greates
