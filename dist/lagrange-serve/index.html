" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-regularity-condition-4" data-response-part-id="A4-template-section-a4-m3-section-regularity-condition-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m3-section-regularity-condition-4-label" for="lj-c2--learner-workspace-a4-a4-template-section-a4-m3-section-regularity-condition-4">Regularity condition</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m3-section-regularity-condition-4-desc">Record your response for Regularity condition.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m3-section-regularity-condition-4" name="learner-workspace-a4-a4-template-section-a4-m3-section-regularity-condition-4" rows="6" aria-describedby="lj-c2--learner-workspace-a4-a4-template-section-a4-m3-section-regularity-condition-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-what-the-condition-establishes-5" data-response-part-id="A4-template-section-a4-m3-section-what-the-condition-establishes-5"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m3-section-what-the-condition-establishes-5-label" for="lj-c2--learner-workspace-a4-a4-template-section-a4-m3-section-what-the-condition-establishes-5">What the condition establishes</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m3-section-what-the-condition-establishes-5-desc">Record your response for What the condition establishes.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m3-section-what-the-condition-establishes-5" name="learner-workspace-a4-a4-template-section-a4-m3-section-what-the-condition-establishes-5" rows="6" aria-describedby="lj-c2--learner-workspace-a4-a4-template-section-a4-m3-section-what-the-condition-establishes-5-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c2--learner-check-a4" data-check-sidebar-open aria-controls="lj-c2--learner-check-a4" aria-expanded="false" aria-label="Check your work: Explain parallel gradients">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c2--learner-check-a4" data-composition-moment="check" data-activity-id="A4" data-check-sidebar="available" aria-labelledby="lj-c2--learner-check-a4-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c2--learner-check-a4-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c2--learner-check-a4-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c2--learner-task-a4">Back to your task (Explain parallel gradients)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A4-M8" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a4-a4-m8" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a4-m8-c-0" data-revision-criterion-id="a4-m8-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you explained the full chain from feasible tangent movement to parallel gradients?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The multiplier equation is geometrically meaningful only when its connection to permitted movement and first-order stationarity is established.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The constraint gradient is related to a tangent of the feasible line.</li><li><span class="util-guided-review__feature-key">B.</span> Zero first-order objective change is related to the same tangent.</li><li><span class="util-guided-review__feature-key">C.</span> The shared normal direction leads to scalar proportionality.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Explain why a direction that preserves the equality must be perpendicular to the non-zero constraint gradient.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect the directional derivative along the feasible tangent to the normal direction of the objective gradient.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain why two vectors perpendicular to the same non-zero tangent in the plane must lie on one normal line.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a4-a4-m8-item-0" data-checklist-item-id="checklist-a4-a4-m8-item-0"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a4-a4-m8-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m8-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a4-m8-c-1" data-revision-criterion-id="a4-m8-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you calculated the multiplier for the stated constraint representation and included regularity?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The scalar relationship depends on correctly evaluated gradients and on the non-zero constraint normal that supports the geometric argument.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The objective and constraint gradients are evaluated at the supplied point.</li><li><span class="util-guided-review__feature-key">B.</span> The multiplier is justified by componentwise scalar proportionality.</li><li><span class="util-guided-review__feature-key">C.</span> The non-zero constraint-gradient condition is stated.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Substitute the coordinates into the given gradient expressions before comparing their components.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Show how a single scalar multiplies the constraint-gradient components to obtain the objective-gradient components.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Add the regularity requirement and connect it to the existence of a meaningful normal to the feasible curve.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a4-a4-m8-item-1" data-checklist-item-id="checklist-a4-a4-m8-item-1"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a4-a4-m8-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m8-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a4-m8-c-2" data-revision-criterion-id="a4-m8-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you distinguished the necessary first-order condition from proof of a maximum?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A stationary candidate can satisfy the multiplier equations without being a constrained maximum.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response identifies the multiplier equations as necessary first-order conditions in the regular setting.</li><li><span class="util-guided-review__feature-key">B.</span> The response recognises the need to examine objective behaviour along the feasible set.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Qualify the conclusion as a condition satisfied at a regular constrained local optimum, rather than a test that guarantees one.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify the further kind of reasoning needed to distinguish a maximum from other stationary possibilities.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a4-a4-m8-item-2" data-checklist-item-id="checklist-a4-a4-m8-item-2"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a4-a4-m8-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m8-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a4-m8-c-3" data-revision-criterion-id="a4-m8-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Does your transfer explanation use both vector pairs to distinguish parallelism from same-direction arrows?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The contrast tests whether the learner can apply scalar proportionality beyond the original rectangle diagram.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each supplied vector pair is considered through a scalar relationship.</li><li><span class="util-guided-review__feature-key">B.</span> The sign of the scalar is connected to arrow orientation.</li><li><span class="util-guided-review__feature-key">C.</span> The claim is evaluated without inferring optimality from vector parallelism alone.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> For each pair, determine the multiplier that connects corresponding components.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain separately what a positive and a negative multiplier imply about vector direction.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Keep the conclusion about vector geometry distinct from any claim that a point is a maximum or minimum.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a4-a4-m8-item-3" data-checklist-item-id="checklist-a4-a4-m8-item-3"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a4-a4-m8-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m8-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Review the example response</summary><div class="util-composition-reveal__body"><article class="util-material-block util-sample-output util-prose-measure" data-material-id="A4-M7" data-material-type="sample_output" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></span><span class="util-semantic-icon__label">Feedback: Parallel gradients, multiplier and proof</span></p><h3 class="util-md-heading util-md-heading--source-3">Reveal after completing both explanations</h3><p>At the feasible point \((5,5)\), the objective gradient is</p><p>\[\nabla A(5,5)=(5,5).\]</p><p>The constraint gradient is \(\nabla g=(1,1)\). Consequently,</p><p>\[\nabla A(5,5)=(5,5)=5(1,1)=5\nabla g.\]</p><p>The multiplier for the representation \(g(x,y)=x+y=10\) is therefore \(\lambda=5\).</p><p>Both gradients are perpendicular to the feasible tangent \((1,-1)\):</p><p>\[(5,5)\cdot(1,-1)=0,\qquad (1,1)\cdot(1,-1)=0.\]</p><p>This illustrates the geometric mechanism. At a regular constrained local optimum, first-order objective change vanishes along the feasible tangent, so the objective gradient lies in the normal direction already determined by the non-zero constraint gradient. The multiplier records their scalar proportionality.</p><p>The multiplier depends on how the constraint is expressed. Writing the same feasible set as \(2x+2y=20\) gives the constraint gradient \((2,2)\). Then</p><p>\[(5,5)=\frac{5}{2}(2,2),\]</p><p>so the multiplier becomes \(5/2\), while the feasible line and its tangent geometry remain unchanged.</p><h3 class="util-md-heading util-md-heading--source-3">Feedback on the candidate claim</h3><p>For Pair I,</p><p>\[(2,2)=2(1,1).\]</p><p>The scalar is positive, so the arrows point in the same direction. For Pair II,</p><p>\[(-2,-2)=-2(1,1).\]</p><p>The scalar is negative, so the arrows point in opposite directions. Both pairs are parallel because the vectors are scalar multiples. A suitable explanation therefore distinguishes <strong>parallel</strong> from <strong>same-direction</strong> rather than treating the terms as interchangeable.</p><h3 class="util-md-heading util-md-heading--source-3">What proves the rectangle&#39;s maximum?</h3><p>The multiplier equation is a <strong>necessary first-order condition</strong> in the regular setting. It identifies a stationary candidate; it does not independently prove that the candidate is a maximum.</p><p>For this particular rectangle, substitute the constraint into the area:</p><p>\[A(x,10-x)=x(10-x)=25-(x-5)^2.\]</p><p>For positive feasible side lengths, \(0&lt;x&lt;10\), and \((x-5)^2\geq0\). Thus</p><p>\[A(x,10-x)\leq25,\]</p><p>with equality only at \(x=5\), giving \(y=5\). This <strong>separate global argument</strong> proves the unique constrained maximum area of 25.</p><h3 class="util-md-heading util-md-heading--source-3">Debrief</h3><p>A complete geometric explanation links the feasible tangent to the constraint normal, links first-order stationarity to the objective normal, and explains why the two normals are scalar multiples. It also states clearly that first-order stationarity and a proof of optimality are different achievements.</p></article></div></details></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A4"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M4" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Explain a gradient-direction claim to another learner</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-transfer-prompt-a4-m4-910" data-response-part-id="A4-transfer-prompt-a4-m4-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a4-a4-transfer-prompt-a4-m4-910-label" for="lj-c2--learner-workspace-a4-a4-transfer-prompt-a4-m4-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="lj-c2--learner-workspace-a4-a4-transfer-prompt-a4-m4-910-desc"><p>A learner has written the candidate statement shown in the separate claim card. Your task is to respond as a mathematical explainer rather than to solve another rectangle optimisation problem.</p><p>Write a short message of approximately 70–100 words that:</p><ul><li>Interprets the candidate claim using <strong>both</strong> supplied vector pairs.</li><li>Explains how the sign of the scalar in \(\mathbf{u}=\lambda\mathbf{v}\) affects arrow direction.</li><li>Distinguishes what it means for vectors to be parallel from what it means for them to point in the same direction.</li></ul><p>Use the numerical pairs as evidence for your explanation. Do not infer anything about maxima or minima from these vector pairs alone. Write your message independently before viewing the feedback.</p></div><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a4-a4-transfer-prompt-a4-m4-910" name="learner-workspace-a4-a4-transfer-prompt-a4-m4-910" rows="5" aria-describedby="lj-c2--learner-workspace-a4-a4-transfer-prompt-a4-m4-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><style id="lj-c2--prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="true"]{display:block;position:fixed;top:var(--learner-sticky-nav-height,0px);left:0;right:0;z-index:40;margin:0 ationary candidate to a proven maximum</a></li><li><a class="util-journey-all-link" href="#lj-c3--exposition-S7">Using the method accurately and independently</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c3/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-exposition-sections" data-region="exposition"><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S1" data-section-id="S1" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">The rectangle problem: what must the equations preserve?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Consider a rectangle with positive side lengths x and y and a fixed perimeter of 20 units. We want to find the dimensions that maximise its area.</p><p>The area is A(x,y)=xy. The perimeter restriction is 2x+2y=20, which we can simplify to x+y=10. We also require x&gt;0 and y&gt;0 because both side lengths must be positive.</p><p>These statements describe two different parts of the problem. The objective A(x,y)=xy tells us what we want to make as large as possible. The constraint x+y=10 tells us which pairs of dimensions we are permitted to consider. The positivity restrictions narrow those possibilities to genuine rectangles.</p><p>A rectangle with dimensions (6,6) would have area 36 square units, but its perimeter would be 24 units, not 20. It cannot be the answer to this problem, regardless of its larger area. By contrast, (5,5) satisfies the perimeter restriction and has area 25 square units. The distinction is between a large value of the objective and a large value among feasible choices.</p><p>If you completed &#39;Why the constraint matters&#39;, revisit your prediction about the best rectangle dimensions and your explanation of which choices were feasible. If you completed &#39;Seeing gradients and tangency&#39;, also revisit your explanation of why the objective and constraint gradients are parallel at a regular constrained optimum. Use your own reasoning from those activities to connect the perimeter restriction and the geometric relationship to the equations developed here. You do not need a particular earlier answer to follow the calculation.</p><p>The geometric reasoning gives us a starting point. At a regular constrained optimum, the gradient of the objective is a scalar multiple of the gradient of the constraint. We write this as grad A=lambda grad g, where g represents the constraint function and lambda is a scalar.</p><p>The remaining challenge is practical: how can this geometric relationship be turned into equations that determine x and y? The multiplier method provides that translation. It does not replace the perimeter restriction; it uses the restriction alongside the gradient relationship to identify possible optimal dimensions.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S2" data-section-id="S2" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">From parallel gradients to three equations</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Suppose we want to optimise a differentiable function f(x,y), subject to a smooth equality constraint g(x,y)=c. The equation g(x,y)=c describes the permitted constraint curve, while f(x,y) describes the quantity we are trying to maximise or minimise.</p><p>At a regular point of the constraint, grad g is non-zero. The gradient grad g is perpendicular to the tangent direction of the constraint curve. At a constrained local optimum, moving a small distance along a feasible tangent direction cannot produce a first-order increase or decrease in the objective. The objective gradient must therefore also be perpendicular to that tangent direction.</p><p>In two dimensions, vectors perpendicular to the same non-zero tangent direction are parallel. Consequently, the necessary first-order relationship at a regular constrained local optimum is</p><p>grad f=lambda grad g.</p><p>The symbol lambda represents a scalar multiplier. It tells us how one gradient vector is related to the other by multiplication. It is not a third side length or an additional physical quantity in the rectangle. It is an unknown introduced to express the relationship between gradients.</p><p>Two parallel vectors need not be identical. For example, multiplying a vector by 5 changes its magnitude without changing its direction. A negative multiplier would reverse its direction. The equation grad f=lambda grad g therefore describes scalar proportionality, not necessarily equality of the original gradient vectors.</p><p>Now write out what each gradient contains. The gradient of f is the vector of its partial derivatives:</p><p>grad f=(f<em>x,f</em>y).</p><p>Similarly,</p><p>grad g=(g<em>x,g</em>y).</p><p>Substituting these expressions into the parallel-gradient condition gives</p><p>(f<em>x,f</em>y)=lambda(g<em>x,g</em>y).</p><p>Multiplying the constraint gradient by lambda produces the vector (lambda g<em>x,lambda g</em>y). Two vectors are equal precisely when their corresponding components are equal. The single vector equation therefore gives two scalar equations:</p><p>f<em>x=lambda g</em>x, f<em>y=lambda g</em>y.</p><p>These equations express the geometric condition algebraically. The first relates the x-components of the gradients; the second relates the y-components.</p><p>But they are not yet the complete constrained optimisation system. We must also retain</p><p>g(x,y)=c.</p><p>The complete multiplier system is therefore</p><p>f<em>x=lambda g</em>x, f<em>y=lambda g</em>y, g(x,y)=c.</p><p>There are three unknowns, x, y and lambda, and three equations. The first two equations encode the first-order gradient relationship. The third requires the candidate point to lie on the specified constraint level.</p><p>Without the third equation, we might find points where the gradients are proportional but which do not satisfy the original restriction. In the rectangle problem, this would mean finding a relationship between side lengths without yet requiring their sum to equal 10.</p><p>The mathematical status of this system also needs care. Under the stated differentiability and regularity assumptions, the multiplier equations are necessary at a constrained local optimum. Solving them identifies stationary candidates. It does not, on its own, prove that any candidate is a maximum or minimum. That distinction will remain in place throughout the calculation.</p><p>The geometric and algebraic descriptions are now connected: perpendicularity to the feasible tangent direction explains parallel gradients; parallel gradients give component equations; the constraint equation ensures that the resulting candidate respects the original problem.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material util-worked-example" data-material-id="XM-S2-01" data-material-kind="symbolic correspondence diagram" data-material-type="expository_compact_worked_example" data-section-id="S2" data-expository-structured="compact_worked_example"><h3>From one vector relationship to a complete system</h3><ol class="util-exposition-worked-stages" data-field="stages"><li class="util-exposition-worked-stage"><p class="util-exposition-worked-stage__label"><strong>Geometric relationship</strong></p></li><li class="util-exposition-worked-stage"><p class="util-exposition-worked-stage__label"><strong>Write both gradients in components</strong></p></li><li class="util-exposition-worked-stage"><p class="util-exposition-worked-stage__label"><strong>Equate corresponding components</strong></p></li></ol></article></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--section-after-content" data-visual-slot="section-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-s2-vector-components-01-section-s2-section-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c3/section-after-content.png" alt="Symbolic correspondence diagram deriving two component equations from the parallel-gradient condition and adding the original equality constraint to complete the system." aria-describedby="lj-c3--figure-description-asset-vb-38-4-va-s2-vector-components-01-section-s2-section-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> The parallel-gradient relationship becomes two component equations; the original constraint completes the multiplier system.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c3--figure-description-asset-vb-38-4-va-s2-vector-components-01-section-s2-section-after-content">A compact mathematical diagram begins with \(\nabla f=\lambda\nabla g\). The next stage expands the gradients as \((f_x,f_y)=\lambda(g_x,g_y)=(\lambda g_x,\lambda g_y)\). Two explicitly labelled correspondences identify the x-component equation \(f_x=\lambda g_x\) and the y-component equation \(f_y=\lambda g_y\). A separate labelled element contains \(g(x,y)=c\), with an explanatory connector indicating that it comes from the original constraint rather than the vector derivation. The three equations are grouped as the complete multiplier system. All symbols and connections must be legible and available through the accompanying text equivalent.</p></figure></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S3" data-section-id="S3" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Constructing the rectangle&#39;s multiplier system</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>We can now apply the general equations to the rectangle. Our objective is</p><p>A(x,y)=xy,</p><p>and we choose the constraint function</p><p>g(x,y)=x+y,</p><p>with g(x,y)=10.</p><p>First, calculate the gradient of the area function. A gradient is built from partial derivatives, so we differentiate with respect to x and y separately.</p><p>When differentiating A(x,y)=xy with respect to x, treat y as constant. The derivative of xy with respect to x is y. Therefore</p><p>A_x=y.</p><p>When differentiating with respect to y, treat x as constant. This gives</p><p>A_y=x.</p><p>The area gradient is consequently</p><p>grad A=(y,x).</p><p>Notice the order of the components. The first component is the derivative with respect to x, which is y. The second component is the derivative with respect to y, which is x. The fact that the variables appear in the opposite order is a consequence of differentiating a product, not a change in the definition of a gradient.</p><p>Next, differentiate the constraint function g(x,y)=x+y. The derivative with respect to x is 1, because the derivative of x is 1 and y is treated as constant. Similarly, the derivative with respect to y is 1. Thus</p><p>g<em>x=1, g</em>y=1, grad g=(1,1).</p><p>The constraint gradient is non-zero everywhere, so the regularity assumption needed for the standard multiplier condition holds at every point of this constraint line.</p><p>The geometric condition is</p><p>grad A=lambda grad g.</p><p>Substituting the gradients we have calculated gives</p><p>(y,x)=lambda(1,1).</p><p>The right-hand side is the vector (lambda,lambda). Equating corresponding components therefore produces</p><p>y=lambda, x=lambda.</p><p>These are the two component equations. The first comes from the x-component of the gradients, and the second from the y-component. Their order follows the derivatives, not the order in which the variables appear in the area formula.</p><p>We must now include the perimeter restriction. The complete system is</p><p>y=lambda, x=lambda, x+y=10.</p><p>Every equation has a distinct origin. The first is obtained by equating the x-components of the gradients. The second is obtained by equating their y-components. The third is the original perimeter condition.</p><p>If we stopped after writing y=lambda and x=lambda, we would know that x=y, but not how large either side should be. Equal sides alone do not determine a rectangle with perimeter 20. The equation x+y=10 supplies that missing information.</p><p>This is also a useful way to recognise errors. Writing grad A=(1,1) would confuse the derivatives of the area with those of the constraint. Writing only y=lambda and x=lambda would omit the feasibility condition. Either mistake changes the mathematical calculation, even if the subsequent algebra is performed correctly.</p><p>The equations now contain enough information to identify the rectangle&#39;s stationary candidate. Their geometric origin remains visible: the first two equations express parallel gradients, and the third keeps the candidate on the permitted constraint line.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-S3-01" data-material-kind="derivative correspondence table" data-material-type="expository_structured_table" data-section-id="S3" data-expository-structured="table"><h3>Differentiating the objective and the constraint</h3><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Role</th><th scope="col">Function</th><th scope="col">Partial x</th><th scope="col">Partial y</th><th scope="col">Gradient</th></tr></thead><tbody><tr><td>Objective: rectangle area</td><td>A(x,y)=xy</td><td>A_x=y</td><td>A_y=x</td><td>grad A=(y,x)</td></tr><tr><td>Constraint function: simplified perimeter</td><td>g(x,y)=x+y</td><td>g_x=1</td><td>g_y=1</td><td>grad g=(1,1)</td></tr></tbody></table></div></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S4" data-section-id="S4" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Solving the system and checking feasibility</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Our complete system is</p><p>y=lambda, x=lambda, x+y=10.</p><p>The first two equations say that both side lengths equal the same scalar. Therefore the side lengths must equal one another:</p><p>x=y.</p><p>This is the first useful algebraic deduction. It expresses a property of any point satisfying these multiplier equations for the rectangle: the two side lengths are equal.</p><p>We can now combine that result with the perimeter restriction. Because y=x, the equation x+y=10 becomes</p><p>x+x=10,</p><p>or</p><p>2x=10.</p><p>Dividing by 2 gives</p><p>x=5.</p><p>Since x=y, we also have</p><p>y=5.</p><p>Finally, either component equation gives lambda=5. The solution of the multiplier system is therefore</p><p>x=5, y=5, lambda=5.</p><p>The values x=5 and y=5 describe the rectangle&#39;s dimensions. The value lambda=5 describes the scalar relationship between the gradients under our chosen constraint representation g=x+y. Although all three numbers happen to be 5, they do not have the same mathematical meaning.</p><p>Solving the equations is not the final check. We must verify that the dimensions satisfy the problem&#39;s restrictions. The perimeter equation requires x+y=10. Substituting the candidate gives</p><p>5+5=10,</p><p>which is true. Both dimensions are also positive, so x&gt;0 and y&gt;0 hold.</p><p>The candidate is therefore feasible.</p><p>Its area is</p><p>A(5,5)=5 times 5=25 square units.</p><p>If you predicted (5,5) when first considering the rectangle, the calculation now supplies a formal route to that result. If your earlier prediction was different, the equations give you a reason to reconsider it. In either case, the conclusion follows from the objective derivatives, gradient relationship and perimeter constraint, rather than from visual appearance alone.</p><p>The calculation also demonstrates why the original constraint cannot be omitted. The gradient equations established x=y; the perimeter equation established the actual dimensions. Both parts were needed.</p><p>At this point, our justified statement is that (5,5) is a feasible stationary candidate satisfying the multiplier equations, with lambda=5 and area 25 square units. We have not yet proved that every other feasible rectangle has area at most 25.</p><p>The distinction is deliberate. A system of necessary first-order conditions can identify a point worth investigating. To claim a maximum, we need an argument that supports that stronger conclusion.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S5" data-section-id="S5" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">What does the multiplier mean?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>We found lambda=5 by using the constraint function g(x,y)=x+y. To understand that value, return to the gradient equation</p><p>grad A=lambda grad g.</p><p>The area gradient is grad A=(y,x). At the candidate (5,5), this becomes</p><p>grad A(5,5)=(5,5).</p><p>Our constraint gradient is grad g=(1,1). Therefore the multiplier relationship at the candidate is</p><p>(5,5)=5(1,1).</p><p>The scalar 5 makes the constraint gradient equal to the objective gradient when multiplied by it. That is the immediate mathematical meaning of lambda in this calculation.</p><p>Now consider the original, unsimplified perimeter equation:</p><p>2x+2y=20.</p><p>This describes exactly the same set of rectangles as x+y=10. Dividing both sides by 2 converts one equation into the other. The permitted dimensions have not changed.</p><p>However, if we define the constraint function as g(x,y)=2x+2y, its gradient is</p><p>grad g=(2,2).</p><p>At the same candidate, the objective gradient is still (5,5). The multiplier condition becomes</p><p>(5,5)=lambda(2,2).</p><p>To satisfy this equality, lambda must be 5/2, because</p><p>(5/2)(2,2)=(5,5).</p><p>We now have two different numerical multiplier values for the same optimisation problem. Using g=x+y gives lambda=5. Using g=2x+2y gives lambda=5/2.</p><p>There is no contradiction. Scaling the constraint function changes the magnitude of its gradient. The scalar needed to relate that gradient to the objective gradient must change accordingly.</p><p>The rectangle itself is unchanged. Its feasible dimensions still satisfy the fixed perimeter of 20 units, and the candidate remains (5,5), with area 25 square units.</p><p>This comparison prevents a misleading interpretation of lambda as a fixed physical property of the rectangle. The multiplier belongs to a particular mathematical representation of the constraint. The dimensions and objective value are properties of the optimisation result; the numerical multiplier also depends on how we have written g.</p><p>The component equations remain valid in either representation. What changes is the constraint gradient and the corresponding multiplier, not the underlying geometric problem.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material util-exposition-structured-fallback" data-material-id="XM-S5-01" data-material-kind="equivalent-constraint comparison" data-material-type="expository_structured_fallback" data-section-id="S5" data-expository-structured="fallback"><h3>The same rectangle, two multiplier values</h3><section><section class="util-exposition-comparison-section"><h4>Simplified perimeter constraint</h4><dl><div><dt>Constraint function</dt><dd>g(x,y)=x+y</dd></div><div><dt>Constraint level</dt><dd>c=10</dd></div><div><dt>Constraint equation</dt><dd>x+y=10</dd></div><div><dt>Constraint gradient</dt><dd>grad g=(1,1)</dd></div><div><dt>Objective gradient at candidate</dt><dd>grad A(5,5)=(5,5)</dd></div><div><dt>Multiplier equation</dt><dd>(5,5)=lambda(1,1)</dd></div><div><dt>Multiplier value</dt><dd>lambda=5</dd></div><div><dt>Verified vector equality</dt><dd>(5,5)=5(1,1)</dd></div></dl></section><section class="util-exposition-comparison-section"><h4>Original perimeter constraint</h4><dl><div><dt>Constraint function</dt><dd>g(x,y)=2x+2y</dd></div><div><dt>Constraint level</dt><dd>c=20</dd></div><div><dt>Constraint equation</dt><dd>2x+2y=20</dd></div><div><dt>Constraint gradient</dt><dd>grad g=(2,2)</dd></div><div><dt>Objective gradient at candidate</dt><dd>grad A(5,5)=(5,5)</dd></div><div><dt>Multiplier equation</dt><dd>(5,5)=lambda(2,2)</dd></div><div><dt>Multiplier value</dt><dd>lambda=5/2</dd></div><div><dt>Verified vector equality</dt><dd>(5,5)=(5/2)(2,2)</dd></div></dl></section></section><section><h4>Changes</h4><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Quantity</th><th scope="col">Comparison</th></tr></thead><tbody><tr><td>Constraint function</td><td>x+y becomes 2x+2y.</td></tr><tr><td>Constraint level</td><td>10 becomes 20.</td></tr><tr><td>Constraint gradient</td><td>(1,1) becomes (2,2).</td></tr><tr><td>Multiplier</td><td>5 becomes 5/2.</td></tr></tbody></table></div></section><section><h4>Unchanged</h4><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Quantity</th><th scope="col">Value</th></tr></thead><tbody><tr><td>Feasible set</td><td>Positive dimensions satisfying the perimeter of 20 units.</td></tr><tr><td>Candidate dimensions</td><td>(x,y)=(5,5)</td></tr><tr><td>Objective gradient at the candidate</td><td>(5,5)</td></tr><tr><td>Maximum area</td><td>25 square units</td></tr><tr><td>Optimising rectangle</td><td>The square with side lengths 5 and 5.</td></tr></tbody></table></div></section><p>The equations x+y=10 and 2x+2y=20 impose the same perimeter restriction and therefore describe the same feasible rectangles. With the constraint function x+y, the constraint gradient is (1,1), and the multiplier at (5,5) is 5 because (5,5)=5(1,1). With the constraint function 2x+2y, the constraint gradient is (2,2), and the multiplier is 5/2 because (5,5)=(5/2)(2,2). Scaling the constraint gradient by 2 requires the multiplier to be divided by 2. The candidate dimensions (5,5), the objective gradient (5,5), the feasible set and the maximum area of 25 square units do not change.</p><div><p></p><p>The numerical value of lambda depends on the representation of the constraint. It is the scalar relating the gradients for that representation, not an invariant numerical property of the rectangle.</p></div></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S6" data-section-id="S6" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">From a stationary candidate to a proven maximum</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The multiplier calculation has identified a feasible stationary candidate: x=5, y=5, with area 25 square units. Can we now say that this is the maximum possible area?</p><p>The equations alone do not justify that conclusion. The condition grad A=lambda grad g is a necessary first-order condition at a regular constrained local optimum. It tells us where such an optimum may occur, but a point can satisfy first-order equations without being a maximum or minimum.</p><p>For the rectangle, we can establish the maximum using the original constraint directly.</p><p>We know that</p><p>x+y=10.</p><p>Rearranging gives</p><p>y=10-x.</p><p>Substitute this into the area function A(x,y)=xy:</p><p>A(x,10-x)=x(10-x).</p><p>Expanding gives</p><p>A(x,10-x)=10x-x^2.</p><p>We can rewrite this expression by completing the square:</p><p>A(x,10-x)=25-(x-5)^2.</p><p>This form reveals a property that was not established merely by solving the multiplier equations. For every real x, the square (x-5)^2 is non-negative. Subtracting a non-negative number from 25 cannot produce a value greater than 25.</p><p>Therefore</p><p>A(x,10-x) is at most 25.</p><p>Equality occurs exactly when (x-5)^2=0, which means x=5. The constraint then gives y=5.</p><p>The dimensions (5,5) satisfy the positivity restrictions and the fixed perimeter. Thus the upper bound of 25 square units is actually attained by a feasible rectangle.</p><p>We can now conclude that the rectangle with dimensions (5,5) has the unique global maximum area of 25 square units.</p><p>Compare the two parts of the reasoning. The multiplier equations produced x=y and, together with x+y=10, identified the candidate (5,5). The completed-square argument showed that no feasible rectangle can have a larger area. The first calculation identified a candidate; the second justified the claim of global optimality.</p><p>This is a general distinction worth preserving. A stationary candidate is a result of solving first-order equations. A proven optimum requires mathematical justification appropriate to the problem. The standard multiplier condition also relies on a non-zero constraint gradient; the details of insufficiency and regularity are explored further in &#39;What does the calculation prove?&#39;.</p><p>For this rectangle, both strands of reasoning agree. The geometric condition leads to the algebraic candidate, and the separate global argument establishes that the candidate is indeed optimal.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S7" data-section-id="S7" data-expository-section-role="terminal-close" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Using the method accurately and independently</span></h2><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-S7-01" data-material-kind="mathematical error-diagnosis matrix" data-material-type="expository_structured_table" data-section-id="S7" data-expository-structured="table"><h3>Diagnosing errors in the multiplier calculation</h3><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Error category</th><th scope="col">Affected stage</th><th scope="col">Representative error</th><th scope="col">Why incorrect</th><th scope="col">Correction</th></tr></thead><tbody><tr><td>Conceptual error</td><td>Modelling the constrained problem and checking feasibility</td><td>Selecting (6,6) because its area is 36 square units.</td><td>The dimensions give perimeter 24 units and violate the fixed-perimeter restriction of 20 units.</td><td>Only compare feasible rectangles satisfying x+y=10 with x&gt;0 and y&gt;0. The dimensions (5,5) are feasible and give area 25 square units.</td></tr><tr><td>Derivative error</td><td>Calculating the objective gradient</td><td>Writing grad A=(1,1) for A(x,y)=xy.</td><td>The derivatives of xy are A_x=y and A_y=x. The vector (1,1) is the gradient of g=x+y, not of the area objective.</td><td>Use grad A=(y,x) and grad g=(1,1), keeping the objective and constraint derivatives distinct.</td></tr><tr><td>Equation-formulation error</td><td>Constructing the complete multiplier system</td><td>Writing y=lambda and x=lambda but omitting x+y=10.</td><td>The two component equations express gradient alignment but do not determine which equal-sided rectangle satisfies the perimeter restriction.</td><td>Retain all three equations: y=lambda, x=lambda and x+y=10.</td></tr><tr><td>Algebraic error</td><td>Solving the simultaneous equations</td><td>Obtaining x=y=10 after establishing x=y and x+y=10.</td><td>Substituting x=y gives 2x=10, not x=10. The proposed dimensions also fail the constraint check because 10+10 is not 10.</td><td>Solve 2x=10 to obtain x=5 and y=5, then use either component equation to obtain lambda=5.</td></tr><tr><td>Interpretation error</td><td>Interpreting the candidate and claiming optimality</td><td>Claiming that (5,5) must be a global maximum solely because it satisfies the multiplier equations.</td><td>The multiplier equations are necessary first-order conditions at regular constrained local optima. They identify stationary candidates but do not, by themselves, establish global optimality.</td><td>Describe (5,5) initially as a feasible stationary candidate. Then use A(x,10-x)=25-(x-5)^2 to prove that the maximum area is 25 square units, attained uniquely at (5,5).</td></tr></tbody></table></div></article></div><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation" data-expository-closure="terminal"><p>The rectangle calculation shows how a geometric statement can become a practical method for constrained optimisation. We began with the objective A(x,y)=xy and the restriction x+y=10. At a regular constrained local optimum, the objective and constraint gradients satisfy the first-order relationship grad A=lambda grad g.</p><p>Writing out the gradients converted that vector relationship into scalar equations. Differentiating A=xy gave grad A=(y,x), while differentiating g=x+y gave grad g=(1,1). Their component equations were y=lambda and x=lambda. Retaining the perimeter equation x+y=10 completed the system.</p><p>The algebra then gave x=y=5 and lambda=5. Checking the perimeter and positivity conditions established feasibility. The resulting area was 25 square units. Finally, the identity A(x,10-x)=25-(x-5)^2 proved that no feasible rectangle could have a larger area.</p><p>Each stage answers a different mathematical question. The objective and constraint specify what is being optimised and which choices are permitted. Differentiation identifies the gradients. The multiplier equations express their first-order relationship. Solving the complete system identifies candidate values. Feasibility checks determine whether those values satisfy the problem&#39;s restrictions. A separate argument establishes whether the candidate is actually optimal.</p><p>Understanding those roles also helps you diagnose mistakes. Suppose a calculation uses grad A=(1,1) for A=xy. That is a derivative error: the correct gradient is (y,x). Suppose the derivatives are correct but the system omits x+y=10. That is an equation-formulation error: the first-order relationship has been retained, but the constraint has been lost. Suppose the complete system is correct but the algebra does not give x=y=5. The difficulty is in solving the equations, not in the geometric method.</p><p>Other errors concern the meaning of the result. Choosing (6,6) because its area is 36 is a conceptual error about feasibility: it violates the fixed perimeter. Claiming that the multiplier equations alone prove a global maximum is an interpretation error: those equations identify a stationary candidate, while the completed-square argument supplies the proof. Treating lambda=5 as though it were the area would also confuse the multiplier with the objective value.</p><p>These distinctions provide a way to check your reasoning without relying only on whether the final numbers look plausible. If the mathematical model is wrong, correct algebra will not repair it. If the derivatives are wrong, the component equations will be wrong. If the constraint is missing, the solution may not be feasible. If the calculation identifies a candidate but no optimality argument is supplied, the final claim must remain appropriately qualified.</p><p>The method can now be expressed as one connected chain of reasoning. For a differentiable objective f(x,y) with smooth equality constraint g(x,y)=c, first identify the objective and constraint. Calculate grad f and grad g. At a regular constrained local optimum, where grad g is non-zero, use grad f=lambda grad g. Equate components to obtain f<em>x=lambda g</em>x and f<em>y=lambda g</em>y, and retain g(x,y)=c. Solve the resulting system, check all restrictions and interpret the solution as a candidate until optimality is justified.</p><p>This structure is not limited to rectangles. In &#39;Independent constrained optimisation&#39;, you will encounter a different objective and resource constraint. The same questions will guide your reasoning: what is being optimised, which choices are feasible, what are the gradients, which equations express their relationship, and what can legitimately be concluded from their solution?</p><p>The distinction between calculation and justification also supports the reasoning developed in &#39;What does the calculation prove?&#39; and &#39;Diagnosing mathematical claims&#39;. Those resources examine how mathematical claims depend on the conditions that support them.</p><p>The central connection is now complete. Geometry explains why gradients are related at a regular constrained optimum. Component equations make that relationship solvable. The original constraint ensures that the candidate belongs to the permitted set. Algebra identifies the candidate, and further reasoning determines whether it is an optimum. The equations are useful precisely because their geometric meaning, mathematical assumptions and logical limits remain visible.</p></div></section></section></article></template><template id="lj-resource-c4"><article class="util-learner-page util-page util-learner-renderer-vnext util-page--expository" data-renderer="vnext" data-page-kind="expository" data-persistence-page-key="v1::c96731df-f429-49a1-839c-f99edaf37dfd::learner-page::2.0.0::no-activities::when-does-a-calculation-prove-a-maximum" data-persistence-storage-key="learner-renderer-vnext:draft:v1::c96731df-f429-49a1-839c-f99edaf37dfd::learner-page::2.0.0::no-activities::when-does-a-calculation-prove-a-maximum" data-composition-mode="moments" data-composed-activity-count="0" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">What does the calculation prove?</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="5"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="lj-c4--util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">A solution to the equations — but what has been established?</span><p class="util-journey-position" aria-label="Section 1 of 5"><span class="util-journey-position__visible" aria-hidden="true">1 of 5</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c4--exposition-S2" aria-label="Next section: From a candidate to a global proof"><span class="util-journey-adjacent__title">From a candidate to a global proof</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="lj-c4--util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c4--exposition-S1" aria-current="location">A solution to the equations — but what has been established?</a></li><li><a class="util-journey-all-link" href="#lj-c4--exposition-S2">From a candidate to a global proof</a></li><li><a class="util-journey-all-link" href="#lj-c4--exposition-S3">Why the multiplier equations are not enough</a></li><li><a class="util-journey-all-link" href="#lj-c4--exposition-S4">When an optimum does not satisfy the equations</a></li><li><a class="util-journey-all-link" href="#lj-c4--exposition-S5">What can we legitimately conclude?</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c4/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-exposition-sections" data-region="exposition"><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c4--exposition-S1" data-section-id="S1" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">A solution to the equations — but what has been established?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>In &#39;From geometry to the multiplier equations&#39;, you encountered a rectangle with perimeter 20 units and positive side lengths x and y. Its area is A(x,y)=xy, and the fixed-perimeter constraint can be written x+y=10.</p><p>If you completed that activity, revisit your own calculation of the gradients and multiplier equations. Look particularly at how you obtained the candidate (5,5). The question here is not whether you solved those equations correctly, but what their solution allows you to conclude.</p><p>Using g(x,y)=x+y, the gradients are ∇A=(y,x) and ∇g=(1,1). At (5,5), they satisfy ∇A=(5,5)=5(1,1)=5∇g, so the multiplier is λ=5. The candidate also satisfies the constraint: 5+5=10. Its area is 25 square units.</p><p>These calculations establish two facts. First, (5,5) is feasible: it represents a rectangle permitted by the perimeter constraint. Second, it satisfies the first-order multiplier equations. Neither fact, by itself, compares its area with the area of every other feasible rectangle.</p><p>For example, (6,6) gives an area of 36, larger than 25. But 6+6=12, so that rectangle does not satisfy the constraint. It cannot challenge a claim about the largest area among rectangles with perimeter 20.</p><p>The multiplier calculation has therefore identified a feasible stationary candidate. To call it a maximum, we still need an argument about the areas of other feasible rectangles.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c4--exposition-S2" data-section-id="S2" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">From a candidate to a global proof</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The perimeter constraint lets us express one side length in terms of the other:</p><p>y=10−x.</p><p>Because both side lengths must be positive, the feasible values satisfy 0&lt;x&lt;10. Substituting into the area function gives</p><p>A(x,10−x)=x(10−x)=10x−x².</p><p>The same expression can be written as</p><p>A(x,10−x)=25−(x−5)².</p><p>This identity supplies something the multiplier equations did not: a bound on the area of every feasible rectangle.</p><p>A square cannot be negative, so (x−5)²≥0. Subtracting it from 25 can never produce a value greater than 25. Consequently,</p><p>A(x,10−x)=25−(x−5)²≤25.</p><p>The inequality holds for every feasible x, not just for the candidate identified by the multiplier equations. Equality occurs exactly when (x−5)²=0, which requires x=5. The constraint then gives y=5. Since (5,5) is feasible and achieves the bound, it is the unique global maximum, with area 25 square units.</p><p>Compare this proof with checking a few rectangles. The feasible choices (2,8), (4,6) and (5,5) have areas 16, 24 and 25 respectively. Those values suggest that (5,5) is promising, but they do not rule out another feasible rectangle with a larger area. The identity 25−(x−5)² does rule that out, because it describes the area across the entire feasible set.</p><p>This also clarifies the distinction between local and global optimality. A local maximum has an objective value at least as large as those of sufficiently nearby feasible points. A global maximum has an objective value at least as large as those of every feasible point. The squared-expression argument proves the stronger, global claim.</p><p>We now have two different kinds of mathematical result for the same rectangle. The multiplier equations identify (5,5) as a candidate; the inequality proves that it is the unique global maximum. Their conclusions should not be confused.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c4--exposition-S3" data-section-id="S3" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Why the multiplier equations are not enough</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The rectangle shows that a multiplier candidate can be a genuine optimum. It does not show that every multiplier candidate must be one.</p><p>For a differentiable objective f(x,y) subject to a smooth equality constraint g(x,y)=c, the standard Lagrange multiplier theorem says that, at a constrained local maximum or minimum where ∇g is non-zero, there is a scalar λ such that</p><p>∇f=λ∇g, together with g(x,y)=c.</p><p>This is a necessary first-order condition. In ordinary language: if a point is a regular constrained local optimum, then it must satisfy the multiplier equations. The theorem does not say that if a point satisfies the equations, it must be an optimum. That would reverse the direction of the claim.</p><p>Consider a different objective:</p><p>f(x,y)=x³, subject to y=0.</p><p>The feasible points lie on the horizontal line y=0. With g(x,y)=y, the constraint gradient is ∇g=(0,1), which is non-zero everywhere. The constraint is therefore regular at the point we will examine.</p><p>At (0,0), the objective gradient is ∇f=(3x²,0)=(0,0). The multiplier equation holds with λ=0, because</p><p>(0,0)=0(0,1).</p><p>So (0,0) is a feasible stationary candidate, and the regularity assumption is satisfied. Does that make it a local maximum or minimum?</p><p>Along the feasible line, the objective is simply f(x,0)=x³. For negative x close to zero, x³ is negative; for positive x close to zero, x³ is positive. Both kinds of feasible point can be found arbitrarily near (0,0), where the objective value is zero.</p><p>There are therefore feasible values both smaller and larger than f(0,0). The origin is neither a local maximum nor a local minimum.</p><p>The equations have worked exactly as written, yet they have not identified an optimum. This is a direct demonstration that the first-order condition is not sufficient.</p><p>There is also a geometric qualification. In &#39;Seeing gradients and tangency&#39;, parallel gradients were connected with tangency between level curves. That interpretation applies when the relevant level curves are regular. Here the objective gradient is zero at the candidate. Although ∇f=λ∇g holds with λ=0, the objective level curve does not have the regular tangent required for the usual tangency picture. The algebraic multiplier condition should not be interpreted as a guarantee of ordinary level-curve tangency in this case.</p><p>The valid conclusion is narrower: every regular constrained local optimum must satisfy the first-order equations, but some points satisfying those equations are not optima.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c4--exposition-S4" data-section-id="S4" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">When an optimum does not satisfy the equations</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The x³ example showed that satisfying the multiplier equations does not guarantee an optimum. A different limitation appears when an optimum exists but the standard equations cannot be satisfied.</p><p>Consider</p><p>f(x,y)=x, subject to x²+y²=0.</p><p>Both x² and y² are non-negative. Their sum can equal zero only if x=0 and y=0. The entire feasible set therefore consists of the single point (0,0).</p><p>This point is both a global maximum and a global minimum relative to the feasible set. There is no other feasible point with a larger objective value, and no other feasible point with a smaller one. The conclusion may seem unusual, but it follows directly from what global optimality means when there is only one permitted point.</p><p>Now examine the multiplier equations. For g(x,y)=x²+y²,</p><p>∇g=(2x,2y), so ∇g(0,0)=(0,0).</p><p>The objective gradient is</p><p>∇f=(1,0).</p><p>At the only feasible point, the multiplier equation would require</p><p>(1,0)=λ(0,0).</p><p>No value of λ can satisfy this equation: multiplying the zero vector by any scalar still gives the zero vector.</p><p>Does that contradict the statement that a constrained optimum must satisfy the multiplier equations? No. The standard theorem requires ∇g≠(0,0) at the optimum. Here that assumption fails. The point is singular with respect to the stated constraint, so the regularity-dependent theorem does not apply.</p><p>Examples B and C reveal different logical limits. In Example B, the constraint is regular and the equations hold, but there is no local optimum. In Example C, an optimum exists, but the constraint is singular and no multiplier satisfies the equations. Neither case invalidates the standard theorem. Each shows why its conclusion must be read together with its assumptions and why the equations cannot be treated as an unconditional test for optimality.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c4--exposition-S5" data-section-id="S5" data-expository-section-role="terminal-close" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">What can we legitimately conclude?</span></h2><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-S5-01" data-material-kind="accessible_comparative_matrix" data-material-type="expository_structured_table" data-section-id="S5" data-expository-structured="table"><h3>Three examples: what the multiplier equations establish</h3><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Example and point</th><th scope="col">Feasibility</th><th scope="col">Constraint regularity</th><th scope="col">Multiplier condition</th><th scope="col">Optimality conclusion</th></tr></thead><tbody><tr><td>Example A — Fixed-perimeter rectangle. A(x,y)=xy, subject to x+y=10, with x&gt;0 and y&gt;0. Point: (5,5).</td><td>Yes. Both side lengths are positive and 5+5=10.</td><td>Regular. For g(x,y)=x+y, ∇g=(1,1), which is non-zero.</td><td>Satisfied. ∇A(5,5)=(5,5)=5∇g, so λ=5.</td><td>Unique global maximum of 25 square units. This is established by the separate proof A(x,10−x)=25−(x−5)²≤25, with equality only at x=5.</td></tr><tr><td>Example B — Cubic objective. f(x,y)=x³, subject to y=0. Point: (0,0).</td><td>Yes. The point satisfies y=0.</td><td>Regular. For g(x,y)=y, ∇g=(0,1), which is non-zero.</td><td>Satisfied. ∇f(0,0)=(0,0)=0∇g, so λ=0.</td><td>Neither a local maximum nor a local minimum. Along the feasible line, x³ takes both negative and positive values arbitrarily close to zero.</td></tr><tr><td>Example C — Singular constraint. f(x,y)=x, subject to x²+y²=0. Point: (0,0).</td><td>Yes. It is the only feasible point because x²+y²=0 requires x=0 and y=0.</td><td>Singular. For g(x,y)=x²+y², ∇g(0,0)=(0,0).</td><td>Not satisfied. ∇f(0,0)=(1,0), and no λ can make (1,0)=λ(0,0).</td><td>Both a global maximum and a global minimum relative to the singleton feasible set. The standard multiplier theorem does not apply because the constraint gradient vanishes.</td></tr></tbody></table></div></article></div><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation" data-expository-closure="terminal"><p>The three examples establish why a multiplier calculation must be interpreted in context. In the rectangle problem, the equations identify a feasible candidate, and a separate inequality proves a unique global maximum. For f(x,y)=x³ subject to y=0, the equations hold at a regular point that is not an optimum. For f(x,y)=x subject to x²+y²=0, the only feasible point is an optimum, but the constraint is singular and the standard multiplier equations cannot hold.</p><p>Four distinctions help organise these conclusions.</p><p>Feasibility asks whether a point satisfies the constraints. Stationarity asks whether it satisfies the first-order equations. Regularity asks whether the constraint gradient is non-zero, as required by the standard theorem. Optimality asks whether the objective value is largest or smallest among the relevant feasible points. These questions are related, but answering one does not automatically answer the others.</p><p>The scope of an optimality claim also matters. A local maximum or minimum concerns sufficiently nearby feasible points. A global maximum or minimum concerns the entire feasible set. The rectangle&#39;s identity A(x,10−x)=25−(x−5)² proves a global result because it bounds the area everywhere in the feasible domain. The x³ example fails even the weaker local test because nearby feasible points have objective values both above and below zero.</p><p>The numerical multiplier itself also requires care. In the rectangle problem, writing the constraint as g=x+y with g=10 gives λ=5 a
