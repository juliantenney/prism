rol" href="#lj-c2--learner-check-a2" data-check-sidebar-open aria-controls="lj-c2--learner-check-a2" aria-expanded="false" aria-label="Check your work: Predict gradients and tangents">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c2--learner-check-a2" data-composition-moment="check" data-activity-id="A2" data-check-sidebar="available" aria-labelledby="lj-c2--learner-check-a2-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c2--learner-check-a2-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c2--learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c2--learner-task-a2">Back to your task (Predict gradients and tangents)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M5" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m5" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m5-c-0" data-revision-criterion-id="a2-m5-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you differentiated the area function with respect to each variable correctly?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An incorrect component changes the gradient direction and undermines the subsequent geometric comparison.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The derivative with respect to x treats y as constant.</li><li><span class="util-guided-review__feature-key">B.</span> The derivative with respect to y treats x as constant.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Rework the x-partial derivative by varying only x in the product xy.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Rework the y-partial derivative independently, then place both components in the correct coordinate order.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a2-a2-m5-item-0" data-checklist-item-id="checklist-a2-a2-m5-item-0"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a2-a2-m5-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m5-c-1" data-revision-criterion-id="a2-m5-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you evaluated the gradient at the supplied coordinate point?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The general gradient formula must be evaluated locally before its direction can be compared with the particular tangent.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response substitutes both coordinates from Q into the gradient expression.</li><li><span class="util-guided-review__feature-key">B.</span> The resulting vector is interpreted using labelled coordinate directions.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Write the general gradient first, then substitute the point&#39;s x and y values into their corresponding positions.</li><li><span class="util-guided-review__feature-key">Missing B:</span> State what the signs and relative sizes of the vector components imply for right-left and up-down movement.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a2-a2-m5-item-1" data-checklist-item-id="checklist-a2-a2-m5-item-1"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a2-a2-m5-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m5-c-2" data-revision-criterion-id="a2-m5-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you distinguished the area-level tangent from the gradient?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confusing tangent and normal directions reverses the relationship between constant-area movement and local increase.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> A tangent direction is consistent with the supplied line slope.</li><li><span class="util-guided-review__feature-key">B.</span> The explanation assigns constant-area movement and increasing-area direction to their appropriate vectors.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Use the line equation to obtain a rise and run for a direction along the line.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Describe separately what moving along the level curve does and what the gradient represents.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a2-a2-m5-item-2" data-checklist-item-id="checklist-a2-a2-m5-item-2"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a2-a2-m5-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m5-c-3" data-revision-criterion-id="a2-m5-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you justified perpendicularity mathematically and stated its regularity condition?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A geometric impression alone does not establish orthogonality, and the normal interpretation depends on a non-zero gradient.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response includes a dot product or equivalent orthogonality calculation.</li><li><span class="util-guided-review__feature-key">B.</span> The explanation recognises the role of a non-zero gradient at a regular level-curve point.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Multiply corresponding components of the two vectors and add the products to test perpendicularity.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Qualify your normal-direction statement by identifying the condition under which the level curve has the required regular local geometry.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a2-a2-m5-item-3" data-checklist-item-id="checklist-a2-a2-m5-item-3"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a2-a2-m5-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Review the example response</summary><div class="util-composition-reveal__body"><article class="util-material-block util-sample-output util-prose-measure" data-material-id="A2-M4" data-material-type="sample_output" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></span><span class="util-semantic-icon__label">Feedback: A gradient and its level-curve tangent</span></p><h3 class="util-md-heading util-md-heading--source-3">Reveal after completing your calculation and explanation</h3><p>For \(A(x,y)=xy\), differentiation gives</p><p>\[\frac{\partial A}{\partial x}=y,\qquad \frac{\partial A}{\partial y}=x.\]</p><p>Therefore</p><p>\[\nabla A=(y,x).\]</p><p>At \(Q=(4,6)\),</p><p>\[\nabla A(4,6)=(6,4).\]</p><p>The gradient points right and upwards. Its exact direction is not the same as the candidate displacement \((1,1)\), although that candidate has the same general orientation.</p><p>The supplied tangent line has slope \(-3/2\), so one tangent vector is \(\mathbf{t}=(2,-3)\). Their dot product is</p><p>\[(6,4)\cdot(2,-3)=12-12=0.\]</p><p>Thus the gradient is perpendicular to the tangent of the regular area level curve \(xy=24\). The tangent represents local movement preserving area to first order, whereas the gradient indicates greatest unrestricted local increase.</p><p><strong>Do not confuse two different tangents.</strong> The area-level tangent at Q has direction \((2,-3)\). The fixed-perimeter line \(x+y=10\) has tangent direction \((1,-1)\). The two lines describe different restrictions on movement and need not have the same tangent direction.</p><h3 class="util-md-heading util-md-heading--source-3">Debrief</h3><p>If your prediction relied only on the shape of the curve, compare it with the calculated vector. A useful explanation identifies both the geometric relationship and the derivative calculation that supports it.</p></article></div></details></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c2--activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Test feasible directions</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The gradient-level-curve relationship established how to distinguish normal and tangent directions. Apply that distinction to the constraint itself, then compare objective change along its feasible tangent at two different rectangles.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>A direction can increase area without preserving the perimeter. Compare local feasible movement at two points on the fixed-perimeter line and determine what the gradient reveals about possible first-order improvement.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Use the constraint gradient to establish a feasible tangent direction. Predict the sign of local area change at each supplied point before calculating directional derivatives. Interpret the results in terms of first-order feasible improvement rather than assuming that stationarity proves an optimum.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Explain why the constraint gradient determines permissible tangent movement and how the objective gradient determines the first-order area change along that movement. If your prediction differed from your calculation, identify the evidence and explain your revised interpretation.</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A3"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A3-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Tracing first-order change along a feasible path</span></p><p>Consider a separate illustrative investigation: maximise or increase the differentiable quantity \(F(u,v)=u^2+v\) while remaining on the regular line \(h(u,v)=u+v=6\). We inspect the feasible point \((2,4)\) to see how a local direction can be tested.</p><p>Differentiating the constraint gives \(\nabla h=(1,1)\), a non-zero normal vector. A movement with direction \(\mathbf{t}=(1,-1)\) is tangent to the line because</p><p>\[\nabla h\cdot\mathbf{t}=(1,1)\cdot(1,-1)=0.\]</p><p>This means a small increase in \(u\), balanced by the same decrease in \(v\), preserves the equality. The objective gradient is \(\nabla F=(2u,1)\), which at \((2,4)\) becomes \((4,1)\). Combining this local gradient with the already established feasible tangent gives</p><p>\[\nabla F(2,4)\cdot\mathbf{t}=(4,1)\cdot(1,-1)=3.\]</p><p>The positive result means the objective increases to first order for a small positive movement in this parameter direction. Reversing the direction reverses the sign. A negative result would indicate first-order decrease in the chosen direction. A zero result would indicate no first-order change along that tangent, but it would not by itself prove a local maximum: second-order behaviour or other arguments would still matter.</p><p>The calculation has a connected logic. The constraint determines the tangent; the objective gradient determines the local rate of change; their dot product determines the first-order effect of that <strong>feasible</strong> movement. Apply this same reasoning to the two different points in your rectangle scenario.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c2--learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="lj-c2--learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="lj-c2--learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c2--learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c2--learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="lj-c2--learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c2--learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect the two supplied feasible points and predict whether movement increasing x while decreasing y by the same amount will locally increase, decrease or leave area unchanged to first order.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A3-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated comparison: Moving along the perimeter line</span></p><h3 class="util-md-heading util-md-heading--source-3">Simulated mathematical scenario</h3><p>A rectangle has positive side lengths \(x\) and \(y\), area</p><p>\[A(x,y)=xy,\]</p><p>and fixed-perimeter constraint</p><p>\[g(x,y)=x+y=10,\qquad x&gt;0,\quad y&gt;0.\]</p><p>Compare two labelled points on the feasible line:</p><ul><li>Point Q: \((4,6)\).</li><li>Point R: \((5,5)\).</li></ul><p>At either point, consider a small movement that <strong>increases \(x\) by an amount \(h\)</strong> and <strong>decreases \(y\) by the same amount \(h\)</strong>. Its displacement is \((h,-h)\), where \(h\) is small enough that both side lengths remain positive. The associated path velocity, using \(h\) as parameter, is \((1,-1)\).</p><p><strong>Accessible geometric description:</strong> On axes with \(x\) increasing rightwards and \(y\) upwards, the feasible line slopes downwards. The proposed movement travels right and down along that line. Point Q is left of and above point R.</p><p>Before calculating, predict the first-order effect on area of this movement at Q and at R. Then compare the objective gradient with the direction of permitted movement. Do not assume that the effect must be identical at both points merely because the same constraint applies.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Calculate the constraint gradient and identify a feasible tangent direction.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a3-a3-m3" data-material-source-id="A3-M3" data-activity-id="A3"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A3-M3" data-material-type="analysis_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focu 286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"></path></svg></span><span class="util-semantic-icon__label">Explain feasible improvement and stationarity</span></p><p>Write approximately 100–150 words comparing the two points.</p><p>Explain how the constraint gradient identifies the normal to the feasible line and how your chosen tangent preserves the perimeter. Then explain how the objective gradient and directional dot product determine whether the specified movement increases area to first order at each point.</p><p>Your explanation must distinguish a point with an available first-order improving direction from a point with zero first-order change along the feasible tangent. Finish by explaining why a zero result alone does not prove a maximum.</p><p><strong>Your comparative explanation:</strong></p><p><strong>Calculation that most strongly supports your interpretation:</strong></p><p><strong>What remains unproved by a zero directional derivative:</strong></p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Review feedback and refine your explanation where necessary.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A structured comparison containing an identified feasible tangent, the relevant gradient and dot-product calculations at both supplied points, and a justified interpretation of the resulting first-order changes. The explanation distinguishes an available feasible improving direction from first-order feasible stationarity and avoids treating stationarity alone as proof of optimality.</p></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-task-step-step-5-5" data-response-part-id="A3-task-step-step-5-5"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a3-a3-task-step-step-5-5-label" for="lj-c2--learner-workspace-a3-a3-task-step-step-5-5">Your response</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a3-a3-task-step-step-5-5-desc">Review feedback and refine your explanation where necessary.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a3-a3-task-step-step-5-5" name="learner-workspace-a3-a3-task-step-step-5-5" rows="6" aria-describedby="lj-c2--learner-workspace-a3-a3-task-step-step-5-5-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c2--learner-check-a3" data-check-sidebar-open aria-controls="lj-c2--learner-check-a3" aria-expanded="false" aria-label="Check your work: Test feasible directions">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c2--learner-check-a3" data-composition-moment="check" data-activity-id="A3" data-check-sidebar="available" aria-labelledby="lj-c2--learner-check-a3-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c2--learner-check-a3-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c2--learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c2--learner-task-a3">Back to your task (Test feasible directions)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M6" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m6" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m6-c-0" data-revision-criterion-id="a3-m6-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you identified a feasible tangent from the constraint gradient?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An objective-change calculation is relevant to constrained optimisation only when its direction respects the equality constraint.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The constraint gradient is obtained from the stated equality.</li><li><span class="util-guided-review__feature-key">B.</span> The proposed tangent is tested against the constraint normal.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Differentiate the constraint with respect to each coordinate and record the resulting normal vector.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Calculate their dot product and explain how the result relates to preservation of the fixed sum.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a3-a3-m6-item-0" data-checklist-item-id="checklist-a3-a3-m6-item-0"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a3-a3-m6-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m6-c-1" data-revision-criterion-id="a3-m6-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you calculated the objective&#39;s first-order change at both points?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The two points must be compared using local derivatives rather than their areas alone.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The objective gradient is evaluated separately at each point.</li><li><span class="util-guided-review__feature-key">B.</span> Each row includes a dot product with the same feasible tangent.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Substitute each coordinate pair into the gradient formula before calculating its directional change.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Use the stated movement direction in both calculations so that the comparison refers to the same type of movement.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a3-a3-m6-item-1" data-checklist-item-id="checklist-a3-a3-m6-item-1"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a3-a3-m6-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m6-c-2" data-revision-criterion-id="a3-m6-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you interpreted the sign of each directional derivative in relation to the specified movement?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The sign determines whether that particular feasible movement offers a first-order increase, decrease or stationary result.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> A non-zero result is connected to increase or decrease in the stated direction.</li><li><span class="util-guided-review__feature-key">B.</span> A zero result is interpreted as absence of first-order change, not absence of all possible change.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Relate the sign of the dot product to a small positive change in the movement parameter.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Distinguish the linear approximation from the actual area change that may appear at higher order.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a3-a3-m6-item-2" data-checklist-item-id="checklist-a3-a3-m6-item-2"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a3-a3-m6-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m6-c-3" data-revision-criterion-id="a3-m6-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Does your conclusion distinguish stationarity from a proven optimum?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A necessary first-order condition does not establish whether a candidate is a maximum, minimum or neither.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The explanation identifies which result rules out a local maximum through an improving feasible direction.</li><li><span class="util-guided-review__feature-key">B.</span> The explanation identifies additional reasoning needed to establish a maximum at a stationary point.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Connect the direction with positive first-order change to the local-optimality claim it contradicts.</li><li><span class="util-guided-review__feature-key">Missing B:</span> State that the objective&#39;s behaviour along the feasible set must be examined beyond its first derivative.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a3-a3-m6-item-3" data-checklist-item-id="checklist-a3-a3-m6-item-3"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a3-a3-m6-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Review the example response</summary><div class="util-composition-reveal__body"><article class="util-material-block util-sample-output util-prose-measure" data-material-id="A3-M5" data-material-type="sample_output" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></span><span class="util-semantic-icon__label">Feedback: Comparing feasible directional derivatives</span></p><h3 class="util-md-heading util-md-heading--source-3">Reveal after completing your comparison</h3><p>The constraint gradient is</p><p>\[\nabla g=(1,1).\]</p><p>The movement direction \(\mathbf{t}=(1,-1)\) is feasible to first order because</p><p>\[\nabla g\cdot\mathbf{t}=1-1=0.\]</p><p>For this linear constraint, small movements in that direction actually preserve the equality exactly, provided the side lengths remain positive.</p><p>The area gradient is \(\nabla A=(y,x)\).</p><p>At \((4,6)\),</p><p>\[\nabla A=(6,4),\qquad \nabla A\cdot\mathbf{t}=6-4=2.\]</p><p>The positive value means that moving a small amount in the specified direction increases area to first order. The current point therefore cannot be a constrained local maximum in the interior of this feasible line.</p><p>At \((5,5)\),</p><p>\[\nabla A=(5,5),\qquad \nabla A\cdot\mathbf{t}=5-5=0.\]</p><p>Here the first-order change along the feasible tangent is zero. The reverse tangent also gives zero, so there is no first-order feasible increase in either tangent direction. This is <strong>first-order stationarity</strong>, not a stand-alone proof of a maximum.</p><p>For the particular rectangle problem, the separate identity \(A(x,10-x)=25-(x-5)^2\) proves the global maximum at \((5,5)\). That proof relies on the form of the area function along the entire feasible line, not merely on a zero directional derivative.</p><h3 class="util-md-heading util-md-heading--source-3">Debrief</h3><p>Revisit any prediction that treated a zero first-order change as automatically sufficient for optimality. Your calculation identifies local stationarity; the global claim requires additional reasoning.</p></article></div></details></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c2--activity-A4" data-journey-section="true" data-activity-id="A4" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Explain parallel gradients</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A4"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The feasible-direction comparison established how zero first-order change relates to the constraint tangent. Use that result to explain why the objective and constraint normals are parallel, then transfer the principle from interpreting a diagram to judging a mathematical statement.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Bring the geometry together. Use the rectangle to explain why objective and constraint gradients become parallel at a regular constrained optimum, then apply the same reasoning to a different mathematical claim without assuming that the first-order condition proves optimality.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Build the explanation from feasible tangent movement to perpendicular gradients and scalar proportionality. Distinguish geometric stationarity from a proof of optimality. Apply the resulting reasoning to a short, differently framed claim about gradient direction.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Explain the chain from feasible movement to the multiplier equation in your own words. Then explain what additional reasoning would be needed before describing a stationary candidate as a proven maximum.</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A4"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Review the post-attempt mathematical feedback and check the scope and precision of both explanations.</p></span></div></div><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A4-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">From feasible tangency to the multiplier condition</span></p><p>Suppose a differentiable objective \(f(x,y)\) is optimised locally subject to a differentiable equality constraint \(g(x,y)=c\), at a point where \(\nabla g\ne\mathbf{0}\). The non-zero constraint gradient is normal to the regular feasible curve. Any tangent direction \(\mathbf{t}\) therefore satisfies</p><p>\[\nabla g\cdot\mathbf{t}=0.\]</p><p>At an interior constrained local maximum or minimum, movement along the feasible curve cannot produce a non-zero first-order change in the objective: if it did, one of the two tangent directions would locally improve the value in a way inconsistent with that extremum. Consequently,</p><p>\[\nabla f\cdot\mathbf{t}=0.\]</p><p>The objective gradient and constraint gradient are thus both perpendicular to the same non-zero tangent direction. In two dimensions, all vectors perpendicular to a given non-zero tangent lie on the same normal line. They are scalar multiples, giving</p><p>\[\nabla f=\lambda\nabla g.\]</p><p>The scalar \(\lambda\) is the Lagrange multiplier. Its sign and magnitude depend on the objective and the chosen representation of the constraint. A positive multiplier corresponds to gradients in the same direction; a negative multiplier corresponds to opposite directions; and a zero multiplier is possible when the objective gradient is zero. In that last case, the objective need not have a regular level-curve tangent even though the constraint remains regular.</p><p>The relationship must be considered together with the constraint equation \(g(x,y)=c\). These are <strong>necessary first-order conditions</strong> for a regular constrained local optimum, not sufficient conditions. A solution of the equations is a stationary candidate whose actual optimality must be established by further reasoning.</p><p>This geometric interpretation prepares the transition to <strong>From geometry to the multiplier equations</strong>, where the same relationships become a systematic method for finding candidates.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c2--learner-task-a4" data-composition-moment="do" data-activity-id="A4" aria-labelledby="lj-c2--learner-task-a4-heading"><h3 class="util-composition-moment-heading" id="lj-c2--learner-task-a4-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c2--learner-revision-reminder-a4" hidden data-revision-reminder="true" data-activity-id="A4" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c2--learner-revision-guidance-a4" hidden data-revision-guidance="true" data-activity-id="A4" aria-labelledby="lj-c2--learner-revision-guidance-a4-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c2--learner-revision-guidance-a4-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Use the established rectangle geometry to explain why zero first-order change along the feasible tangent leads to parallel objective and constraint gradients when the constraint is regular.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Independent explanation and multiplier workspace</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Express the relationship using \(\nabla f=\lambda\nabla g\) and the constraint equation, identify the multiplier for the canonical rectangle representation, and explain why the equations alone do not prove an optimum.</p></span></div><article class="util-prompt-set util-prose-measure" data-material-id="A4-M6" data-material-type="prompt_set" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-prompt-set-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"></path></svg></span><span class="util-semantic-icon__label">Your explanation of the candidate claim</span></p><p>Address your response directly to the learner who wrote the claim in the separate task card.</p><p><strong>Interpretation of Pair I:</strong></p><p><strong>Interpretation of Pair II:</strong></p><p><strong>Explanation of the claim and the sign of proportionality:</strong></p><p>Aim for a concise explanation that another learner could use to interpret gradient arrows in a diagram. Support the explanation with both numerical pairs. Do not introduce a claim about an optimum.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect a separate mathematical claim about the direction of parallel gradients and produce a short explanation for a learner who is interpreting that claim.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A4-M1" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Simulated rectangle: Establishing the gradient relationship</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-3">Simulated mathematical task</h3><p>Return to the rectangle with positive side lengths and fixed perimeter 20 units.</p><p>The objective and constraint are</p><p>\[A(x,y)=xy,\qquad g(x,y)=x+y=10,\qquad x&gt;0,\quad y&gt;0.\]</p><p>Inspect the feasible point</p><p>\[(x,y)=(5,5).\]</p><p>The gradient expressions established earlier are</p><p>\[\nabla A=(y,x),\qquad \nabla g=(1,1).\]</p><p>A tangent direction to the feasible line is</p><p>\[\mathbf{t}=(1,-1).\]</p><p>Use these particulars to explain why first-order stationarity along the feasible line leads to a scalar relationship between the objective and constraint gradients. Evaluate the gradients at the supplied point and determine the scalar \(\lambda\) in</p><p>\[\nabla A=\lambda\nabla g.\]</p><p>The constraint could also be written as \(2x+2y=20\). That equation represents the same feasible line, but its gradient is defined by a differently scaled expression. Keep this distinction in mind when interpreting the multiplier.</p><p>Do not treat the multiplier equation alone as proof of a maximum. Record the reasoning and calculation in the structured workspace before viewing the feedback.</p></article></li></ol></article><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A4-M5" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Simulated candidate claim: Do parallel arrows agree?</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-3">Simulated mathematical claim for interpretation</h3><p>A learner proposes the following statement:</p><p>&gt; If two non-zero gradients are parallel, their arrows must point in the same direction.</p><p>The general proportionality relationship is</p><p>\[\mathbf{u}=\lambda\mathbf{v},\qquad \mathbf{v}\ne\mathbf{0}.\]</p><p>Inspect these two pairs of non-zero vectors:</p><table><thead><tr><th>Pair</th><th>Vector \(\mathbf{u}\)</th><th>Vector \(\mathbf{v}\)</th></tr></thead><tbody><tr><td>I</td><td>\((2,2)\)</td><td>\((1,1)\)</td></tr><tr><td>II</td><td>\((-2,-2)\)</td><td>\((1,1)\)</td></tr></tbody></table><p>The components describe horizontal and vertical directions, respectively: positive components point right or up; negative components point left or down.</p><p>For each pair, determine whether one vector is a scalar multiple of the other and consider the direction of the corresponding arrows. The quoted sentence is a <strong>candidate claim to evaluate</strong>, not a mathematical rule supplied as correct.</p></article></li></ol></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A coherent explanation linking the feasible tangent, zero first-order objective change, parallel normal vectors and the multiplier relationship under the non-zero constraint-gradient condition. The learner identifies the canonical multiplier through the established rectangle gradients, distinguishes necessary first-order stationarity from sufficient proof, and produces a separate justified interpretation of a changed claim about gradient direction. The transfer explanation must use the sign of scalar proportionality and avoid claiming that parallel vectors must point in the same direction.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-feasible-tangent-reasoning-1" data-response-part-id="A4-template-section-a4-m3-section-feasible-tangent-reasoning-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m3-section-feasible-tangent-reasoning-1-label" for="lj-c2--learner-workspace-a4-a4-template-section-a4-m3-section-feasible-tangent-reasoning-1">Feasible tangent reasoning</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m3-section-feasible-tangent-reasoning-1-desc">Record your response for Feasible tangent reasoning.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m3-section-feasible-tangent-reasoning-1" name="learner-workspace-a4-a4-template-section-a4-m3-section-feasible-tangent-reasoning-1" rows="6" aria-describedby="lj-c2--learner-workspace-a4-a4-template-section-a4-m3-section-feasible-tangent-reasoning-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure util-learner-workspace--math-entry" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-gradient-relationship-2" data-response-part-id="A4-template-section-a4-m3-section-gradient-relationship-2" data-input-modality="math" data-math-entry="true" data-math-field-id="lj-c2--learner-workspace-a4-a4-template-section-a4-m3-section-gradient-relationship-2" data-math-label-id="lj-c2--learner-workspace-a4-a4-template-section-a4-m3-section-gradient-relat
