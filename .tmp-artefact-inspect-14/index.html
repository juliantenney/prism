1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg></span><span class="util-semantic-icon__label">Study tips</span></h2><div class="util-study-tips__content util-prose-measure"><ul><li><strong>Evidence to comparison:</strong> Use original observations accurately, recognise their limitations and compare the consequences of all three available actions against shared criteria.</li><li><strong>Comparison to judgement:</strong> Make your priorities explicit, explain why one provisional action is preferable to both alternatives, and acknowledge the trade-offs you accept.</li><li><strong>Judgement under uncertainty:</strong> Distinguish evidence from assumptions, identify unresolved questions and express confidence in proportion to the strength of your reasoning.</li><li><strong>Retain your reasoning:</strong> Keep an accessible copy of the original recommendation, justification, assumptions and confidence so that you can reconsider it meaningfully in c4.</li></ul></div></aside><style id="prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="true"]{display:block;position:fixed;top:var(--learner-sticky-nav-height,0px);left:0;right:0;z-index:40;margin:0 auto;max-width:42rem;width:calc(100% - 1.5rem);padding:.45rem .75rem;border:1px solid #cbd5e1;border-left:3px solid #64748b;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.12)}.util-learner-renderer-vnext .util-revision-reminder__chrome{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.35rem .75rem;margin:0 0 .2rem}.util-learner-renderer-vnext .util-revision-reminder__label{margin:0;font-size:.75rem;font-weight:650;color:#64748b}.util-learner-renderer-vnext .util-revision-reminder__statement{margin:0;font-size:.9rem;line-height:1.4;font-weight:600;color:#0f172a}.util-learner-renderer-vnext .util-revision-reminder__view{font:inherit;font-size:.9rem;color:#1d4ed8;background:transparent;border:0;padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer}.util-learner-renderer-vnext .util-revision-reminder__view:focus{outline:2px solid #2563eb;outline-offset:2px}</style></article></template><template id="lj-resource-c4"><article class="util-learner-page util-page util-learner-renderer-vnext" data-renderer="vnext" data-page-kind="interactive" data-persistence-page-key="v1::e7d0b4f1-779f-44b4-9992-c223208da30f::learner-page::2.0.0::a1-a2-a3-a4::when-new-evidence-changes-the-picture" data-persistence-storage-key="learner-renderer-vnext:draft:v1::e7d0b4f1-779f-44b4-9992-c223208da30f::learner-page::2.0.0::a1-a2-a3-a4::when-new-evidence-changes-the-picture" data-composition-mode="moments" data-composed-activity-count="4" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Reconsidering a Provisional Decision</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="6"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 6"><span class="util-journey-position__visible" aria-hidden="true">1 of 6</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#activity-A1" aria-label="Next section: Revisit Your Original Reasoning"><span class="util-journey-adjacent__title">Revisit Your Original Reasoning</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#activity-A1">Revisit Your Original Reasoning</a></li><li><a class="util-journey-all-link" href="#activity-A2">Reassess the Three Library Options</a></li><li><a class="util-journey-all-link" href="#activity-A3">Defend Your Reconsidered Judgement</a></li><li><a class="util-journey-all-link" href="#activity-A4">Define Conditions for Future Revision</a></li><li><a class="util-journey-all-link" href="#journey-study-tips">Study tips</a></li></ul></div></div></nav><section class="util-page-orientation" data-region="orientation"><div id="journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>This self-study resource builds on the provisional library recommendation you recorded in c3. Retrieve that recommendation and its justification before beginning. You will examine subsequent evidence, compare the three available options, reconsider your judgement and identify what further information could warrant another change. Work through the four activities in order, using your earlier responses as the basis for reconsideration.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>The activities progress from analysing the effects of new evidence on your original reasoning, through comparing the available alternatives, to defending a reconsidered recommendation and identifying conditions for future revision. Your original recommendation remains the reference point throughout. The final activity applies the same reasoning process to a different university decision.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><p>A <strong>provisional decision</strong> is a judgement supported by the evidence currently available but open to reconsideration when consequential information emerges. Reconsideration does not require a change of recommendation. It requires examining whether new findings strengthen, weaken, refine or leave unchanged the assumptions and interpretations supporting the original judgement.</p><p><strong>Evidence and inference are different.</strong> The library&#39;s voluntary survey received 240 responses from approximately 12,000 students, with 168 respondents supporting extended opening hours. Those responses establish what participating students reported, but possible self-selection limits generalisation to the whole student population. Historical building-access records showed relatively low late-evening occupancy under previous arrangements. A later review found that this occupancy was concentrated on particular high-demand dates. Both observations can be accurate; neither establishes how students would use the library under substantially extended hours.</p><p><strong>Different findings illuminate different considerations.</strong> Reports that late-evening users disproportionately experienced difficulty finding suitable study space elsewhere strengthen the relevance of access concerns for those users, without establishing how widespread the difficulty is across all students. Revised estimates indicate that targeted extensions would cost materially less than extending hours throughout the examination period. This informs the operational comparison but does not prove that targeted provision would meet future demand.</p><p><strong>Comparative judgement requires weighing alternatives.</strong> Option A maintains existing hours, Option B extends hours throughout the examination period, and Option C targets extensions to anticipated high-demand dates. Each involves potential benefits, limitations and trade-offs. The combined evidence can change their relative merits without identifying one necessarily correct option.</p><p><strong>Evidence-responsive reconsideration is proportionate.</strong> Maintaining, qualifying or revising an original recommendation can each be justified. Confirmation bias can arise when challenging evidence is selectively discounted; overreaction can arise when recent findings are treated as more decisive than their limitations permit. A defensible judgement considers both supporting and challenging evidence and distinguishes the preferred option from confidence in that preference.</p><p><strong>Uncertainty can be made actionable.</strong> A recommendation can remain defensible while important questions remain unresolved. Identifying a consequential uncertainty, the further evidence needed to address it and the plausible findings that could affect the recommendation or confidence establishes meaningful conditions for future revision.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-judgement-synthesis-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c4/knowledge-summary-after-content.png" alt="Concept map linking provisional judgement, combined evidence, reconsideration and future revision; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-page-judgement-synthesis-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption" id="figure-description-asset-vb-38-4-va-page-judgement-synthesis-01-page-page-knowledge-summary-after-content"><strong>Figure 1.</strong> The map begins with a provisional recommendation supported by original evidence, assumptions and uncertainty. Later occupancy, access and cost findings join the original evidence as grounds for comparing Options A, B and C. The comparison informs a reconsidered recommendation that may be maintained, qualified or revised. Confidence is represented separately from the selected option. Remaining uncertainty connects to further evidence and possible future reconsideration. The relationships are conditional: no finding automatically determines an option, and historical occupancy does not establish future demand under changed opening hours.</figcaption></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Identify and explain how consequential new evidence affects specific assumptions, interpretations and uncertainties underpinning their own retained provisional library decision from c3. <span class="util-outcome-id">(LO1)</span></li><li>Evaluate how the combined original and new evidence affects the relative merits of Options A, B and C, distinguishing justified inferences from conclusions that exceed the available evidence. <span class="util-outcome-id">(LO2)</span></li><li>Justify a decision to maintain, qualify or revise their original recommendation, calibrating confidence in proportion to the combined evidence and distinguishing their reasoning from confirmation bias and overreaction to recent findings. <span class="util-outcome-id">(LO3)</span></li><li>Identify consequential uncertainties that remain unresolved and specify further evidence that could justify a future change in their recommendation or confidence. <span class="util-outcome-id">(LO4)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Revisit Your Original Reasoning</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your earlier work in c2 involved evaluating evidence, while c3 required you to make and justify a provisional library decision. This activity brings those capabilities together: rather than making a fresh decision, you will investigate how subsequent evidence affects the reasoning behind your existing recommendation.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>If you completed the earlier library decision activity (c3), retrieve your retained recommendation and justification, including the evidence, assumptions, trade-offs and uncertainties you recorded. You will use your own earlier reasoning to judge the significance of new information. Your previous responses have not been transferred automatically. Begin by establishing what you originally recommended and why, before examining the later evidence.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Analyse the relationship between evidence and justification. Distinguish an earlier assumption being challenged from an earlier observation being disproved. Consider which findings matter to your particular recommendation rather than assuming every new finding has equal significance.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which part of your original reasoning is most affected by the new information, and why does that particular connection matter?</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Consult your retained c3 response and record your original preferred option, its principal justification and at least one important assumption or uncertainty.</p></span></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a1-evidence-inference-01-activity-a1-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c4/activity-a1-materials-entry.png" alt="Concept map separating reported evidence, interpretation and decision implications; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-a1-evidence-inference-01-activity-a1-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption" id="figure-description-asset-vb-38-4-va-a1-evidence-inference-01-activity-a1-materials-entry"><strong>Figure 2.</strong> The figure distinguishes three stages: reported finding, interpretation in relation to an earlier assumption, and possible implication for a provisional recommendation. The reported finding is evidence available for inspection. Interpretation asks what that finding means for the learner&#39;s earlier reasoning. The decision implication concerns whether the justification may be strengthened, weakened, refined or left unchanged. An evidential limitation constrains the interpretation. The figure does not decide which effect applies to any particular finding.</figcaption></figure><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A1-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">The Original Library Decision</span></p><h3 class="util-md-heading util-md-heading--source-2">The original decision</h3><p><strong>Fictional university scenario — original evidence only</strong></p><p>A university is considering whether to change its library opening hours during the examination period. Three alternatives are available:</p><ul><li><strong>Option A — Maintain current hours:</strong> Keep the existing library opening arrangements.</li><li><strong>Option B — Extend throughout the examination period:</strong> Provide extended opening hours across the examination period.</li><li><strong>Option C — Target high-demand periods:</strong> Introduce extended opening hours on dates when demand is anticipated to be greatest.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Evidence available when the original decision was made</h3><table><thead><tr><th>Evidence source</th><th>Information available</th></tr></thead><tbody><tr><td>Voluntary student survey</td><td>240 students responded from a university population of approximately 12,000. Of those respondents, 168 supported extended opening hours. Participation was voluntary, so self-selection may affect how representative the results are.</td></tr><tr><td>Historical building-access records</td><td>Relatively low late-evening occupancy was recorded under the previous opening arrangements. These records do not establish how many students would use the library if substantially different hours were offered.</td></tr><tr><td>Student comments</td><td>A limited number of comments raised concerns about unequal access to suitable study space.</td></tr><tr><td>Operational estimates</td><td>Provisional estimates identified staffing, security and other operational costs associated with extended opening.</td></tr></tbody></table><p>In <strong>c2</strong>, you evaluated this evidence. In <strong>c3</strong>, you selected an option and recorded a provisional recommendation with supporting reasoning.</p><p><strong>Before continuing:</strong> Retrieve your actual retained c3 response. Record what you recommended, which evidence mattered most, and which assumptions or uncertainties shaped your judgement. Your earlier response has not been transferred automatically into this activity.</p><p>The next material contains information that became available <strong>after</strong> that provisional decision.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Once you have established that original context, examine the later evidence.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A1-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">My Original Reasoning and the New Findings</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify at least two specific connections between the new findings and your earlier reasoning. For each connection, explain whether the finding strengthens, weakens, refines or leaves unchanged the relevant assumption or interpretation.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A1-M2" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Later Evidence: Follow-up Review</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-2">Follow-up evidence</h3><p><strong>Simulated evidence — fictional university scenario</strong></p><p>After the original recommendation was recorded, a follow-up review produced three additional findings. These are later developments, not replacements for the evidence considered in c2 and c3.</p><h3 class="util-md-heading util-md-heading--source-3">Finding 1 — When late-evening use occurred</h3><p>A closer examination of records from the <strong>previous examination period</strong> found that late-evening library occupancy was <strong>concentrated on particular high-demand dates</strong> rather than distributed evenly throughout the period.</p><p><strong>Evidence boundary:</strong> These are observations of use under previous arrangements. They cannot establish demand under a substantial extension of opening hours.</p><h3 class="util-md-heading util-md-heading--source-3">Finding 2 — Experiences of late-evening users</h3><p>Among the students using the library late in the evening, reports of <strong>difficulty finding suitable study space elsewhere</strong> were disproportionately common.</p><p><strong>Evidence boundary:</strong> The finding concerns the experiences reported by late-evening users. It does not establish how widespread the same difficulty is across the entire student population.</p><h3 class="util-md-heading util-md-heading--source-3">Finding 3 — Revised operational costs</h3><p>A revised cost estimate found that <strong>targeted extensions would be materially less expensive than extending opening hours throughout the examination period</strong>.</p><p><strong>Evidence boundary:</strong> This is a comparison of estimated costs between two approaches. It does not establish the level of future student demand or the educational benefit of either approach.</p><h3 class="util-md-heading util-md-heading--source-3">Your investigation</h3><p>Compare these findings with the reasoning you actually recorded in c3. Select at least two findings that connect to important elements of your earlier justification. For each, identify the earlier assumption or interpretation involved and explain whether the new information <strong>strengthens, weakens, refines or leaves it unchanged</strong>.</p><p>Keep three things distinct: what the follow-up review reports, what you infer from it, and what remains uncertain. Do not assume that receiving new evidence necessarily requires changing your original recommendation.</p></article></li></ol></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify an important limitation of the new evidence and explain how it restricts the conclusion you can draw.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A concise, evidence-linked analysis grounded in the learner&#39;s actual retained c3 response. The analysis accurately identifies the original recommendation and its rationale, connects at least two consequential new findings to specific earlier assumptions or interpretations, explains the direction and significance of each connection, and recognises a limitation that prevents an unsupported conclusion. The analysis does not assume that new evidence necessarily invalidates the original decision.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-original-recommendation-1" data-response-part-id="A1-template-section-a1-m3-section-original-recommendation-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-template-section-a1-m3-section-original-recommendation-1-label" for="learner-workspace-a1-a1-template-section-a1-m3-section-original-recommendation-1">Original recommendation</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-template-section-a1-m3-section-original-recommendation-1-desc">[Enter the option you actually selected in c3.]</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-template-section-a1-m3-section-original-recommendation-1" name="learner-workspace-a1-a1-template-section-a1-m3-section-original-recommendation-1" rows="5" aria-describedby="learner-workspace-a1-a1-template-section-a1-m3-section-original-recommendation-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-original-justification-2" data-response-part-id="A1-template-section-a1-m3-section-original-justification-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-template-section-a1-m3-section-original-justification-2-label" for="learner-workspace-a1-a1-template-section-a1-m3-section-original-justification-2">Original justification</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-template-section-a1-m3-section-original-justification-2-desc">[Enter the main reasons you gave for that option, including the original evidence you relied on.]</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-template-section-a1-m3-section-original-justification-2" name="learner-workspace-a1-a1-template-section-a1-m3-section-original-justification-2" rows="6" aria-describedby="learner-workspace-a1-a1-template-section-a1-m3-section-original-justification-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-earlier-assumption-or-uncertainty-3" data-response-part-id="A1-template-section-a1-m3-section-earlier-assumption-or-uncertainty-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-template-section-a1-m3-section-earlier-assumption-or-uncertainty-3-label" for="learner-workspace-a1-a1-template-section-a1-m3-section-earlier-assumption-or-uncertainty-3">Earlier assumption or uncertainty</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-template-section-a1-m3-section-earlier-assumption-or-uncertainty-3-desc">[Identify an assumption, interpretation or unresolved uncertainty that mattered to your original decision.]</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-template-section-a1-m3-section-earlier-assumption-or-uncertainty-3" name="learner-workspace-a1-a1-template-section-a1-m3-section-earlier-assumption-or-uncertainty-3" rows="6" aria-describedby="learner-workspace-a1-a1-template-section-a1-m3-section-earlier-assumption-or-uncertainty-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-first-new-finding-and-its-significance-4" data-response-part-id="A1-template-section-a1-m3-section-first-new-finding-and-its-significance-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-template-section-a1-m3-section-first-new-finding-and-its-significance-4-label" for="learner-workspace-a1-a1-template-section-a1-m3-section-first-new-finding-and-its-significance-4">First new finding and its significance</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-template-section-a1-m3-section-first-new-finding-and-its-significance-4-desc">[Identify one reported finding. Explain which part of your original reasoning it affects, whether it strengthens, weakens, refines or leaves that reasoning unchanged, and why.]</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-template-section-a1-m3-section-first-new-finding-and-its-significance-4" name="learner-workspace-a1-a1-template-section-a1-m3-section-first-new-finding-and-its-significance-4" rows="6" aria-describedby="learner-workspace-a1-a1-template-section-a1-m3-section-first-new-finding-and-its-significance-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-second-new-finding-and-its-significance-5" data-response-part-id="A1-template-section-a1-m3-section-second-new-finding-and-its-significance-5"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-template-section-a1-m3-section-second-new-finding-and-its-significance-5-label" for="learner-workspace-a1-a1-template-section-a1-m3-section-second-new-finding-and-its-significance-5">Second new finding and its significance</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-template-section-a1-m3-section-second-new-finding-and-its-significance-5-desc">[Identify a different reported finding. Explain its connection to another relevant part of your reasoning, or to the same assumption from a different perspective.]</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-template-section-a1-m3-section-second-new-finding-and-its-significance-5" name="learner-workspace-a1-a1-template-section-a1-m3-section-second-new-finding-and-its-significance-5" rows="6" aria-describedby="learner-workspace-a1-a1-template-section-a1-m3-section-second-new-finding-and-its-significance-5-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="6" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-important-evidence-limitation-6" data-response-part-id="A1-template-section-a1-m3-section-important-evidence-limitation-6"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-template-section-a1-m3-section-important-evidence-limitation-6-label" for="learner-workspace-a1-a1-template-section-a1-m3-section-important-evidence-limitation-6">Important evidence limitation</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="learner-workspace-a1-a1-template-section-a1-m3-section-important-evidence-limitation-6-desc"><p>[Identify a limitation that prevents you from drawing a stronger conclusion. Explain which inference the limitation restricts.]</p><h3 class="util-md-heading util-md-heading--source-3">Check the logic of your analysis</h3><p>An observation can remain accurate even when its interpretation changes. For example, a historical record of low use under one set of opening arrangements does not become false when someone questions whether it predicts use under different arrangements. Make sure your response distinguishes <strong>the observation</strong>, <strong>your interpretation</strong> and <strong>the decision implication</strong>.</p></div><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-template-section-a1-m3-section-important-evidence-limitation-6" name="learner-workspace-a1-a1-template-section-a1-m3-section-important-evidence-limitation-6" rows="6" aria-describedby="learner-workspace-a1-a1-template-section-a1-m3-section-important-evidence-limitation-6-desc"></textarea></div></div></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a1" data-composition-moment="check" data-activity-id="A1" aria-labelledby="learner-check-a1-heading"><h3 class="util-composition-moment-heading" id="learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a1">Back to your task (Revisit Your Original Reasoning)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m4-c-0" data-revision-criterion-id="a1-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you represented your actual retained c3 recommendation and reasoning faithfully?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Reconsideration is meaningful only when the later findings are compared with the judgement you really made, rather than an assumed or reconstructed position.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The original option matches the recommendation recorded in my retained c3 response.</li><li><span class="util-guided-review__feature-key">B.</span> My original justification identifies the evidence or trade-offs that influenced that choice.</li><li><span class="util-guided-review__feature-key">C.</span> I have identified an assumption or uncertainty relevant to my original reasoning.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Consult your retained c3 record and replace any assumed option with the option you actually selected.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Recover the survey, occupancy, access or operational considerations you actually used, and explain their role in your earlier judgement.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify what your earlier recommendation depended on but the available evidence could not fully establish, such as future use under different opening hours.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-0" data-checklist-item-id="checklist-a1-a1-m4-item-0"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m4-c-1" data-revision-criterion-id="a1-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you connected at least two specific later findings to identifiable parts of your earlier reasoning?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Simply repeating the new information does not demonstrate whether it changes the justification for your particular decision.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> I identify two distinct findings from the follow-up review.</li><li><span class="util-guided-review__feature-key">B.</span> Each finding is linked to a particular assumption, interpretation or trade-off in my c3 justification.</li><li><span class="util-guided-review__feature-key">C.</span> I explain whether each connection strengthens, weakens, refines or leaves unchanged the relevant reasoning.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Select two of the reported occupancy, access or cost findings and state their actual content before interpreting them.</li><li><span class="util-guided-review__feature-key">Missing B:</span> For each finding, name the earlier reasoning it bears on and explain the connection rather than describing the finding in isolation.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Add a directional judgement for each connection and justify it using the relationship between the new finding and the earlier assumption.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-1" data-checklist-item-id="checklist-a1-a1-m4-item-1"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m4-c-2" data-revision-criterion-id="a1-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you distinguished reported evidence from the conclusions you infer from it?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confusing observation with inference can turn limited historical or comparative information into an unwarranted prediction or policy conclusion.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My description of each finding stays within what the follow-up review actually reports.</li><li><span class="util-guided-review__feature-key">B.</span> I explain any decision implication as an interpretation rather than an established fact.</li><li><span class="util-guided-review__feature-key">C.</span> I do not treat a comparative cost estimate as evidence of future demand.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Remove any invented occupancy figures, demand forecasts or cost amounts, and restate the reported finding at its supplied level of detail.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify the inferential step between the reported finding and your judgement about an option; qualify that step where other interpretations remain possible.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Separate what the revised estimate says about relative expenditure from what the occupancy and access findings can and cannot say about likely use.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-2" data-checklist-item-id="checklist-a1-a1-m4-item-2"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m4-c-3" data-revision-criterion-id="a1-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you identified a limitation that materially restricts your conclusion?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A consequential limitation determines how much confidence the evidence can support, rather than merely adding a routine caveat.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> I identify a limitation relevant to one of the conclusions I am considering.</li><li><span class="util-guided-review__feature-key">B.</span> I explain what stronger conclusion the limitation prevents.</li><li><span class="util-guided-review__feature-key">C.</span> My analysis leaves open maintenance, qualification or revision when each is supported by reasoning.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Connect a specific limitation, such as historical use not predicting demand under substantial extensions, to the claim you might otherwise make.</li><li><span class="util-guided-review__feature-key">Missing B:</span> State which prediction or generalisation cannot be established from the available records or reported experiences.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Remove any assumption that the presence of new information automatically invalidates the original option; assess its significance for your actual justification.</li></ul></div><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-3" data-checklist-item-id="checklist-a1-a1-m4-item-3"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Reassess the Three Library Options</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">You have identified how new evidence affects particular elements of your original reasoning. You can now extend that analysis beyond your initial preference by examining what the combined evidence means for all three available courses of action. This tests whether your reconsideration is genuinely comparative rather than focused only on defending or replacing your original choice.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>The new findings may affect the relative merits of the three library options differently. Reconsider the alternatives using the original evidence and the later developments together. The aim is to evaluate how the balance of evidence and trade-offs has changed, not to identify a predetermined correct option.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Evaluate the alternatives against access needs, demand evidence, operational costs and uncertainty. Distinguish a strengthened comparative case from proof that an option is necessarily best. Preserve the relevance of the original evidence while assessing the significance of later findings.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which difference between the three options has become more important after the follow-up review, and what uncertainty prevents that difference from settling the decision automatically?</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Reconsider Options A, B and C using the original evidence and the later occupancy, access and cost findings.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A2-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">The Complete Library Evidence Record</span></p><h3 class="util-md-heading util-md-heading--source-2">Comparing the available options</h3><p><strong>Simulated evidence — fictional university scenario</strong></p><p>The university must reconsider three unchanged alternatives:</p><table><thead><tr><th>Option</th><th>Proposed opening arrangement</th></tr></thead><tbody><tr><td><strong>A</strong></td><td>Maintain the existing library opening hours.</td></tr><tr><td><strong>B</strong></td><td>Extend library opening hours throughout the examination period.</td></tr><tr><td><strong>C</strong></td><td>Introduce targeted extensions on dates when demand is anticipated to be greatest.</td></tr></tbody></table><h3 class="util-md-heading util-md-heading--source-3">Evidence available for the original decision</h3><table><thead><tr><th>Source</th><th>Reported observation or estimate</th><th>Stated limitation</th></tr></thead><tbody><tr><td>Voluntary survey</td><td>240 responses from approximately 12,000 students; 168 respondents supported extended opening hours.</td><td>Voluntary participation may involve self-selection.</td></tr><tr><td>Building-access records</td><td>Relatively low late-evening occupancy under previous opening arrangements.</td><td>Past occupancy cannot establish demand under substantially extended hours.</td></tr><tr><td>Student comments</td><td>A limited number of comments concerned unequal access to suitable study space.</td><td>The comments are limited in number.</td></tr><tr><td>Operational planning</td><td>Provisional staffing, security and other operational costs were identified for extended opening.</td><td>Estimates were provisional.</td></tr></tbody></table><h3 class="util-md-heading util-md-heading--source-3">Evidence reported after the original decision</h3><table><thead><tr><th>Follow-up area</th><th>Reported finding</th><th>Stated limitation</th></tr></thead><tbody><tr><td>Timing of use</td><td>During the previous examination period, late-evening occupancy was concentrated on particular high-demand dates.</td><td>Historical patterns do not establish future demand under changed hours.</td></tr><tr><td>Access to alternative study space</td><td>Late-evening library users disproportionately reported difficulty finding suitable study space elsewhere.</td><td>Experiences of these users do not establish the prevalence of the problem among all students.</td></tr><tr><td>Revised cost comparison</td><td>Targeted extensions were estimated to cost materially less than extensions throughout the examination period.</td><td>Relative cost does not establish the future use or educational benefit of either approach.</td></tr></tbody></table><h3 class="util-md-heading util-md-heading--source-3">Comparative decision context</h3><p>The university must weigh access to study space against staffing, security and other operational commitments. A change in opening hours may affect behaviour, so observations from previous arrangements cannot be treated as a direct forecast of what will happen under a new policy.</p><p>The three options differ in <strong>how much additional provision</strong> they would offer and <strong>when that provision would be available</strong>. The evidence can inform the comparison, but it does not supply a guaranteed outcome for any option.</p><p>Use this record to assess all three alternatives, including those you did not originally recommend. Distinguish evidence that bears on an option&#39;s potential value from evidence that establishes its likely effectiveness.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>For each option, identify a relevant consideration supporting it and a consequential limitation or trade-off.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a2-a2-m2" data-material-source-id="A2-M2" data-activity-id="A2"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A2-M2" data-material-type="comparison_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Three-Option Evidence Comparison</span></p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="a2-a2-m2-col-option-0">Option</th><th scope="col" id="a2-a2-m2-col-supporting-evidence-or-consideration-1">Supporting evidence or consideration</th><th scope="col" id="a2-a2-m2-col-consequential-limitation-or-trade-off-2">Consequential limitation or trade-off</th><th scope="col" id="a2-a2-m2-col-effect-of-later-evidence-on-its-comparative-case-3">Effect of later evidence on its comparative case</th></tr></thead><tbody><tr><th scope="row" id="a2-a2-m2-row-0" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed"><strong>A — Maintain existing hours</strong></th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r0-c1" name="a2-a2-m2-input-r0-c1" data-learner-cell="a2-a2-m2-input-r0-c1" rows="3" aria-labelledby="a2-a2-m2-row-0 a2-a2-m2-col-supporting-evidence-or-consideration-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r0-c2" name="a2-a2-m2-input-r0-c2" data-learner-cell="a2-a2-m2-input-r0-c2" rows="3" aria-labelledby="a2-a2-m2-row-0 a2-a2-m2-col-consequential-limitation-or-trade-off-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r0-c3" name="a2-a2-m2-input-r0-c3" data-learner-cell="a2-a2-m2-input-r0-c3" rows="3" aria-labelledby="a2-a2-m2-row-0 a2-a2-m2-col-effect-of-later-evidence-on-its-comparative-case-3" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a2-a2-m2-row-1" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed"><strong>B — Extend throughout the examination period</strong></th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r1-c1" name="a2-a2-m2-input-r1-c1" data-learner-cell="a2-a2-m2-input-r1-c1" rows="3" aria-labelledby="a2-a2-m2-row-1 a2-a2-m2-col-supporting-evidence-or-consideration-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r1-c2" name="a2-a2-m2-input-r1-c2" data-learner-cell="a2-a2-m2-input-r1-c2" rows="3" aria-labelledby="a2-a2-m2-row-1 a2-a2-m2-col-consequential-limitation-or-trade-off-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r1-c3" name="a2-a2-m2-input-r1-c3" data-learner-cell="a2-a2-m2-input-r1-c3" rows="3" aria-labelledby="a2-a2-m2-row-1 a2-a2-m2-col-effect-of-later-evidence-on-its-comparative-case-3" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a2-a2-m2-row-2" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed"><strong>C — Target extensions to anticipated high-demand dates</strong></th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r2-c1" name="a2-a2-m2-input-r2-c1" data-learner-cell="a2-a2-m2-input-r2-c1" rows="3" aria-labelledby="a2-a2-m2-row-2 a2-a2-m2-col-supporting-evidence-or-consideration-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r2-c2" name="a2-a2-m2-input-r2-c2" data-learner-cell="a2-a2-m2-input-r2-c2" rows="3" aria-labelledby="a2-a2-m2-row-2 a2-a2-m2-col-consequential-limitation-or-trade-off-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r2-c3" name="a2-a2-m2-input-r2-c3" data-learner-cell="a2-a2-m2-input-r2-c3" rows="3" aria-labelledby="a2-a2-m2-row-2 a2-a2-m2-col-effect-of-later-evidence-on-its-comparative-case-3" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain how the later evidence changes, strengthens or leaves unresolved its comparative case.</p></span></div><article class="util-prompt-set util-prose-measure" data-material-id="A2-M3" data-material-type="prompt_set" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-prompt-set-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"></path></svg></span><span class="util-semantic-icon__label">Synthesize the Comparative Evidence</span></p><h3 class="util-md-heading util-md-heading--source-2">Your comparative conclusion</h3><p>Write a short connected paragraph explaining <strong>how the combined evidence has changed the relative merits of Options A, B and C</strong>. You do not need to select your final recommendation yet.</p><p>Your conclusion should draw together the following tensions rather than treating them as separate checkboxes:</p><ul><li>The voluntary survey records support for longer hours among respondents, while possible self-selection limits what can be inferred about demand across the university. Consider how this affects claims about the breadth of provision needed.</li><li>Historical occupancy was relatively low overall, while the later review identifies concentration on particular dates. Explain how these observations can both be accurate and why neither directly predicts use under substantially changed hours.</li><li>Reports of difficulty finding alternative study space give an access-related reason to examine provision, but the experiences of late-evening users cannot automatically be generalised to all students.</li><li>The revised estimate changes the <strong>comparative cost</strong> of targeted and period-wide extensions. Weigh that difference against the possible access implications of offering fewer extended sessions.</li></ul><p>Bring these strands together into a judgement about <strong>which differences between the options now matter most</strong>. Explain why those differences matter and identify at least one uncertainty that prevents the comparison from settling itself.</p><p><strong>Your response:</strong></p><p>[Write your evidence-linked comparative conclusion here. Do not yet commit to maintaining or changing your original recommendation.]</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Produce a short comparative conclusion identifying which differences between the options now matter most, without yet requiring a final change to your original recommendation.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A completed three-option comparison that accurately distinguishes the benefits, limitations and uncertainties associated with Options A, B and C. Each option is evaluated using relevant original and later evidence rather than generic advantages or disadvantages. The concluding comparison explains how the relative merits have changed or remained uncertain, recognises the revised cost advantage of targeted extensions without treating it as decisive, and avoids unsupported claims about future demand.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-task-step-step-3-3" data-response-part-id="A2-task-step-step-3-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-task-step-step-3-3-label" for="learner-workspace-a2-a2-task-step-step-3-3">Your response</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-task-step-step-3-3-desc">Explain how the later evidence changes, strengthens or leaves unresolved its comparative case.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-task-step-step-3-3" name="learner-workspace-a2-a2-task-step-step-3-3" rows="6" aria-describedby="learner-workspace-a2-a2-task-step-step-3-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-task-step-step-4-4" data-response-part-id="A2-task-step-step-4-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-task-step-step-4-4-label" for="learner-workspace-a2-a2-task-step-step-4-4">Your response</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-task-step-step-4-4-desc">Produce a short comparative conclusion identifying which differences between the options now matter most, without yet requiring a final change to your original recommendation.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-task-step-step-4-4" name="learner-workspace-a2-a2-task-step-step-4-4" rows="6" aria-describedby="learner-workspace-a2-a2-task-step-step-4-4-desc"></textarea></div></div></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a2" data-composition-moment="check" data-activity-id="A2" aria-labelledby="learner-check-a2-heading"><h3 class="util-composition-moment-heading" id="learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a2">Back to your task (Reassess the Three Library Options)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m4-c-0" data-revision-criterion-id="a2-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you evaluated Options A, B and C rather than concentrating only on your original preference?</p><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A comparison restricted to the preferred option cannot establish how the available alternatives differ under the combined evidence.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each of the three options has a substantive supporting consideration.</li><li><span class="util-guided-review__feature-key">B.</span> Each option has a consequential limitation or trade-off.</li><li><span class="util-guided-review__feature-key">C.</span> The later evidence is considered in relation to all three options.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> For any option lacking a supporting consideration, identify a relevant access, demand or operational consideration that could count in its favour.</li><li><span class="util-guided-review__feature-key">Missing B:</span> For any option lacking a limitation, identify what its opening arrangement could leave unmet or what additional operational commitment it could require.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain for each option whether the occupancy pattern
